# Packaging only: PyPI carries the Rust binary as a wheel, so `uv tool install
# vimniscient` keeps working. The app itself is the crate in Cargo.toml.
[project]
name = "vimniscient"
dynamic = ["version"]
description = "Get fluent in Vim in fifteen minutes a day, in your own Neovim."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.8"
authors = [{ name = "Dimitri F. Crooijmans" }]
keywords = ["vim", "neovim", "lazyvim", "omarchy", "trainer", "spaced-repetition", "tui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Education",
    "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://vimniscient.com"
Source = "https://github.com/dialectmaterial/Vimniscient"
Issues = "https://github.com/dialectmaterial/Vimniscient/issues"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
