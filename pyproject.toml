[project]
name = "vimniscient"
version = "0.1.0"
description = "Absolute vim: a daily trainer for Vim, LazyVim and Omarchy"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "textual>=8",
    "pyyaml>=6",
]

[project.scripts]
vimniscient = "vimniscient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
