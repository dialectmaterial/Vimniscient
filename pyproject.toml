[project]
name = "vimniscient"
version = "0.2.1"
description = "Get fluent in Vim in fifteen minutes a day, in your own Neovim."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Dimitri F. Crooijmans" }]
keywords = ["vim", "neovim", "lazyvim", "omarchy", "trainer", "spaced-repetition", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Text Editors",
]
dependencies = [
    "textual>=8",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://vimniscient.com"
Source = "https://github.com/dialectmaterial/Vimniscient"
Issues = "https://github.com/dialectmaterial/Vimniscient/issues"

[project.scripts]
vimniscient = "vimniscient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# the app and what it needs to build and test; not the screenshots
include = ["/src", "/tests", "/extras", "/LICENSE", "/README.md", "/pyproject.toml"]
