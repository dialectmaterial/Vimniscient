deck: lazyvim
title: LazyVim
requires: lazyvim
style: keys
case_sensitive: true
# The core set, introduced first. After it come the keymaps in `from_config`,
# read from your own Neovim config so their names and keys follow your setup
# (any that your config doesn't have are left out).
# LSP keys are listed here because they only exist once a language server attaches.
cards:
  - {prompt: Find files (root dir), answer: ['<leader><Space>', '<leader>ff']}
  - {prompt: Grep the project (root dir), answer: [<leader>/, <leader>sg]}
  - {prompt: Switch buffer, answer: ['<leader>,', '<leader>fb']}
  - {prompt: Recent files, answer: [<leader>fr]}
  - {prompt: File explorer (neo-tree), answer: [<leader>e], note: 'e is explorer.'}
  - {prompt: Next buffer, answer: [<S-l>, ']b']}
  - {prompt: Previous buffer, answer: [<S-h>, '[b']}
  - {prompt: Delete the buffer, answer: [<leader>bd]}
  - {prompt: Split the window below, answer: ['<leader>-']}
  - {prompt: Split the window to the right, answer: ['<leader>|']}
  - {prompt: Move to the window on the left, answer: [<C-h>]}
  - {prompt: Search keymaps, answer: [<leader>sk]}
  - {prompt: Search help pages, answer: [<leader>sh]}
  - {prompt: Lazygit, answer: [<leader>gg]}
  - {prompt: Comment the line, answer: [gcc]}
  - {prompt: Flash jump (type a few characters, then a label), answer: [s]}
  - {prompt: Go to definition, answer: [gd]}
  - {prompt: Show references, answer: [gr]}
  - {prompt: Hover documentation, answer: [K]}
  - {prompt: Code action, answer: [<leader>ca]}
  - {prompt: Rename the symbol, answer: [<leader>cr]}
  - {prompt: Next diagnostic, answer: [']d']}
  - {prompt: Previous diagnostic, answer: ['[d']}
  - {prompt: Format the file, answer: [<leader>cf]}
  - {prompt: Diagnostics list (Trouble), answer: [<leader>xx]}
  - {prompt: Toggle a terminal, answer: [<C-/>, <leader>ft]}
  - {prompt: Quit everything, answer: [<leader>qq]}
  - {prompt: 'neo-tree: open the file with the system app', answer: [O]}
  - {prompt: 'neo-tree: add a file or folder', answer: [a]}
  - {prompt: 'neo-tree: rename', answer: [r]}
  - {prompt: 'neo-tree: delete', answer: [d]}
  - {prompt: 'neo-tree: toggle hidden files', answer: [H]}
  - {prompt: 'neo-tree: show all neo-tree keys', answer: ['?']}

# Worth learning beyond the core, in the order they're introduced.
from_config:
  - '<leader>fn'   # new file
  - '<leader>fc'   # find config file
  - '<leader>sr'   # search and replace
  - '<leader>sw'   # search for the word under the cursor
  - '<leader>sR'   # resume the last picker
  - '<leader>sb'   # lines in this buffer
  - '<leader>sd'   # diagnostics
  - '<leader>su'   # undotree
  - '<leader>`'    # other buffer
  - '<leader>bo'   # delete other buffers
  - '<leader>bp'   # pin buffer
  - '<leader>wd'   # delete window
  - '<leader>gs'   # git status
  - '<leader>gb'   # git blame line
  - '<leader>gd'   # git diff
  - '<leader>gl'   # git log
  - '<leader>cd'   # line diagnostics
  - '<leader>cs'   # symbols
  - '<leader>xq'   # quickfix list
  - '<leader>ql'   # restore last session
  - '<leader>:'    # command history
  - '<leader>.'    # scratch buffer
  - '<leader>?'    # buffer keymaps
  - '<leader>n'    # notification history
  - '<leader>un'   # dismiss notifications
  - '<leader>uw'   # toggle wrap
  - '<leader>ul'   # toggle line numbers
  - '<leader>us'   # toggle spelling
  - '<leader>ud'   # toggle diagnostics
  - '<leader>uz'   # zen mode
  - '<leader>l'    # Lazy (plugins)
  - '<leader><Tab><Tab>'   # new tab
  - '<leader><Tab>]'       # next tab
  - '<leader><Tab>d'       # close tab
