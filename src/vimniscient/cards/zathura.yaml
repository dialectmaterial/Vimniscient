deck: zathura
title: Zathura (PDF)
requires: zathura
style: keys
case_sensitive: true
# Defaults from zathura(1); ~/.config/zathura/zathurarc doesn't change any keys.
cards:
  - {prompt: Next page, answer: [J, <PageDown>]}
  - {prompt: Previous page, answer: [K, <PageUp>]}
  - {prompt: Half a page down, answer: [<C-d>]}
  - {prompt: Go to the first page, answer: [gg]}
  - {prompt: Go to the last page, answer: [G]}
  - {prompt: Go to page 12, answer: [12G]}
  - {prompt: Search the text, answer: [/]}
  - {prompt: Fit the page width, answer: [s]}
  - {prompt: Fit the whole page, answer: [a]}
  - {prompt: Zoom in, answer: ['+', zI]}
  - {prompt: Zoom out, answer: ['-', zO]}
  - {prompt: Zoom back to the original size, answer: ['=', z0]}
  - {prompt: Dark mode (recolor), answer: [<C-r>]}
  - {prompt: Show the table of contents, answer: [<Tab>]}
  - {prompt: Toggle two pages side by side, answer: [d]}
  - {prompt: Follow a link with the keyboard, answer: [f]}
  - {prompt: Rotate the page, answer: [r]}
  - {prompt: Reload the document, answer: [R]}
  - {prompt: Jump back after following a link, answer: [<C-o>]}
  - {prompt: Set quickmark a, answer: [ma]}
  - {prompt: Go to quickmark a, answer: ["'a"]}
  - {prompt: Presentation mode, answer: [<F5>]}
  - {prompt: Fullscreen, answer: [<F11>]}
  - {prompt: Toggle the status bar, answer: [<C-n>]}
  - {prompt: Open another document, answer: [o]}
