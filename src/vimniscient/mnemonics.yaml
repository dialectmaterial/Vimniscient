# What every key in the lessons stands for, and the hook the lesson texts use.
#
# means: what Vim's own help (or the ed/ex history behind it) says the key is.
#        Empty when the key doesn't officially stand for anything.
# hook:  the sentence-sized idea the lesson texts are written around. Where the
#        key has a real name the hook explains it; where it has none, it's an
#        invented reading that fits what the key does.

# Operators: the verbs
c: {means: change, hook: "c changes: it deletes, then you type the new text"}
d: {means: delete, hook: "d deletes (into a register, so really it cuts)"}
y: {means: yank, hook: "y yanks: Vim's older word for copy"}
p: {means: put, hook: "p puts the last yank or delete after the cursor; P puts it before"}
gU: {means: make uppercase, hook: "U is Up: gU raises letters to capitals"}
gu: {means: make lowercase, hook: "u is down: gu lowers letters"}
g~: {means: switch case, hook: "the tilde is a wave: it flips each letter's case"}
">": {means: shift right, hook: "the arrow points the way the text moves: > pushes right"}
"<": {means: shift left, hook: "< pulls the text back to the left"}
gc: {means: comment (LazyVim, mini.comment), hook: "gc goes comment: it comments or uncomments"}

# Text objects: i and a, then the noun
i: {means: inner, hook: "i is inner: only the thing itself, no space or brackets"}
a: {means: "a / around", hook: "a reads as 'a word', 'a sentence': the thing plus what surrounds it"}
w: {means: word, hook: "w is a word of letters, digits and underscores"}
W: {means: WORD, hook: "big W, big WORD: everything between two spaces, dots and all"}
s: {means: sentence, hook: "s is a sentence: up to . ! or ? and a space"}
p (object): {means: paragraph, hook: "p is a paragraph: lines up to the next blank line"}
t (object): {means: tag, hook: "t is a tag: the text between <b> and </b>"}
'" (object)': {means: double-quoted string, hook: "the quote mark names the pair you mean"}
"( (object)": {means: "( ) block", hook: "the bracket names the pair: ( or ) for round ones"}
"[ (object)": {means: "[ ] block", hook: "[ names the square brackets"}
q (object): {means: any quote (LazyVim), hook: "q is quote: whichever quote is nearest"}
b (object): {means: any bracket (LazyVim), hook: "b is bracket: (), [] or {}, the nearest one"}
a (object): {means: argument (LazyVim), hook: "ia/aa: an argument, between commas"}
f (object): {means: function (LazyVim, treesitter), hook: "f is function: the whole def"}
c (object): {means: class (LazyVim, treesitter), hook: "c is class"}
e (object): {means: word segment (LazyVim), hook: "e is an element of a camelCase or snake_case name"}
d (object): {means: digits (LazyVim), hook: "d is digits"}
u (object): {means: usage / function call (LazyVim), hook: "u is use: a call like f(x)"}
g (object): {means: entire buffer (LazyVim), hook: "g is global: the whole file"}

# Motions
h j k l: {means: "left, down, up, right", hook: "j hooks down below the line, k reaches up"}
w (motion): {means: next word start, hook: "w walks to the next word"}
b: {means: back a word, hook: "b goes back"}
e: {means: end of word, hook: "e is end"}
f: {means: find character, hook: "f finds a letter on the line and lands on it"}
t: {means: till character, hook: "t goes till the letter: it stops one short"}
F T: {means: find / till backwards, hook: "capital means backwards for f and t"}
";": {means: repeat last f/t/F/T, hook: "a semicolon says 'and so on': the same find again"}
",": {means: repeat last f/t backwards, hook: "a comma steps back: the same find, the other way"}
"0": {means: first column, hook: "0 is column zero, the very start"}
"^": {means: first non-blank, hook: "^ points up at where the text starts, after the indent"}
$: {means: end of line, hook: "$ is the end, as in regex"}
"%": {means: matching pair, hook: "% is two circles split by a line: one bracket and its partner"}
gg: {means: go to first line, hook: "gg: go, go, all the way to the top"}
G: {means: go to last line (or line N), hook: "G goes to the end, or to line N with a count"}
"{ }": {means: previous / next paragraph, hook: "the braces hug a block: { is its top, } its bottom"}
/: {means: search forward, hook: "/ leans forward"}
"?": {means: search backward, hook: "? asks backwards"}
n N: {means: next / previous match, hook: "n is next; N is the other way"}
"*": {means: search word under cursor, hook: "the star marks this word, and looks for it everywhere"}
gn: {means: select next match, hook: "gn: go to the next match and grab it, so cgn changes the next one"}

# Line commands
D C: {means: "d$ / c$", hook: "capital D and C go big: to the end of the line"}
dd cc yy: {means: whole line, hook: "doubling the verb means the whole line"}
J: {means: join, hook: "J joins this line and the next"}
gJ: {means: join without spaces, hook: "gJ joins like German compounds: no space"}
A: {means: append at line end, hook: "A appends at the end"}
I: {means: insert at line start, hook: "I inserts at the start"}
o O: {means: open a line below / above, hook: "o opens a line below, O above"}
a (insert): {means: append after cursor, hook: "a appends after the cursor; ea appends at the end of the word"}
x: {means: delete character, hook: "x crosses a letter out"}
xp ddp: {means: swap characters / lines, hook: "cut, then put back one further: a swap"}
r: {means: replace one character, hook: "r replaces one letter"}
R: {means: Replace mode, hook: "R keeps replacing: you type over the text"}
"~": {means: switch case, hook: "the tilde wave flips the letter"}
<C-a>: {means: add, hook: "Ctrl-a adds 1 to the number"}
<C-x>: {means: subtract, hook: "Ctrl-x takes 1 away, crossed out"}
g<C-a>: {means: add in sequence, hook: "g makes the add grow down the block: 1, 2, 3"}
.: {means: repeat last change, hook: "the full stop says it again"}
u: {means: undo, hook: "u undoes"}

# Insert mode
<C-w>: {means: delete word before cursor, hook: "Ctrl-w wipes a word"}
<C-u>: {means: delete to line start, hook: "Ctrl-u undoes the line you were typing"}
<C-r>: {means: insert a register, hook: "Ctrl-r reads in a register; = makes it a calculator"}

# Visual mode
v: {means: visual, hook: "v is visual: you see what you'll act on"}
V: {means: visual line, hook: "capital V selects whole lines"}
<C-v>: {means: visual block, hook: "Ctrl-v cuts a vertical block out of the text"}
gv: {means: reselect last visual area, hook: "gv: give me my last selection back"}

# Macros, registers, marks
q: {means: record, hook: "q is a quill: it writes down what you do"}
"@": {means: execute register, hook: "@a plays back what is stored at a"}
"@@": {means: repeat last macro, hook: "@@: again, at the same place"}
'"': {means: register prefix, hook: "the quote marks a name: \"a means in register a"}
'"0': {means: yank register, hook: "0 holds the last yank, untouched by deletes"}
'"_': {means: black hole register, hook: "the underscore is the floor: text falls through and is gone"}
'"A': {means: append to register a, hook: "capital A appends to a"}
m: {means: mark, hook: "m marks a spot"}
"'": {means: jump to mark's line, hook: "the plain quote goes to the line"}
"`": {means: jump to mark's exact spot, hook: "the backtick goes to the exact letter"}
"``": {means: jump back, hook: "`` jumps back to where you came from"}
<C-o> <C-i>: {means: older / newer jump, hook: "Ctrl-o goes to the older spot, Ctrl-i comes back in"}

# Ex commands
":s": {means: substitute, hook: ":s substitutes"}
"% (range)": {means: "range: every line", hook: "% is all, like 100 percent of the lines"}
":g": {means: global, hook: ":g/re/p, global regular expression print, is where grep got its name"}
":v": {means: vglobal (inverse of :g), hook: ":v is the inverse: every line that doesn't match"}
"&": {means: the whole match, hook: "& is 'and': the match, and what you add to it"}
"\\1": {means: first captured group, hook: "\\1 points back at group one"}
"\\v": {means: very magic, hook: "\\v is very magic: brackets and + work without backslashes"}
":m": {means: move, hook: ":m moves lines"}
":t": {means: "transfer (copy), from ed", hook: ":t transfers a copy, as ed called it"}
":sort": {means: sort, hook: "n sorts as numbers, u keeps the unique ones"}
":!": {means: filter through a shell command, hook: "! hands the lines to the shell and takes back what it says"}
":r": {means: read, hook: ":r reads a file or a command's output in"}
":norm": {means: normal, hook: ":norm types normal-mode keys on every line"}
"]<Space>": {means: add blank line below (LazyVim), hook: "] goes down, and space is what it adds"}
