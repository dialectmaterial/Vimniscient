week: 2
day: 6
title: Visual mode
intro: |
  `v` is *visual*: you see what you'll act on. `v` selects characters,
  capital `V` whole lines. Move to grow the selection, then give an operator:
  `d`, `c`, `y`, `>`, `U` (up: uppercase), `u` (lowercase), `J` (join). `%`
  jumps to the matching bracket (picture two circles split by a line: a pair),
  so `v%` selects a bracketed group, and `c%` changes it without visual mode.
  Often an operator plus a motion is shorter.
keys: [v, V, "V>", vU, VJ, "%", c%]
tasks:
  - goal: 'Delete the first two lines with V.'
    start: |-
      ▮delete me
      and me
      V selects whole lines
    target: |-
      V selects whole lines
    solution: 'Vjd'
    hint: 'V selects the line, j extends it, d deletes.'
    variants:
      - goal: 'Delete the first two lines with V.'
        start: |-
          ▮V is linewise,
          so both lines go
          and this one stays
        target: |-
          and this one stays
  - goal: 'Uppercase "visual mode".'
    start: |-
      v is ▮visual mode: you see it
    target: |-
      v is VISUAL MODE: you see it
    solution: 'veeU'
    hint: 'v, then e e to the end of "mode", then U.'
    variants:
      - goal: 'Uppercase "visual selections".'
        start: |-
          U turns ▮visual selections up
        target: |-
          U turns VISUAL SELECTIONS up
  - goal: 'Join the first three lines.'
    start: |-
      ▮J
      joins
      lines
      but not this one
    target: |-
      J joins lines
      but not this one
    solution: 'VjjJ'
    hint: 'Select three lines with V j j and press J. (3J is shorter.)'
    variants:
      - start: |-
          ▮V
          then
          J
          joins
        target: |-
          V then J
          joins
  - goal: 'Indent the function body.'
    ft: python
    start: |-
      def visual():
      ▮see()
      select()
      act()
    target: |-
      def visual():
          see()
          select()
          act()
    solution: 'Vjj>'
    hint: 'V j j selects the three lines, > indents them.'
    variants:
      - goal: 'Indent the function body.'
        start: |-
          def indent():
          ▮push()
          right()
          once()
        target: |-
          def indent():
              push()
              right()
              once()
  - goal: 'Replace the whole condition with "ok".'
    ft: python
    start: |-
      if ▮(bracket and (partner)):
    target: |-
      if ok:
    solution: 'c%ok<Esc>'
    hint: '% jumps to the matching bracket, so c% changes the whole group. (v%c works too.)'
    variants:
      - goal: 'Replace the whole condition with "ok".'
        start: |-
          while ▮(i < n and (ok)):
        target: |-
          while ok:
