week: 2
day: 6
title: Visual mode
intro: |
  `v` selects characters, `V` whole lines. Move to grow the selection, then
  give an operator: `d`, `c`, `y`, `>`, `U` (uppercase), `u` (lowercase),
  `J` (join). `%` jumps to the matching bracket, so `v%` selects a bracketed
  group, and `c%` changes it without visual mode. Visual mode is for when you
  want to *see* what you'll change. Often an operator plus a motion is
  shorter.
keys: [v, V, "V>", vU, VJ, "%", c%]
tasks:
  - goal: 'Delete the two filler lines with V.'
    start: |-
      ▮um
      uh
      words
    target: |-
      words
    solution: 'Vjd'
    hint: 'V selects the line, j extends it, d deletes.'
    variants:
      - goal: 'Delete the two filler lines with V.'
        start: |-
          ▮er
          hmm
          phrases
        target: |-
          phrases
  - goal: 'Uppercase "stressed syllable".'
    start: |-
      the ▮stressed syllable here
    target: |-
      the STRESSED SYLLABLE here
    solution: 'veeU'
    hint: 'v, then e e to the end of "syllable", then U.'
    variants:
      - goal: 'Uppercase "focus particle".'
        start: |-
          the ▮focus particle here
        target: |-
          the FOCUS PARTICLE here
        hint: 'v, then e e to the end of "particle", then U.'
  - goal: 'Join the noun phrase on the first three lines.'
    start: |-
      ▮the
      small
      cat
      sleeps
    target: |-
      the small cat
      sleeps
    solution: 'VjjJ'
    hint: 'Select three lines with V j j and press J. (3J is shorter.)'
    variants:
      - goal: 'Join the noun phrase on the first three lines.'
        start: |-
          ▮a
          big
          dog
          barks
        target: |-
          a big dog
          barks
  - goal: 'Indent the function body.'
    ft: python
    start: |-
      def f():
      ▮x = 1
      y = 2
      return x
    target: |-
      def f():
          x = 1
          y = 2
          return x
    solution: 'Vjj>'
    hint: 'V j j selects the three lines, > indents them.'
    variants:
      - goal: 'Indent the function body.'
        start: |-
          def g():
          ▮a = 1
          b = 2
          return a
        target: |-
          def g():
              a = 1
              b = 2
              return a
  - goal: 'Replace the whole condition with "ok".'
    ft: python
    start: |-
      if ▮(ready and (x > 0)):
    target: |-
      if ok:
    solution: 'c%ok<Esc>'
    hint: '% jumps to the matching bracket, so c% changes the whole group. (v%c works too.)'
    variants:
      - goal: 'Replace the whole condition with "ok".'
        start: |-
          while ▮(i < n and (ok)):
        target: |-
          while ok:
