week: 4
day: 7
review: true
title: Week 4 review
skill: mixed
intro: |
  Ranges, `:sort`, filters, patterns, `:norm`, motions and indenting, mixed.
  Four weeks in, many commands should be moving from Fitts and Posner's
  associative stage (you know them, but slowly) to the autonomous one.
keys: [':m', ':sort', ':%!', ':%s', ':norm', '>i{']
tasks:
  - goal: 'Sort the lines and remove the duplicate.'
    start: |-
      ▮yank
      change
      yank
      delete
    target: |-
      change
      delete
      yank
    solution: ':sort u<CR>'
    hint: ':sort u'
    variants:
      - start: |-
          ▮unique
          sort
          unique
          only
        target: |-
          only
          sort
          unique
  - goal: 'Move the TODO line to the top.'
    start: |-
      move
      to top
      ▮TODO: use :m0
    target: |-
      TODO: use :m0
      move
      to top
    solution: ':m0<CR>'
    hint: ':m0'
    variants:
      - start: |-
          yank
          put
          ▮TODO: learn :m
        target: |-
          TODO: learn :m
          yank
          put
  - goal: 'Quote every word.'
    start: |-
      ▮word by word
    target: |-
      "word" "by" "word"
    solution: ':s/\w\+/"&"/g<CR>'
    hint: '\w\+ is a word, & is the match.'
    variants:
      - start: |-
          ▮f t F T
        target: |-
          "f" "t" "F" "T"
  - goal: 'Add "!" to the end of every line.'
    start: |-
      ▮Append
      At
      End
    target: |-
      Append!
      At!
      End!
    solution: ':%norm A!<CR>'
    hint: ':%norm A!'
    variants:
      - start: |-
          ▮Yank
          Put
          Repeat
        target: |-
          Yank!
          Put!
          Repeat!
  - goal: 'Number the lines with a shell command.'
    start: |-
      ▮filter
      through awk
    target: |-
      1 filter
      2 through awk
    solution: ':%!awk ''{print NR, $0}''<CR>'
    hint: 'awk ''{print NR, $0}'' prints the line number before each line. (Visual block g Ctrl-a can''t do this one.)'
    variants:
      - start: |-
          ▮NR
          is the line number
        target: |-
          1 NR
          2 is the line number
