week: 4
day: 7
review: true
title: Week 4 review
intro: |
  Ranges, `:sort`, filters, patterns, `:norm`, motions and indenting, mixed.
  Four weeks in, many commands should be moving from Fitts and Posner's
  associative stage (you know them, but slowly) to the autonomous one.
keys: [':m', ':sort', ':%!', ':%s', ':norm', '>i{']
tasks:
  - goal: 'Sort the memory researchers and remove the duplicate.'
    start: |-
      ▮Tulving
      Baddeley
      Tulving
      Bartlett
    target: |-
      Baddeley
      Bartlett
      Tulving
    solution: ':sort u<CR>'
    hint: ':sort u'
    variants:
      - goal: 'Sort the linguists and remove the duplicate.'
        start: |-
          ▮Labov
          Trudgill
          Labov
          Eckert
        target: |-
          Eckert
          Labov
          Trudgill
  - goal: 'Move the TODO line to the top.'
    start: |-
      phonology
      syntax
      ▮TODO: review the cards
    target: |-
      TODO: review the cards
      phonology
      syntax
    solution: ':m0<CR>'
    hint: ':m0'
    variants:
      - goal: 'Move the TODO line to the top.'
        start: |-
          morphology
          semantics
          ▮TODO: check the tags
        target: |-
          TODO: check the tags
          morphology
          semantics
  - goal: 'Quote every word.'
    start: |-
      ▮sit sat seat
    target: |-
      "sit" "sat" "seat"
    solution: ':s/\w\+/"&"/g<CR>'
    hint: '\w\+ is a word, & is the match.'
    variants:
      - goal: 'Quote every word.'
        start: |-
          ▮ship sheep chip
        target: |-
          "ship" "sheep" "chip"
  - goal: 'Add "!" to the end of every line.'
    start: |-
      ▮Hallo
      Hola
      Ciao
    target: |-
      Hallo!
      Hola!
      Ciao!
    solution: ':%norm A!<CR>'
    hint: ':%norm A!'
    variants:
      - goal: 'Add "!" to the end of every line.'
        start: |-
          ▮Bonjour
          Guten Tag
          Salve
        target: |-
          Bonjour!
          Guten Tag!
          Salve!
  - goal: 'Number the lines with a shell command.'
    start: |-
      ▮spacing
      testing
    target: |-
      1 spacing
      2 testing
    solution: ':%!awk ''{print NR, $0}''<CR>'
    hint: 'awk ''{print NR, $0}'' prints the line number before each line. (Visual block g Ctrl-a can''t do this one.)'
    variants:
      - goal: 'Number the lines with a shell command.'
        start: |-
          ▮Hopi
          Zuni
        target: |-
          1 Hopi
          2 Zuni
