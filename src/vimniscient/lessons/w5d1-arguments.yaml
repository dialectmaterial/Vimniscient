week: 5
day: 1
lazyvim: true
title: Arguments (LazyVim)
intro: |
  LazyVim adds text objects through mini.ai. `ia`/`aa` is a function
  argument: `cia` changes one, `daa` deletes it together with its comma, so
  the list stays tidy. Like all mini.ai objects it also finds the next
  argument when the cursor isn't on one yet.
keys: [cia, daa]
tasks:
  - goal: 'Change the middle argument to x.'
    ft: python
    start: |-
      f(a, ▮b, c)
    target: |-
      f(a, x, c)
    solution: ciax<Esc>
    hint: cia changes the argument under the cursor.
  - goal: 'Delete the middle argument and its comma.'
    ft: python
    start: |-
      f(a, ▮b, c)
    target: |-
      f(a, c)
    solution: daa
    hint: daa takes the comma with it.
  - goal: 'Delete the last argument.'
    ft: python
    start: |-
      f(a, b, ▮c)
    target: |-
      f(a, b)
    solution: daa
    hint: For the last argument, daa removes the comma before it.
  - goal: 'Drop the name parameter.'
    ft: python
    start: |-
      def greet(self, ▮name, age):
    target: |-
      def greet(self, age):
    solution: daa
    hint: daa works on parameters too.
  - goal: 'Change the first argument, starting from the beginning of the line.'
    ft: python
    start: |-
      ▮foo(a, b)
    target: |-
      foo(z, b)
    solution: ciaz<Esc>
    hint: mini.ai jumps to the next argument when the cursor isn't on one.
