week: 5
day: 1
lazyvim: true
title: Arguments (LazyVim)
intro: |
  LazyVim adds text objects through mini.ai. Here `a` names an *argument*:
  `ia` is the argument itself and `aa` an argument with its comma (the
  second `a` is a noun, the first one *around*): `cia` changes one, `daa` deletes it together with its comma, so
  the list stays tidy. Like all mini.ai objects it also finds the next
  argument when the cursor isn't on one yet.
keys: [cia, daa]
tasks:
  - goal: 'Change the middle argument to day3.'
    ft: python
    start: |-
      schedule(day1, ▮day2, day7)
    target: |-
      schedule(day1, day3, day7)
    solution: 'ciaday3<Esc>'
    hint: 'cia changes the argument under the cursor.'
    variants:
      - goal: 'Change the middle argument to w.'
        start: |-
          g(x, ▮y, z)
        target: |-
          g(x, w, z)
        solution: 'ciaw<Esc>'
  - goal: 'Delete the middle argument and its comma.'
    ft: python
    start: |-
      study(test, ▮reread, space)
    target: |-
      study(test, space)
    solution: 'daa'
    hint: 'daa takes the comma with it.'
    variants:
      - goal: 'Delete the middle argument and its comma.'
        start: |-
          g(x, ▮y, z)
        target: |-
          g(x, z)
  - goal: 'Delete the last argument.'
    ft: python
    start: |-
      learn(space, test, ▮highlight)
    target: |-
      learn(space, test)
    solution: 'daa'
    hint: 'For the last argument, daa removes the comma before it.'
    variants:
      - goal: 'Delete the last argument.'
        start: |-
          g(x, y, ▮z)
        target: |-
          g(x, y)
  - goal: 'Drop the cram parameter.'
    ft: python
    start: |-
      def review(self, ▮cram, interval):
    target: |-
      def review(self, interval):
    solution: 'daa'
    hint: 'daa works on parameters too.'
    variants:
      - goal: 'Drop the word parameter.'
        start: |-
          def tag(self, ▮word, pos):
        target: |-
          def tag(self, pos):
  - goal: 'Change the first argument to hook, starting from the beginning of the line.'
    ft: python
    start: |-
      ▮recall(cue, delay)
    target: |-
      recall(hook, delay)
    solution: 'ciahook<Esc>'
    hint: 'mini.ai jumps to the next argument when the cursor isn''t on one.'
    variants:
      - goal: 'Change the first argument to q, starting from the beginning of the line.'
        start: |-
          ▮bar(x, y)
        target: |-
          bar(q, y)
        solution: 'ciaq<Esc>'
