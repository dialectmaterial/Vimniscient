week: 4
day: 3
title: Patterns in :s
intro: |
  Useful pieces: `^` and `$` (start and end of line: the caret points up at
  where the line starts, the dollar closes the bill), `\s` whitespace, `\d`
  a digit, `\+` one or more, `.*` anything. In the replacement `&` is the
  whole match (read it as *and*: the match, and what you put around it).
  Starting a pattern with `\v` (*very magic*) lets you write
  `(`, `+` and `|` without backslashes.
keys: ['^', '$', '\s\+$', '\d\+', '&', '\v']
tasks:
  - goal: 'Delete the trailing spaces.'
    start: |-
      ▮encode␣␣␣
      store␣␣
      retrieve␣
    target: |-
      encode
      store
      retrieve
    solution: ':%s/\s\+$//<CR>'
    hint: '\s\+$ is one or more spaces right before the end of the line.'
    variants:
      - goal: 'Delete the trailing spaces.'
        start: |-
          ▮onset␣␣
          nucleus␣␣␣
          coda␣
        target: |-
          onset
          nucleus
          coda
      - start: |-
          ▮spacing␣␣
          testing␣
          sleep␣␣␣
        target: |-
          spacing
          testing
          sleep
      - start: |-
          ▮f␣␣
          t␣
          F␣␣␣
        target: |-
          f
          t
          F
  - goal: 'Put every day number in square brackets.'
    start: |-
      ▮review on day 1, day 3, day 14
    target: |-
      review on day [1], day [3], day [14]
    solution: ':s/\d\+/[&]/g<CR>'
    hint: '& in the replacement is whatever matched.'
    variants:
      - goal: 'Put every tone number in square brackets.'
        start: |-
          ▮tone 1, tone 22, tone 214
        target: |-
          tone [1], tone [22], tone [214]
      - start: |-
          ▮Miller 7, Cowan 4
        target: |-
          Miller [7], Cowan [4]
      - start: |-
          ▮years 1885, 1956, 2006
        target: |-
          years [1885], [1956], [2006]
  - goal: 'Rewrite the date as day/month/year.'
    start: |-
      ▮2026-10-24
    target: |-
      24/10/2026
    solution: ':s#\v(\d+)-(\d+)-(\d+)#\3/\2/\1<CR>'
    hint: 'Any character can separate the parts of :s. # saves escaping the slashes.'
    variants:
      - goal: 'Rewrite the date as day/month/year.'
        start: |-
          ▮1957-02-14
        target: |-
          14/02/1957
      - start: |-
          ▮2026-11-02
        target: |-
          02/11/2026
      - start: |-
          ▮2026-10-29
        target: |-
          29/10/2026
  - goal: 'Make every line a list item.'
    start: |-
      ▮^ is the start
      $ is the end
      & is the match
    target: |-
      - ^ is the start
      - $ is the end
      - & is the match
    solution: ':%s/^/- /<CR>'
    hint: '^ matches the start of each line, so replacing it inserts there.'
    variants:
      - goal: 'Make every line a list item.'
        start: |-
          ▮onset
          nucleus
          coda
        target: |-
          - onset
          - nucleus
          - coda
      - start: |-
          ▮encode
          store
          retrieve
        target: |-
          - encode
          - store
          - retrieve
      - start: |-
          ▮spacing
          testing
          sleep
        target: |-
          - spacing
          - testing
          - sleep
  - goal: 'Join every line that ends with a comma to the next one.'
    start: |-
      ▮noun,
      verb
      subject,
      object
    target: |-
      noun, verb
      subject, object
    solution: ':g/,$/j<CR>'
    hint: ':g/,$/ finds the lines ending in a comma; j joins each one with the next.'
    variants:
      - goal: 'Join every line that ends with a comma to the next one.'
        start: |-
          ▮onset,
          nucleus
          topic,
          comment
        target: |-
          onset, nucleus
          topic, comment
      - start: |-
          ▮spacing,
          testing
          sleep,
          review
        target: |-
          spacing, testing
          sleep, review
      - start: |-
          ▮f,
          t
          F,
          T
        target: |-
          f, t
          F, T
