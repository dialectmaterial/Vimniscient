week: 2
day: 4
title: Case and numbers
intro: |
  `~` flips the case of one character: the tilde is a little wave. `gU`, `gu`
  and `g~` are operators: U is *up* (capitals), u is down. `gUiw` uppercases
  a word, `guu` lowercases a line. `Ctrl-a` *adds* one to the next number on
  the line and `Ctrl-x` crosses one out; with a count, `30 Ctrl-a` adds
  thirty. The cursor doesn't need to be on the number.
keys: ["~", gUiw, guu, g~iw, "<C-a>", "<C-x>"]
tasks:
  - goal: 'Capitalise the first letter.'
    start: |-
      ▮tilde flips one letter
    target: |-
      Tilde flips one letter
    solution: '~'
    hint: '~ flips the case of the character under the cursor.'
    variants:
      - goal: 'Capitalise the name.'
        start: |-
          ▮ebbinghaus tested himself
        target: |-
          Ebbinghaus tested himself
  - goal: 'Uppercase "up".'
    start: |-
      gU raises ▮up to capitals
    target: |-
      gU raises UP to capitals
    solution: 'gUiw'
    hint: 'gU is the uppercase operator; iw is the word.'
    variants:
      - goal: 'Uppercase "srs".'
        start: |-
          an ▮srs schedules your reviews
        target: |-
          an SRS schedules your reviews
  - goal: 'Make the whole line lowercase.'
    start: |-
      ▮GU LOWERS THE WHOLE LINE
    target: |-
      gu lowers the whole line
    solution: 'guu'
    hint: 'guu lowercases the line (gu + u, like dd).'
    variants:
      - goal: 'Make the whole line lowercase.'
        start: |-
          ▮DON'T SHOUT THE GLOSSES
        target: |-
          don't shout the glosses
  - goal: 'Make the sentence true: Ctrl-a adds 1.'
    start: |-
      ▮Ctrl-a adds 0 to the number
    target: |-
      Ctrl-a adds 1 to the number
    solution: '<C-a>'
    hint: 'Ctrl-a adds one to the next number on the line.'
    variants:
      - goal: 'Fitts and Posner named three stages of skill: fix the number.'
        start: |-
          ▮Fitts and Posner named 2 stages of skill
        target: |-
          Fitts and Posner named 3 stages of skill
  - goal: 'Ebbinghaus published in 1885: add 30 to the year.'
    start: |-
      ▮Ebbinghaus published in 1855
    target: |-
      Ebbinghaus published in 1885
    solution: '30<C-a>'
    hint: 'With a count, Ctrl-a adds that many.'
    variants:
      - goal: 'Miller''s magical number came out in 1956: add 30 to the year.'
        start: |-
          ▮Miller's magical number came out in 1926
        target: |-
          Miller's magical number came out in 1956
  - goal: 'Make the sentence true: 3 take away 1 leaves 2.'
    start: |-
      ▮Ctrl-x leaves 3 when you take 1 from 3
    target: |-
      Ctrl-x leaves 2 when you take 1 from 3
    solution: '<C-x>'
    hint: 'Ctrl-x takes one away from the next number.'
    variants:
      - goal: 'Cowan''s estimate is about four chunks: fix the number.'
        start: |-
          ▮Cowan's working memory holds about 5 chunks
        target: |-
          Cowan's working memory holds about 4 chunks
  - goal: 'Flip the case of the first word.'
    start: |-
      ▮tILDE flips the case
    target: |-
      Tilde flips the case
    solution: 'g~iw'
    hint: 'g~ flips case over a motion or text object.'
    variants:
      - goal: 'Flip the case of the first word.'
        start: |-
          ▮eBBINGHAUS and the forgetting curve
        target: |-
          Ebbinghaus and the forgetting curve
