week: 2
day: 4
title: Case and numbers
skill: edits
intro: |
  `~` flips the case of one character: the tilde is a little wave. `gU`, `gu`
  and `g~` are operators: U is *up* (capitals), u is down. `gUiw` uppercases
  a word, `guu` lowercases a line. `Ctrl-a` *adds* one to the next number on
  the line and `Ctrl-x` crosses one out; with a count, `30 Ctrl-a` adds
  thirty. The cursor doesn't need to be on the number.
keys: ["~", gUiw, guu, g~iw, "<C-a>", "<C-x>"]
tasks:
  - goal: 'Capitalise the first letter.'
    start: |-
      ▮tilde flips one letter
    target: |-
      Tilde flips one letter
    solution: '~'
    hint: '~ flips the case of the character under the cursor.'
    variants:
      - goal: 'Capitalise the first letter.'
        start: |-
          ▮the tilde is a wave
        target: |-
          The tilde is a wave
      - goal: 'Capitalise the first letter.'
        start: |-
          ▮the wave flips case
        target: |-
          The wave flips case
  - goal: 'Uppercase "up".'
    start: |-
      gU raises ▮up to capitals
    target: |-
      gU raises UP to capitals
    solution: 'gUiw'
    hint: 'gU is the uppercase operator; iw is the word.'
    variants:
      - goal: 'Uppercase "url".'
        start: |-
          gU sends the ▮url up to capitals
        target: |-
          gU sends the URL up to capitals
      - goal: 'Uppercase "up".'
        start: |-
          gU lifts ▮up to capitals
        target: |-
          gU lifts UP to capitals
        solution: 'gUiw'
  - goal: 'Make the whole line lowercase.'
    start: |-
      ▮GU LOWERS THE WHOLE LINE
    target: |-
      gu lowers the whole line
    solution: 'guu'
    hint: 'guu lowercases the line (gu + u, like dd).'
    variants:
      - start: |-
          ▮LOWERCASE IS QUIETER
        target: |-
          lowercase is quieter
      - goal: 'Make the whole line lowercase.'
        start: |-
          ▮QUIET DOWN WITH GUU
        target: |-
          quiet down with guu
        solution: 'guu'
  - goal: 'Make the sentence true: Ctrl-a adds 1.'
    start: |-
      ▮Ctrl-a adds 0 to the number
    target: |-
      Ctrl-a adds 1 to the number
    solution: '<C-a>'
    hint: 'Ctrl-a adds one to the next number on the line.'
    variants:
      - goal: 'Make the sentence true: two plus one is three.'
        start: |-
          ▮Ctrl-a adds, so two plus one is 2
        target: |-
          Ctrl-a adds, so two plus one is 3
      - goal: 'Make the sentence true: Ctrl-a adds 1.'
        start: |-
          ▮Ctrl-a adds 0 each press
        target: |-
          Ctrl-a adds 1 each press
        solution: '<C-a>'
  - goal: 'Twenty plus thirty is fifty: add 30.'
    start: |-
      ▮A count makes Ctrl-a add: twenty plus thirty is 20
    target: |-
      A count makes Ctrl-a add: twenty plus thirty is 50
    solution: '30<C-a>'
    hint: 'With a count, Ctrl-a adds that many.'
    variants:
      - goal: 'The answer is 31: add 30.'
        start: |-
          ▮Count first, then Ctrl-a: the answer is 1
        target: |-
          Count first, then Ctrl-a: the answer is 31
      - goal: 'The answer is 31: add 30.'
        start: |-
          ▮Count first, then Ctrl-a: the sum is 1
        target: |-
          Count first, then Ctrl-a: the sum is 31
  - goal: 'Make the sentence true: 3 take away 1 leaves 2.'
    start: |-
      ▮Ctrl-x leaves 3 when you take 1 from 3
    target: |-
      Ctrl-x leaves 2 when you take 1 from 3
    solution: '<C-x>'
    hint: 'Ctrl-x takes one away from the next number.'
    variants:
      - goal: 'Make the sentence true: three less one is two.'
        start: |-
          ▮Ctrl-x crosses one off: three less one is 3
        target: |-
          Ctrl-x crosses one off: three less one is 2
      - goal: 'Make the sentence true: 3 take away 1 leaves 2.'
        start: |-
          ▮x takes away: it leaves 3 when you take 1 from 3
        target: |-
          x takes away: it leaves 2 when you take 1 from 3
        solution: '<C-x>'
  - goal: 'Flip the case of the first word.'
    start: |-
      ▮tILDE flips the case
    target: |-
      Tilde flips the case
    solution: 'g~iw'
    hint: 'g~ flips case over a motion or text object.'
    variants:
      - start: |-
          ▮wAVE: the tilde flips
        target: |-
          Wave: the tilde flips
      - start: |-
          ▮fLIP: g~ swaps case
        target: |-
          Flip: g~ swaps case
