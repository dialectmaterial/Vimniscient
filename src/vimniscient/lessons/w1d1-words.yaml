week: 1
day: 1
title: Word text objects
intro: |
  Read a Vim command as a small sentence: a verb, then a noun. The verbs are
  `c` *change*, `d` *delete* and `y` *yank* (Vim's old word for copy). The noun
  is a text object: `i` *inner* or `a` (*a word*, or *around* it), then what
  kind of thing, `w` for *word*. So `ciw` reads *change inner word*, and it
  works from anywhere inside the word. `iw` is the word alone, `aw` takes its
  space too. Capital `W` is a big WORD: everything between two spaces, dots
  included.
keys: [ciw, diw, daw, ciW, yiw, viwp]
tasks:
  - goal: 'Fix "while" to "whole" (the cursor is in the middle of the word).'
    start: |-
      ciw is change inner word: it swaps the wh▮ile word, wherever the cursor sits.
    target: |-
      ciw is change inner word: it swaps the whole word, wherever the cursor sits.
    solution: 'ciwwhole<Esc>'
    hint: 'c changes, i keeps it inner, w names the word: ciw, from anywhere inside it.'
    generate: ciw-typo  # Recall and reviews can get a new text (generate.py)
    variants:
      - goal: 'Fix "spaec" to "space" (the cursor is in the middle of the word).'
        start: |-
          The i in ciw means inner: just the word, never the spa▮ec around it.
        target: |-
          The i in ciw means inner: just the word, never the space around it.
        solution: 'ciwspace<Esc>'
      - goal: 'Fix "anywhrere" to "anywhere" (the cursor is in the middle of the word).'
        start: |-
          Change inner word: c is the verb, iw the noun, and the cursor sits anywh▮rere in it.
        target: |-
          Change inner word: c is the verb, iw the noun, and the cursor sits anywhere in it.
        solution: 'ciwanywhere<Esc>'
      - goal: 'Fix "undersocres" to "underscores" (the cursor is in the middle of the word).'
        start: |-
          In ciw, the w is a word: letters, digits and under▮socres, nothing else.
        target: |-
          In ciw, the w is a word: letters, digits and underscores, nothing else.
        solution: 'ciwunderscores<Esc>'
  - goal: 'Delete one "own", including its space.'
    start: |-
      The a in daw is around: the word and its own ▮own space.
    target: |-
      The a in daw is around: the word and its own space.
    solution: 'daw'
    hint: 'd deletes, a takes the word with its space, w is the word: daw leaves no double space.'
    generate: daw-double  # Recall and reviews can get a new text (generate.py)
    variants:
      - goal: 'Delete the second "behind".'
        start: |-
          daw leaves no double space behind be▮hind.
        target: |-
          daw leaves no double space behind.
        solution: 'daw'
      - goal: 'Delete one "its", including its space.'
        start: |-
          daw takes a word and what is around it, its ▮its trailing space.
        target: |-
          daw takes a word and what is around it, its trailing space.
      - goal: 'Delete one "so".'
        start: |-
          With daw, a means around: the word goes, and ▮so so does one space.
        target: |-
          With daw, a means around: the word goes, and so does one space.
  - goal: 'Write the dotted "e.v.e.r.y.t.h.i.n.g" as "everything".'
    start: |-
      Big W, big WORD: ciW takes e.v.e.r.y▮.t.h.i.n.g between two spaces.
    target: |-
      Big W, big WORD: ciW takes everything between two spaces.
    solution: 'ciWeverything<Esc>'
    hint: 'A WORD (capital W) runs from space to space, dots included. Try ciW.'
    generate: ciW-dotted  # Recall and reviews can get a new text (generate.py)
    variants:
      - goal: 'Replace the whole URL with "a URL".'
        start: |-
          ciW sees www.wa▮ls.info as one WORD: dots do not split it.
        target: |-
          ciW sees a URL as one WORD: dots do not split it.
        solution: 'ciWa URL<Esc>'
      - goal: 'Replace "e.g." with "for example".'
        start: |-
          A WORD runs from space to space, e.▮g. a dotted abbreviation.
        target: |-
          A WORD runs from space to space, for example a dotted abbreviation.
        solution: 'ciWfor example<Esc>'
      - goal: 'Replace the path with "a path".'
        start: |-
          ciW sees ~/notes/vi▮m.md as one WORD, slashes and all.
        target: |-
          ciW sees a path as one WORD, slashes and all.
        solution: 'ciWa path<Esc>'
  - goal: 'Spell the function name out as change_inner_word.'
    ft: python
    start: |-
      def ▮chg_in_wd(word, new):
          """c = change, i = inner, w = word."""
          return new
    target: |-
      def change_inner_word(word, new):
          """c = change, i = inner, w = word."""
          return new
    solution: 'ciwchange_inner_word<Esc>'
    hint: 'Underscores belong to a word, so ciw takes the whole name.'
    variants:
      - goal: 'Spell the function name out as delete_a_word.'
        start: |-
          def ▮del_a_wd(text):
              """d = delete, a = a word and its space, w = word."""
              return text
        target: |-
          def delete_a_word(text):
              """d = delete, a = a word and its space, w = word."""
              return text
        solution: 'ciwdelete_a_word<Esc>'
      - goal: 'Spell the function name out as change_inner_WORD.'
        start: |-
          def ▮chg_in_WD(text, new):
              """c = change, i = inner, W = WORD, space to space."""
              return new
        target: |-
          def change_inner_WORD(text, new):
              """c = change, i = inner, W = WORD, space to space."""
              return new
        solution: 'ciwchange_inner_WORD<Esc>'
      - goal: 'Spell the function name out as yank_inner_word.'
        start: |-
          def ▮ynk_in_wd(text):
              """y = yank, Vim's older word for copy; i = inner; w = word."""
              return text
        target: |-
          def yank_inner_word(text):
              """y = yank, Vim's older word for copy; i = inner; w = word."""
              return text
        solution: 'ciwyank_inner_word<Esc>'
      - goal: 'Spell the function name out as snake_case_name.'
        start: |-
          def ▮snk_cs_nm(name):
              """ciw takes it all: underscores belong to the word."""
              return name
        target: |-
          def snake_case_name(name):
              """ciw takes it all: underscores belong to the word."""
              return name
        solution: 'ciwsnake_case_name<Esc>'
  - goal: 'Copy "word" over "noun".'
    start: |-
      viwp puts the ▮word you yanked over the other noun
    target: |-
      viwp puts the word you yanked over the other word
    solution: 'yiw$viwp'
    hint: 'yiw yanks the inner word; $ jumps to the last one; viwp selects it and puts the yank over it.'
    variants:
      - goal: 'Copy "verb" over "noun".'
        start: |-
          Put is a ▮verb, and yank is a noun.
        target: |-
          Put is a verb, and yank is a verb.
        solution: 'yiw$bviwp'
      - goal: 'Copy "yank" over "paste".'
        start: |-
          viwp swaps a selection for the ▮yank, so select, then put the paste
        target: |-
          viwp swaps a selection for the yank, so select, then put the yank
        solution: 'yiw$viwp'
  - goal: 'Delete the doubled "the".'
    start: |-
      daw: delete a word, and ▮the the space after it.
    target: |-
      daw: delete a word, and the space after it.
    solution: 'daw'
    hint: 'daw takes the word and its trailing space.'
    generate: daw-double  # Recall and reviews can get a new text (generate.py)
    variants:
      - goal: 'Delete the doubled "like".'
        start: |-
          Doubled words ▮like like this one are what daw is for.
        target: |-
          Doubled words like this one are what daw is for.
      - goal: 'Delete the doubled "and".'
        start: |-
          daw: d for delete, a for a word ▮and and its space.
        target: |-
          daw: d for delete, a for a word and its space.
