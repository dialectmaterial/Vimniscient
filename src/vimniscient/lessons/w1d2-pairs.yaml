        target: |-
          bracket_names_the_pair = []
      - start: |-
          high_utility = [▮"highlighting", "rereading"]
        target: |-
          high_utility = []
      - start: |-
          cram_plan = [▮"everything", "tonight"]
        target: |-
          cram_plan = []
  - goal: 'Change the text inside the tag to "t is for tag".'
    ft: html
    start: |-
      <b>t is for ti▮tle</b>
    target: |-
      <b>t is for tag</b>
    solution: 'citt is for tag<Esc>'
    hint: 't is the tag object. cit changes the tag''s content and keeps the tags.'
    variants:
      - goal: 'Change the text inside the tag to "Ebbinghaus, 1885".'
        start: |-
          <i>Ebbing▮haus, 1858</i>
        target: |-
          <i>Ebbinghaus, 1885</i>
        solution: 'citEbbinghaus, 1885<Esc>'
      - goal: 'Change the text inside the tag to "Miller, 1956".'
        start: |-
          <em>Miller, 19▮65</em>
        target: |-
          <em>Miller, 1956</em>
        solution: 'citMiller, 1956<Esc>'
      - goal: 'Change the text inside the tag to "the tags stay".'
        start: |-
          <b>the tags ▮go</b>
        target: |-
          <b>the tags stay</b>
        solution: 'citthe tags stay<Esc>'
      - goal: 'Change the text inside the tag to "Roediger & Karpicke, 2006".'
        start: |-
          <i>Roediger, 20▮16</i>
        target: |-
          <i>Roediger & Karpicke, 2006</i>
        solution: 'citRoediger & Karpicke, 2006<Esc>'
