week: 1
day: 2
title: Quotes, brackets and tags
intro: |
  The same `i`/`a` trick works on pairs, and the noun is simply the pair's own
  sign: `i"` is inside the quotes, `a"` takes the quotes too. Brackets name
  themselves the same way: `i(` `i[` `i{` `i<`. `t` is for *tag*: `it` is
  inside an HTML tag. For quotes the cursor doesn't even have to be inside:
  `ci"` jumps to the next quoted string on the line.
keys: ['ci"', 'da"', 'di(', 'da(', 'di[', 'cit']
tasks:
  - goal: 'Set the string to "change inside".'
    ft: python
    start: |-
      ci_quote = "▮delete outside"
    target: |-
      ci_quote = "change inside"
    solution: 'ci"change inside<Esc>'
    hint: 'c changes, i keeps it inside, " names the pair: ci".'
    variants:
      - goal: 'Fix the citation to "Atkinson & Raugh, 1975".'
        start: |-
          keyword_method = "▮Atkinson, 1957"
        target: |-
          keyword_method = "Atkinson & Raugh, 1975"
        solution: 'ci"Atkinson & Raugh, 1975<Esc>'
  - goal: 'Change the string to "spaced", starting from the beginning of the line.'
    ft: python
    start: |-
      ▮best_schedule = "one long cram"
    target: |-
      best_schedule = "spaced"
    solution: 'ci"spaced<Esc>'
    hint: 'You don''t have to move first. ci" finds the next quotes on the line.'
    variants:
      - goal: 'Change the string to "testing yourself", starting from the beginning of the line.'
        start: |-
          ▮learn_by = "rereading"
        target: |-
          learn_by = "testing yourself"
        solution: 'ci"testing yourself<Esc>'
  - goal: 'Empty the inner parentheses.'
    ft: python
    start: |-
      di_paren(empties(▮this_part))
    target: |-
      di_paren(empties())
    solution: 'di('
    hint: 'di( deletes inside the innermost parentheses around the cursor.'
    variants:
      - goal: 'Empty the inner parentheses.'
        start: |-
          forget(cramming(the_night_bef▮ore))
        target: |-
          forget(cramming())
  - goal: 'Delete the argument list, parentheses included.'
    ft: python
    start: |-
      da = deletes(▮around, it) + parens
    target: |-
      da = deletes + parens
    solution: 'da('
    hint: 'a is around: da( deletes the parentheses too. (dab is the same thing.)'
    variants:
      - goal: 'Delete the argument list, parentheses included.'
        start: |-
          recall = retrieval(▮practice, tests) * 2
        target: |-
          recall = retrieval * 2
  - goal: 'Empty the list.'
    ft: python
    start: |-
      di_bracket_leaves = [▮"just", "the", "brackets"]
    target: |-
      di_bracket_leaves = []
    solution: 'di['
    hint: 'di[ works like di(: the bracket names the pair.'
    variants:
      - goal: 'Empty the list.'
        start: |-
          excuses_not_to_practise = [▮"busy", "tired", "later"]
        target: |-
          excuses_not_to_practise = []
  - goal: 'Change the text inside the tag to "t is for tag".'
    ft: html
    start: |-
      <b>t is for ti▮tle</b>
    target: |-
      <b>t is for tag</b>
    solution: 'citt is for tag<Esc>'
    hint: 't is the tag object. cit changes the tag''s content and keeps the tags.'
    variants:
      - goal: 'Change the text inside the tag to "Ebbinghaus, 1885".'
        start: |-
          <i>Ebbing▮haus, 1858</i>
        target: |-
          <i>Ebbinghaus, 1885</i>
        solution: 'citEbbinghaus, 1885<Esc>'
