week: 1
day: 2
title: Quotes, brackets and tags
intro: |
  The same `i`/`a` trick works on pairs, and the noun is simply the pair's own
  sign: `i"` is inside the quotes, `a"` takes the quotes too. Brackets name
  themselves the same way: `i(` `i[` `i{` `i<`. `t` is for *tag*: `it` is
  inside an HTML tag. For quotes the cursor doesn't even have to be inside:
  `ci"` jumps to the next quoted string on the line.
keys: ['ci"', 'da"', 'di(', 'da(', 'di[', 'cit']
tasks:
  - goal: 'Set the string to "change inside".'
    ft: python
    start: |-
      ci_quote = "▮delete outside"
    target: |-
      ci_quote = "change inside"
    solution: 'ci"change inside<Esc>'
    hint: 'c changes, i keeps it inside, " names the pair: ci".'
    variants:
      - goal: 'Fix the citation to "Atkinson & Raugh, 1975".'
        start: |-
          keyword_method = "▮Atkinson, 1957"
        target: |-
          keyword_method = "Atkinson & Raugh, 1975"
        solution: 'ci"Atkinson & Raugh, 1975<Esc>'
      - goal: 'Set the string to "the quote names the pair".'
        start: |-
          quote_object = "▮brackets name it"
        target: |-
          quote_object = "the quote names the pair"
        solution: 'ci"the quote names the pair<Esc>'
      - goal: 'Fix the citation to "Cepeda et al., 2006".'
        start: |-
          spacing_review = "▮Cepeda, 2016"
        target: |-
          spacing_review = "Cepeda et al., 2006"
        solution: 'ci"Cepeda et al., 2006<Esc>'
      - goal: 'Set the string to "without the quotes".'
        start: |-
          inner_quote = "▮with the quotes"
        target: |-
          inner_quote = "without the quotes"
        solution: 'ci"without the quotes<Esc>'
  - goal: 'Change the string to "spaced", starting from the beginning of the line.'
    ft: python
    start: |-
      ▮best_schedule = "one long cram"
    target: |-
      best_schedule = "spaced"
    solution: 'ci"spaced<Esc>'
    hint: 'You don''t have to move first. ci" finds the next quotes on the line.'
    variants:
      - goal: 'Change the string to "testing yourself", starting from the beginning of the line.'
        start: |-
          ▮learn_by = "rereading"
        target: |-
          learn_by = "testing yourself"
        solution: 'ci"testing yourself<Esc>'
      - goal: 'Change the string to "seven, plus or minus two", starting from the beginning of the line.'
        start: |-
          ▮miller_1956 = "ten"
        target: |-
          miller_1956 = "seven, plus or minus two"
        solution: 'ci"seven, plus or minus two<Esc>'
      - goal: 'Change the string to "about four", starting from the beginning of the line.'
        start: |-
          ▮cowan_chunks = "seven"
        target: |-
          cowan_chunks = "about four"
        solution: 'ci"about four<Esc>'
      - goal: 'Change the string to "the next quotes", starting from the beginning of the line.'
        start: |-
          ▮ci_quote_finds = "nothing"
        target: |-
          ci_quote_finds = "the next quotes"
        solution: 'ci"the next quotes<Esc>'
  - goal: 'Empty the inner parentheses.'
    ft: python
    start: |-
      di_paren(empties(▮this_part))
    target: |-
      di_paren(empties())
    solution: 'di('
    hint: 'di( deletes inside the innermost parentheses around the cursor.'
    variants:
      - goal: 'Empty the inner parentheses.'
        start: |-
          forget(cramming(the_night_bef▮ore))
        target: |-
          forget(cramming())
      - start: |-
          inner_paren(keeps(▮only_the_brackets))
        target: |-
          inner_paren(keeps())
      - start: |-
          restudy(feels(better_at_fi▮ve_minutes))
        target: |-
          restudy(feels())
      - start: |-
          sleep(stabilises(▮new_memories))
        target: |-
          sleep(stabilises())
  - goal: 'Delete the argument list, parentheses included.'
    ft: python
    start: |-
      da = deletes(▮around, it) + parens
    target: |-
      da = deletes + parens
    solution: 'da('
    hint: 'a is around: da( deletes the parentheses too. (dab is the same thing.)'
    variants:
      - goal: 'Delete the argument list, parentheses included.'
        start: |-
          recall = retrieval(▮practice, tests) * 2
        target: |-
          recall = retrieval * 2
      - start: |-
          ebbinghaus = curve(▮forgetting, steep) + 1885
        target: |-
          ebbinghaus = curve + 1885
      - start: |-
          parens_go = da(▮inside, and, out) + too
        target: |-
          parens_go = da + too
      - start: |-
          skill = stages(▮cognitive, associative, autonomous) * 3
        target: |-
          skill = stages * 3
  - goal: 'Empty the list.'
    ft: python
    start: |-
      di_bracket_leaves = [▮"just", "the", "brackets"]
    target: |-
      di_bracket_leaves = []
    solution: 'di['
    hint: 'di[ works like di(: the bracket names the pair.'
    variants:
      - goal: 'Empty the list.'
        start: |-
          excuses_not_to_practise = [▮"busy", "tired", "later"]
        target: |-
          excuses_not_to_practise = []
      - start: |-
