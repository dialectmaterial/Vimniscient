week: 1
day: 2
title: Quotes, brackets and tags
intro: |
  The same `i`/`a` trick works on pairs, and the noun is simply the pair's own
  sign: `i"` is inside the quotes, `a"` takes the quotes too. Brackets name
  themselves the same way: `i(` `i[` `i{` `i<`. `t` is for *tag*: `it` is
  inside an HTML tag. For quotes the cursor doesn't even have to be inside:
  `ci"` jumps to the next quoted string on the line.
keys: ['ci"', 'da"', 'di(', 'da(', 'di[', 'cit']
tasks:
  - goal: 'Set the string to "change inside".'
    ft: python
    start: |-
      ci_quote = "▮delete outside"
    target: |-
      ci_quote = "change inside"
    solution: 'ci"change inside<Esc>'
    hint: 'c changes, i keeps it inside, " names the pair: ci".'
    variants:
      - goal: 'Set the string to "the quote names the pair".'
        start: |-
          quote_object = "▮brackets name it"
        target: |-
          quote_object = "the quote names the pair"
        solution: 'ci"the quote names the pair<Esc>'
      - goal: 'Set the string to "without the quotes".'
        start: |-
          inner_quote = "▮with the quotes"
        target: |-
          inner_quote = "without the quotes"
        solution: 'ci"without the quotes<Esc>'
  - goal: 'Change the string to "the quotes", starting from the beginning of the line.'
    ft: python
    start: |-
      ▮ci_quote_keeps = "nothing"
    target: |-
      ci_quote_keeps = "the quotes"
    solution: 'ci"the quotes<Esc>'
    hint: 'You don''t have to move first. ci" finds the next quotes on the line.'
    variants:
      - goal: 'Change the string to "the next quotes", starting from the beginning of the line.'
        start: |-
          ▮ci_quote_finds = "nothing"
        target: |-
          ci_quote_finds = "the next quotes"
        solution: 'ci"the next quotes<Esc>'
  - goal: 'Empty the inner parentheses.'
    ft: python
    start: |-
      di_paren(empties(▮this_part))
    target: |-
      di_paren(empties())
    solution: 'di('
    hint: 'di( deletes inside the innermost parentheses around the cursor.'
    variants:
      - start: |-
          inner_paren(keeps(▮only_the_brackets))
        target: |-
          inner_paren(keeps())
  - goal: 'Delete the argument list, parentheses included.'
    ft: python
    start: |-
      da = deletes(▮around, it) + parens
    target: |-
      da = deletes + parens
    solution: 'da('
    hint: 'a is around: da( deletes the parentheses too. (dab is the same thing.)'
    variants:
      - start: |-
          parens_go = da(▮inside, and, out) + too
        target: |-
          parens_go = da + too
  - goal: 'Empty the list.'
    ft: python
    start: |-
      di_bracket_leaves = [▮"just", "the", "brackets"]
    target: |-
      di_bracket_leaves = []
    solution: 'di['
    hint: 'di[ works like di(: the bracket names the pair.'
    variants:
      - start: |-
          bracket_names_the_pair = [▮"square", "ones"]
        target: |-
          bracket_names_the_pair = []
  - goal: 'Change the text inside the tag to "t is for tag".'
    ft: html
    start: |-
      <b>t is for ti▮tle</b>
    target: |-
      <b>t is for tag</b>
    solution: 'citt is for tag<Esc>'
    hint: 't is the tag object. cit changes the tag''s content and keeps the tags.'
    variants:
      - goal: 'Change the text inside the tag to "the tags stay".'
        start: |-
          <b>the tags ▮go</b>
        target: |-
          <b>the tags stay</b>
        solution: 'citthe tags stay<Esc>'
