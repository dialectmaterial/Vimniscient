week: 4
day: 5
title: More motions
intro: |
  Some motions worth knowing with an operator. The braces hug a block: `{` is
  its top and `}` its bottom, the next blank line
  (`d}` deletes to the end of the paragraph), `G` and `gg` (`dG` deletes to
  the end of the file), `0`, column zero (`d0` deletes back to the start of
  the line). And two small ones: `gJ` joins without a space, like a German
  compound, and `xp` swaps two characters: cross one out, put it back one
  further.
keys: ['d}', dG, d0, gJ, xp]
tasks:
