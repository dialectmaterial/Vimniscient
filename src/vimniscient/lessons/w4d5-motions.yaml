    start: |-
      ▮this paragraph
      ends at the blank line

      } is the bottom of a block.
    target: |-

      } is the bottom of a block.
    solution: 'd}'
    hint: '} moves to the next blank line; d} deletes up to it.'
    variants:
      - goal: 'Delete to the end of the paragraph.'
        start: |-
          ▮er, right
          well

          The seminar begins.
        target: |-

          The seminar begins.
      - start: |-
          ▮filler
          more filler

          Spacing beats cramming.
        target: |-

          Spacing beats cramming.
      - start: |-
          ▮} jumps
          to the blank line

          below a block.
        target: |-

          below a block.
