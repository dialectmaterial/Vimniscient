week: 4
day: 5
title: More motions
intro: |
  Some motions worth knowing with an operator. The braces hug a block: `{` is
  its top and `}` its bottom, the next blank line
  (`d}` deletes to the end of the paragraph), `G` and `gg` (`dG` deletes to
  the end of the file), `0`, column zero (`d0` deletes back to the start of
  the line). And two small ones: `gJ` joins without a space, like a German
  compound, and `xp` swaps two characters: cross one out, put it back one
  further.
keys: ['d}', dG, d0, gJ, xp]
tasks:
  - goal: 'Delete to the end of the paragraph.'
    start: |-
      ▮this paragraph
      ends at the blank line

      } is the bottom of a block.
    target: |-

      } is the bottom of a block.
    solution: 'd}'
    hint: '} moves to the next blank line; d} deletes up to it.'
    variants:
      - goal: 'Delete to the end of the paragraph.'
        start: |-
          ▮er, right
          well

          The seminar begins.
        target: |-

          The seminar begins.
  - goal: 'Join the two halves of the compound with no space.'
    start: |-
      ▮sprach
      gefühl
    target: |-
      sprachgefühl
    solution: 'gJ'
    hint: 'J adds a space, gJ doesn''t.'
    variants:
      - goal: 'Join the two halves of the compound with no space.'
        start: |-
          ▮welt
          anschauung
        target: |-
          weltanschauung
  - goal: 'Delete from here to the end of the file.'
    start: |-
      G goes to the end
      ▮so dG
      deletes
      all this
    target: |-
      G goes to the end
    solution: 'dG'
    hint: 'dG deletes to the last line.'
    variants:
      - goal: 'Delete from here to the end of the file.'
        start: |-
          Summary
          ▮todo
          scratch
          notes
        target: |-
          Summary
  - goal: 'Fix the typo by swapping two letters.'
    start: |-
      xp is a sw▮pa
    target: |-
      xp is a swap
    solution: 'xp'
    hint: 'x cuts the letter, p puts it back after the next one.'
    variants:
      - goal: 'Fix the typo by swapping two letters.'
        start: |-
          mor▮hpeme
        target: |-
          morpheme
  - goal: 'Delete everything before the cursor.'
    start: |-
      well, um, ▮0 is column zero
    target: |-
      0 is column zero
    solution: 'd0'
    hint: 'd0 deletes back to the start of the line, not including the cursor.'
    variants:
      - goal: 'Delete everything before the cursor.'
        start: |-
          well, ▮semantics
        target: |-
          semantics
