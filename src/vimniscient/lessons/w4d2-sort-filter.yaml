week: 4
day: 2
title: ':sort and shell filters'
intro: |
  `:sort` sorts lines (`:sort n` numerically, `:sort u` drops duplicates).
  `:%!cmd` sends the lines through a shell command and replaces them with
  its output, so any Unix tool becomes an editing command: `:%!column -t`
  aligns a table. `:r !cmd` inserts a command's output below the cursor.
keys: [':sort', ':sort n', ':sort u', ':%!cmd', ':r !cmd']
tasks:
  - goal: 'Sort the fields.'
    start: |-
      ▮syntax
      morphology
      phonology
    target: |-
      morphology
      phonology
      syntax
    solution: ':sort<CR>'
    hint: ':sort sorts every line by default.'
    variants:
      - goal: 'Sort the fields.'
        start: |-
          ▮semantics
          pragmatics
          phonetics
        target: |-
          phonetics
          pragmatics
          semantics
  - goal: 'Sort by the number of native speakers (millions), not alphabetically.'
    start: |-
      ▮Native speakers, millions
      380 English
      345 Hindi
      75 Turkish
    target: |-
      Native speakers, millions
      75 Turkish
      345 Hindi
      380 English
    solution: ':sort n<CR>'
    hint: ':sort n sorts by number; a line without one (the heading) stays first.'
    variants:
      - goal: 'Sort by the number of native speakers (millions), not alphabetically.'
        start: |-
          ▮Native speakers, millions
          230 Bengali
          125 Japanese
          86 Vietnamese
        target: |-
          Native speakers, millions
          86 Vietnamese
          125 Japanese
          230 Bengali
  - goal: 'Sort and remove the duplicates.'
    start: |-
      ▮noun
      verb
      noun
      adjective
      verb
    target: |-
      adjective
      noun
      verb
    solution: ':sort u<CR>'
    hint: ':sort u keeps only one of each line.'
    variants:
      - goal: 'Sort and remove the duplicates.'
        start: |-
          ▮stop
          nasal
          stop
          glide
          nasal
        target: |-
          glide
          nasal
          stop
  - goal: 'Line the table up in columns.'
    start: |-
      ▮word class gloss
      cats noun cat.PL
    target: |-
      word  class  gloss
      cats  noun   cat.PL
    solution: ':%!column -t<CR>'
    hint: ':%! sends every line through a shell command. column -t aligns columns.'
    variants:
      - goal: 'Line the table up in columns.'
        start: |-
          ▮form gloss tag
          dogs dog.PL N
        target: |-
          form  gloss   tag
          dogs  dog.PL  N
  - goal: 'Sort only the first two lines.'
    start: |-
      ▮syntax
      phonology
      wug
      blick
    target: |-
      phonology
      syntax
      wug
      blick
    solution: 'Vj:sort<CR>'
    hint: 'Select the lines, then :sort works on just those.'
    variants:
      - goal: 'Sort only the first two lines.'
        start: |-
          ▮tone
          stress
          wug
          blick
        target: |-
          stress
          tone
          wug
          blick
  - goal: 'Insert the output of a shell command (echo wug) below this line.'
    start: |-
      ▮Nonce word:
    target: |-
      Nonce word:
      wug
    solution: ':r !echo wug<CR>'
    hint: ':r !echo wug reads the command''s output into the file.'
    variants:
      - goal: 'Insert the output of a shell command (echo blick) below this line.'
        start: |-
          ▮Another nonce word:
        target: |-
          Another nonce word:
          blick
        solution: ':r !echo blick<CR>'
        hint: ':r !echo blick reads the command''s output into the file.'
