week: 4
day: 2
title: ':sort and shell filters'
skill: ex
intro: |
  `:sort` sorts lines (`:sort n` as numbers, `:sort u` keeps the unique ones).
  `:%!cmd` sends the lines through a shell command and replaces them with
  its output, so any Unix tool becomes an editing command: `:%!column -t`
  aligns a table. Read `!` as *hand it to the shell*. `:r !cmd` *reads* a
  command's output in below the cursor.
keys: [':sort', ':sort n', ':sort u', ':%!cmd', ':r !cmd']
tasks:
  - goal: 'Sort the fields.'
    generate: sort
    start: |-
      ▮sort
      lines
      order
    target: |-
      lines
      order
      sort
    solution: ':sort<CR>'
    hint: ':sort sorts every line by default.'
    variants:
      - start: |-
          ▮yank
          delete
          change
        target: |-
          change
          delete
          yank
  - goal: 'Sort by number, not alphabetically.'
    start: |-
      ▮Key, count
      30 keys
      7 keys
      1 key
    target: |-
      Key, count
      1 key
      7 keys
      30 keys
    solution: ':sort n<CR>'
    hint: ':sort n sorts by number; a line without one (the heading) stays first.'
    variants:
      - goal: 'Sort by number, not alphabetically.'
        start: |-
          ▮Sort n, by number
          10 after nine
          2 after one
          9 before ten
        target: |-
          Sort n, by number
          2 after one
          9 before ten
          10 after nine
      - goal: 'Sort by number, not alphabetically.'
        start: |-
          ▮Count, presses
          30 presses
          7 presses
          1 press
        target: |-
          Count, presses
          1 press
          7 presses
          30 presses
        solution: ':sort n<CR>'
  - goal: 'Sort and remove the duplicates.'
    generate: sort-u
    start: |-
      ▮unique
      sort
      unique
      only
      sort
    target: |-
      only
      sort
      unique
    solution: ':sort u<CR>'
    hint: ':sort u keeps only one of each line.'
    variants:
      - start: |-
          ▮f
          t
          f
          T
          t
        target: |-
          T
          f
          t
  - goal: 'Line the table up in columns.'
    start: |-
      ▮key means hook
      q record quill
    target: |-
      key  means   hook
      q    record  quill
    solution: ':%!column -t<CR>'
    hint: ':%! sends every line through a shell command. column -t aligns columns.'
    variants:
      - start: |-
          ▮op means
          d delete
        target: |-
          op  means
          d   delete
      - start: |-
          ▮key means
          u undo
        target: |-
          key  means
          u    undo
  - goal: 'Sort only the first two lines.'
    start: |-
      ▮visual
      sort
      not
      these
    target: |-
      sort
      visual
      not
      these
    solution: 'Vj:sort<CR>'
    hint: 'Select the lines, then :sort works on just those.'
    variants:
      - start: |-
          ▮yank
          put
          wug
          blick
        target: |-
          put
          yank
          wug
          blick
      - start: |-
          ▮order
          lines
          stay
          put
        target: |-
          lines
          order
          stay
          put
  - goal: 'Insert the output of a shell command (echo output) below this line.'
    start: |-
      ▮:r reads the output:
    target: |-
      :r reads the output:
      output
    solution: ':r !echo output<CR>'
    hint: ':r !echo output reads the command''s output into the file.'
    variants:
      - goal: 'Insert the output of a shell command (echo recall) below this line.'
        hint: ':r !echo recall reads the command''s output into the file.'
        start: |-
          ▮:r reads in:
        target: |-
          :r reads in:
          recall
        solution: ':r !echo recall<CR>'
      - goal: 'Insert the output of a shell command (echo result) below this line.'
        hint: ':r !echo result reads the command''s output into the file.'
        start: |-
          ▮:r pulls in:
        target: |-
          :r pulls in:
          result
        solution: ':r !echo result<CR>'
