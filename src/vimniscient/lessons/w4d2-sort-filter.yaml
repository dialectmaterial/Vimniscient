week: 4
day: 2
title: ':sort and shell filters'
intro: |
  `:sort` sorts lines (`:sort n` as numbers, `:sort u` keeps the unique ones).
  `:%!cmd` sends the lines through a shell command and replaces them with
  its output, so any Unix tool becomes an editing command: `:%!column -t`
  aligns a table. Read `!` as *hand it to the shell*. `:r !cmd` *reads* a
  command's output in below the cursor.
keys: [':sort', ':sort n', ':sort u', ':%!cmd', ':r !cmd']
