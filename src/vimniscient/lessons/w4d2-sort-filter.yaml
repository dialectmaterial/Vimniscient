week: 4
day: 2
title: ':sort and shell filters'
intro: |
  `:sort` sorts lines (`:sort n` numerically, `:sort u` drops duplicates).
  `:%!cmd` sends the lines through a shell command and replaces them with
  its output, so any Unix tool becomes an editing command: `:%!column -t`
  aligns a table. `:r !cmd` inserts a command's output below the cursor.
keys: [':sort', ':sort n', ':sort u', ':%!cmd', ':r !cmd']
tasks:
  - goal: 'Sort the fields.'
    start: |-
      ▮syntax
      morphology
      phonology
    target: |-
      morphology
      phonology
      syntax
    solution: ':sort<CR>'
    hint: ':sort sorts every line by default.'
  - goal: 'Sort by the number of native speakers (millions), not alphabetically.'
    start: |-
      ▮Native speakers, millions
      380 English
      345 Hindi
      75 Turkish
    target: |-
      Native speakers, millions
      75 Turkish
      345 Hindi
      380 English
    solution: ':sort n<CR>'
    hint: ':sort n sorts by number; a line without one (the heading) stays first.'
  - goal: 'Sort and remove the duplicates.'
    start: |-
      ▮noun
      verb
      noun
      adjective
      verb
    target: |-
      adjective
      noun
      verb
    solution: ':sort u<CR>'
    hint: ':sort u keeps only one of each line.'
  - goal: 'Line the table up in columns.'
    start: |-
      ▮word class gloss
      cats noun cat.PL
    target: |-
      word  class  gloss
      cats  noun   cat.PL
    solution: ':%!column -t<CR>'
    hint: ':%! sends every line through a shell command. column -t aligns columns.'
  - goal: 'Sort only the first two lines.'
    start: |-
      ▮syntax
      phonology
      wug
      blick
    target: |-
      phonology
      syntax
      wug
      blick
    solution: 'Vj:sort<CR>'
    hint: 'Select the lines, then :sort works on just those.'
  - goal: 'Insert the output of a shell command (echo wug) below this line.'
    start: |-
      ▮Nonce word:
    target: |-
      Nonce word:
      wug
    solution: ':r !echo wug<CR>'
    hint: ':r !echo wug reads the command''s output into the file.'
