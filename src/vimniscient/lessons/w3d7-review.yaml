week: 3
day: 7
review: true
title: Week 3 review
intro: |
  Macros, registers, marks, visual block, `:s` and `:g`. Many of these have
  more than one good answer. Pick the one you'd use for real.
keys: [qa, '"0p', '<C-v>', ':%s', ':g']
tasks:
  - goal: 'Wrap every line in square brackets.'
    start: |-
      ▮NP
      VP
      Det
      N
    target: |-
      [NP]
      [VP]
      [Det]
      [N]
    solution: ':%norm I[<C-v><Esc>A]<CR>'
    hint: 'A macro with 3@a works. So does :%norm, where Ctrl-v Esc types an Esc into the command.'
    variants:
      - goal: 'Wrap every line in square brackets.'
        start: |-
          ▮DP
          TP
          C
          V
        target: |-
          [DP]
          [TP]
          [C]
          [V]
      - start: |-
          ▮q
          a
          at
          dot
        target: |-
          [q]
          [a]
          [at]
          [dot]
      - start: |-
          ▮encode
          store
          retrieve
          forget
        target: |-
          [encode]
          [store]
          [retrieve]
          [forget]
  - goal: 'Prefix every line with "> ".'
    start: |-
      ▮Words mean
      what speakers
      use them for.
    target: |-
      > Words mean
      > what speakers
      > use them for.
    solution: '<C-v>jjI> <Esc>'
    hint: 'Visual block I, or :%s/^/> /'
    variants:
      - goal: 'Prefix every line with "> ".'
        start: |-
          ▮The limits of
          my language mean
          the limits of my world.
        target: |-
          > The limits of
          > my language mean
          > the limits of my world.
      - start: |-
          ▮Test yourself,
          space it out,
          sleep on it.
        target: |-
          > Test yourself,
          > space it out,
          > sleep on it.
      - start: |-
          ▮Recall it
          before you
          check it.
        target: |-
          > Recall it
          > before you
          > check it.
  - goal: 'Delete the blank lines.'
    start: |-
      ▮encoding

      storage

      retrieval
    target: |-
      encoding
      storage
      retrieval
    solution: ':g/^$/d<CR>'
    hint: '^$ matches an empty line.'
    variants:
      - goal: 'Delete the blank lines.'
        start: |-
          ▮onset

          nucleus

          coda
        target: |-
          onset
          nucleus
          coda
      - start: |-
          ▮cognitive

          associative

          autonomous
        target: |-
          cognitive
          associative
          autonomous
      - start: |-
          ▮record

          stop

          play
        target: |-
          record
          stop
          play
  - goal: 'Swap the two halves of every line (key=meaning becomes meaning=key).'
    start: |-
      ▮q=record
      @=play
    target: |-
      record=q
      play=@
    solution: ':%s/\v(.*)\=(.*)/\2=\1<CR>'
    hint: 'Two groups around the =. In very magic mode = is special, so write \=.'
    variants:
      - goal: 'Swap the two halves of every line (English=German becomes German=English).'
        start: |-
          ▮house=Haus
          water=Wasser
        target: |-
          Haus=house
          Wasser=water
      - goal: 'Swap the two halves of every line (key=meaning becomes meaning=key).'
        start: |-
          ▮f=find
          t=till
        target: |-
          find=f
          till=t
      - goal: 'Swap the two halves of every line (name=number becomes number=name).'
        start: |-
          ▮Miller=7
          Cowan=4
        target: |-
          7=Miller
          4=Cowan
  - goal: 'Duplicate the first line to the end, then delete the second line. Keep the right line in the register.'
    start: |-
      ▮competence
      noise
      performance
    target: |-
      competence
      performance
      competence
    solution: 'yyjddG"0p'
    hint: 'After dd the unnamed register holds noise; "0p still has the yank.'
    variants:
      - goal: 'Duplicate the first line to the end, then delete the second line. Keep the right line in the register.'
        start: |-
          ▮langue
          noise
          parole
        target: |-
          langue
          parole
          langue
      - start: |-
          ▮spacing
          noise
          testing
        target: |-
          spacing
          testing
          spacing
      - start: |-
          ▮the yank
          noise
          the delete
        target: |-
          the yank
          the delete
          the yank
