week: 1
day: 7
review: true
title: Week 1 review
skill: mixed
intro: |
  A mix of everything from this week. Try each one before reaching for
  `:Hint`, and try to match the reference keystroke count. Mixing topics like
  this is harder than doing one at a time, and that's the point: you have to
  pick the right command, not just repeat the last one.
keys: [ciw, ci(, das, dd, daw, ct, ">ip", "3f,"]
tasks:
  - goal: 'Fix what c stands for: change.'
    ft: python
    start: |-
      keys = {"c": "▮copy"}
    target: |-
      keys = {"c": "change"}
    solution: 'ciwchange<Esc>'
    hint: 'ciw or ci" both work.'
    variants:
      - goal: 'Fix what y stands for: yank.'
        start: |-
          keys = {"y": "▮yell"}
        target: |-
          keys = {"y": "yank"}
        solution: 'ciwyank<Esc>'
      - goal: 'Fix what d stands for: delete.'
        start: |-
          keys = {"d": "▮duplicate"}
        target: |-
          keys = {"d": "delete"}
        solution: 'ciwdelete<Esc>'
      - goal: 'Fix what p stands for: put.'
        start: |-
          keys = {"p": "▮paste"}
        target: |-
          keys = {"p": "put"}
        solution: 'ciwput<Esc>'
      - goal: 'Fix what t stands for: till.'
        start: |-
          keys = {"t": "▮to"}
        target: |-
          keys = {"t": "till"}
        solution: 'ciwtill<Esc>'
  - goal: 'Replace all three arguments with inside.'
    ft: python
    start: |-
      parens(▮inner, inner, inner)
    target: |-
      parens(inside)
    solution: 'ci(inside<Esc>'
    hint: 'ci( changes everything inside the parentheses.'
    variants:
      - goal: 'Replace all three arguments with inside.'
        start: |-
          ci_paren(▮all, all, all)
        target: |-
          ci_paren(inside)
        solution: 'ci(inside<Esc>'
      - goal: 'Replace all three arguments with new.'
        ft: python
        start: |-
          args(▮old, old, old)
        target: |-
          args(new)
        solution: 'ci(new<Esc>'
  - goal: 'Delete the wrong sentence.'
    start: |-
      d deletes. ▮y means yell. c changes.
    target: |-
      d deletes. c changes.
    solution: 'das'
    hint: 'das deletes a sentence and its trailing space.'
    variants:
      - start: |-
          y yanks. ▮p means paste. P puts above.
        target: |-
          y yanks. P puts above.
      - start: |-
          f finds. ▮t means to. F looks back.
        target: |-
          f finds. F looks back.
  - goal: 'Delete the dup_one and dup_two imports.'
    ft: python
    start: |-
      import count
      ▮import dup_one
      import dup_two
      import verb
    target: |-
      import count
      import verb
    solution: '2dd'
    hint: 'A count works on dd too.'
    variants:
      - goal: 'Delete the copy and paste imports (Vim says yank and put).'
        start: |-
          import yank
          ▮import copy
          import paste
          import put
        target: |-
          import yank
          import put
      - goal: 'Delete the cut_one and cut_two imports.'
        ft: python
        start: |-
          import two
          ▮import cut_one
          import cut_two
          import dd
        target: |-
          import two
          import dd
        solution: '2dd'
  - goal: 'Change the subdomain to www.'
    start: |-
      url = 'https://▮old.vimhelp.org'
    target: |-
      url = 'https://www.vimhelp.org'
    solution: 'ciwwww<Esc>'
    hint: 'A dot ends a word, so ciw only takes "old". ct. works too.'
    variants:
      - start: |-
          url = 'https://▮old.neovim.io'
        target: |-
          url = 'https://www.neovim.io'
      - start: |-
          url = 'https://▮beta.vim.org'
        target: |-
          url = 'https://www.vim.org'
  - goal: 'Indent the body of the function.'
    ft: python
    start: |-
      def shift_right():
      ▮arrow = ">"
      return arrow
    target: |-
      def shift_right():
          arrow = ">"
          return arrow
    solution: '>j'
    hint: '> with a motion indents lines: >j indents this line and the next.'
    variants:
      - start: |-
          def put():
          ▮text = yanked
          return text
        target: |-
          def put():
              text = yanked
              return text
      - goal: 'Indent the body of the function.'
        ft: python
        start: |-
          def indent():
          ▮push = ">"
          return push
        target: |-
          def indent():
              push = ">"
              return push
        solution: '>j'
