week: 1
day: 7
review: true
title: Week 1 review
intro: |
  A mix of everything from this week. Try each one before reaching for
  `:Hint`, and try to match the reference keystroke count. Mixing topics like
  this is harder than doing one at a time, and that's the point: you have to
  pick the right command, not just repeat the last one.
keys: [ciw, ci(, das, dd, daw, ct, ">ip", "3f,"]
tasks:
  - goal: 'Fix what c stands for: change.'
    ft: python
    start: |-
      keys = {"c": "▮copy"}
    target: |-
      keys = {"c": "change"}
    solution: 'ciwchange<Esc>'
    hint: 'ciw or ci" both work.'
    variants:
      - goal: 'Fix what y stands for: yank.'
        start: |-
          keys = {"y": "▮yell"}
        target: |-
          keys = {"y": "yank"}
        solution: 'ciwyank<Esc>'
      - goal: 'Fix what d stands for: delete.'
        start: |-
          keys = {"d": "▮duplicate"}
        target: |-
          keys = {"d": "delete"}
        solution: 'ciwdelete<Esc>'
      - goal: 'Fix what p stands for: put.'
        start: |-
          keys = {"p": "▮paste"}
        target: |-
          keys = {"p": "put"}
        solution: 'ciwput<Esc>'
      - goal: 'Fix what t stands for: till.'
        start: |-
          keys = {"t": "▮to"}
        target: |-
          keys = {"t": "till"}
        solution: 'ciwtill<Esc>'
  - goal: 'Replace all three arguments with space.'
    ft: python
    start: |-
      remember(▮cram, cram, cram)
    target: |-
      remember(space)
    solution: 'ci(space<Esc>'
    hint: 'ci( changes everything inside the parentheses.'
    variants:
      - goal: 'Replace all three arguments with test.'
        start: |-
          learn(▮read, read, read)
        target: |-
          learn(test)
        solution: 'ci(test<Esc>'
      - goal: 'Replace both arguments with retrieve.'
        start: |-
          retain(▮reread, reread)
        target: |-
          retain(retrieve)
        solution: 'ci(retrieve<Esc>'
      - goal: 'Replace all three arguments with later.'
        start: |-
          review(▮now, now, now)
        target: |-
          review(later)
        solution: 'ci(later<Esc>'
      - goal: 'Replace all the arguments with 4.'
        start: |-
          chunks(▮1, 2, 3, 4, 5, 6, 7)
        target: |-
          chunks(4)
        solution: 'ci(4<Esc>'
  - goal: 'Delete the wrong sentence.'
    start: |-
      d deletes. ▮y means yell. c changes.
    target: |-
      d deletes. c changes.
    solution: 'das'
    hint: 'das deletes a sentence and its trailing space.'
    variants:
      - goal: 'Delete the wrong sentence.'
        start: |-
          Testing helps recall. ▮Rereading beats testing. Spacing helps too.
        target: |-
          Testing helps recall. Spacing helps too.
      - start: |-
          y yanks. ▮p means paste. P puts above.
        target: |-
          y yanks. P puts above.
      - start: |-
          Sleep helps memory. ▮Cramming beats spacing. Review tomorrow.
        target: |-
          Sleep helps memory. Review tomorrow.
      - start: |-
          f finds. ▮t means to. F looks back.
        target: |-
          f finds. F looks back.
  - goal: 'Delete the cramming and highlighting imports.'
    ft: python
    start: |-
      import spacing
      ▮import cramming
      import highlighting
      import testing
    target: |-
      import spacing
      import testing
    solution: '2dd'
    hint: 'A count works on dd too.'
    variants:
      - goal: 'Delete the cram and reread imports.'
        start: |-
          import sleep
          ▮import cram
          import reread
          import retrieval
        target: |-
          import sleep
          import retrieval
      - goal: 'Delete the highlight and reread imports.'
        start: |-
          import testing
          ▮import highlight
          import reread
          import spacing
        target: |-
          import testing
          import spacing
      - goal: 'Delete the blocking and massing imports.'
        start: |-
          import interleaving
          ▮import blocking
          import massing
          import sleep
        target: |-
          import interleaving
          import sleep
      - goal: 'Delete the copy and paste imports (Vim says yank and put).'
        start: |-
          import yank
          ▮import copy
          import paste
          import put
        target: |-
          import yank
          import put
  - goal: 'Change the subdomain to www.'
    start: |-
      url = 'https://▮old.vimhelp.org'
    target: |-
      url = 'https://www.vimhelp.org'
    solution: 'ciwwww<Esc>'
    hint: 'A dot ends a word, so ciw only takes "old". ct. works too.'
    variants:
      - goal: 'Change the subdomain to www.'
        start: |-
          url = 'https://▮test.wals.info'
        target: |-
          url = 'https://www.wals.info'
      - start: |-
          url = 'https://▮old.neovim.io'
        target: |-
          url = 'https://www.neovim.io'
      - start: |-
          url = 'https://▮beta.vim.org'
        target: |-
          url = 'https://www.vim.org'
      - start: |-
          url = 'https://▮m.wikipedia.org'
        target: |-
          url = 'https://www.wikipedia.org'
  - goal: 'Indent the body of the function.'
    ft: python
    start: |-
      def shift_right():
      ▮arrow = ">"
      return arrow
    target: |-
      def shift_right():
          arrow = ">"
          return arrow
    solution: '>j'
    hint: '> with a motion indents lines: >j indents this line and the next.'
    variants:
      - goal: 'Indent the body of the function.'
        start: |-
          def review():
          ▮due = tomorrow
          return due
        target: |-
          def review():
              due = tomorrow
              return due
      - start: |-
          def chunk():
          ▮size = 4
          return size
        target: |-
          def chunk():
              size = 4
              return size
      - start: |-
          def put():
          ▮text = yanked
          return text
        target: |-
          def put():
              text = yanked
              return text
      - start: |-
          def sleep():
          ▮memories = stable
          return memories
        target: |-
          def sleep():
              memories = stable
              return memories
