week: 4
day: 1
title: Ranges, :m and :t
intro: |
  Ex commands take a range: `:2,3d` deletes lines 2–3, `.` is the current
  line, `$` the last (the end, as in regex), `%` all of them. `:m` *moves*
  lines and `:t` copies them: *t* is for *transfer*, which is what the old ed
  editor called a copy. `:m0` moves this line to the top, `:t$` copies it to the end,
  `:1,2m$` moves lines 1–2 to the end. `:g/^/m0` reverses the whole file.
keys: [':2,3d', ':m0', ':t$', ':1,2m$', ':g/^/m0']
tasks:
  - goal: 'Move the last line to the top.'
    start: |-
      m is move
      0 is the top
      ▮:m0
    target: |-
      :m0
      m is move
      0 is the top
    solution: ':m0<CR>'
    hint: ':m0 moves the line below line 0, which is the top.'
    variants:
      - goal: 'Move the last line to the top.'
        start: |-
          line two
          line three
          ▮:m0 moves me up
        target: |-
          :m0 moves me up
          line two
          line three
  - goal: 'Copy the first line to the end of the file.'
    start: |-
      ▮:t transfers a copy
      to the end:
    target: |-
      :t transfers a copy
      to the end:
      :t transfers a copy
    solution: ':t$<CR>'
    hint: ':t$ copies the current line below the last line, and the cursor stays put.'
    variants:
      - goal: 'Copy the heading to the end of the file.'
        start: |-
          ▮Transfer
          t copies
          to the end
        target: |-
          Transfer
          t copies
          to the end
          Transfer
  - goal: 'Delete lines 2 and 3 without moving.'
    start: |-
      ▮before
      line two
      line three
      after
    target: |-
      before
      after
    solution: ':2,3d<CR>'
    hint: 'A range in front of d: :2,3d.'
    variants:
      - goal: 'Delete lines 2 and 3 without moving.'
        start: |-
          ▮range
          line 2
          line 3
          kept
        target: |-
          range
          kept
  - goal: 'Move the first two lines to the end.'
    start: |-
      ▮:m moves
      lines 1 and 2
      below the last:
      $ is the last line
    target: |-
      below the last:
      $ is the last line
      :m moves
      lines 1 and 2
    solution: ':1,2m$<CR>'
    hint: ':1,2m$ moves lines 1 to 2 below the last line.'
    variants:
      - start: |-
          ▮$ is the last line
          :m moves
          1,2 is the range
          so these come first
        target: |-
          1,2 is the range
          so these come first
          $ is the last line
          :m moves
  - goal: 'Reverse the order of the lines.'
    start: |-
      ▮m0
      to the top
      each line
      :g
    target: |-
      :g
      each line
      to the top
      m0
    solution: ':g/^/m0<CR>'
    hint: ':g/^/ matches every line, and m0 moves each to the top in turn.'
    variants:
      - start: |-
          ▮reversed
          is
          list
          this
        target: |-
          this
          list
          is
          reversed
