    start: |-
      storage
      retrieval
      ▮encoding
    target: |-
      encoding
      storage
      retrieval
    solution: ':m0<CR>'
    hint: ':m0 moves the line below line 0, which is the top.'
    variants:
      - goal: 'Move the last line to the top.'
        start: |-
          morphology
          syntax
          ▮phonology
        target: |-
          phonology
          morphology
          syntax
