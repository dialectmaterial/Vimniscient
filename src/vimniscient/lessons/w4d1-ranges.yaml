week: 4
day: 1
title: Ranges, :m and :t
intro: |
  Ex commands take a range: `:2,3d` deletes lines 2–3, `.` is the current
  line, `$` the last, `%` all of them. `:m` moves lines and `:t` copies
  them: `:m0` moves this line to the top, `:t$` copies it to the end,
  `:1,2m$` moves lines 1–2 to the end. `:g/^/m0` reverses the whole file.
keys: [':2,3d', ':m0', ':t$', ':1,2m$', ':g/^/m0']
tasks:
  - goal: 'Move the last line to the top.'
    start: |-
      a
      b
      ▮c
    target: |-
      c
      a
      b
    solution: ':m0<CR>'
    hint: ':m0 moves the line below line 0, which is the top.'
  - goal: 'Copy the header to the end of the file.'
    start: |-
      ▮header
      a
      b
    target: |-
      header
      a
      b
      header
    solution: ':t$<CR>'
    hint: ':t$ copies the current line below the last line, and the cursor stays put.'
  - goal: 'Delete lines 2 and 3 without moving.'
    start: |-
      ▮one
      two
      three
      four
    target: |-
      one
      four
    solution: ':2,3d<CR>'
    hint: 'A range in front of d: :2,3d.'
  - goal: 'Move the first two lines to the end.'
    start: |-
      ▮a
      b
      c
      d
    target: |-
      c
      d
      a
      b
    solution: ':1,2m$<CR>'
    hint: ':1,2m$ moves lines 1 to 2 below the last line.'
  - goal: 'Reverse the order of the lines.'
    start: |-
      ▮1
      2
      3
      4
    target: |-
      4
      3
      2
      1
    solution: ':g/^/m0<CR>'
    hint: ':g/^/ matches every line, and m0 moves each to the top in turn.'
