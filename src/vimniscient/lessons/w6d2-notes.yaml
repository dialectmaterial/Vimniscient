week: 6
day: 2
title: 'Real edits: notes'
intro: |
  Markdown and plain notes: lists, links, emphasis, headings and wrapped
  paragraphs.
keys: ['<C-v>I', 'gv', 'g<C-a>', ':s/&/', 'vipJ']
tasks:
  - goal: 'Turn the topics into a numbered list.'
    ft: markdown
    start: |-
      ▮encode
      consolidate
      retrieve
    target: |-
      1. encode
      2. consolidate
      3. retrieve
    solution: '<C-v>GI0. <Esc>gvg<C-a>'
    hint: 'Put "0. " in front of every line with a block insert, reselect with gv, then g Ctrl-a counts up.'
    variants:
      - goal: 'Turn the topics into a numbered list.'
        start: |-
          ▮semantics
          pragmatics
          discourse
        target: |-
          1. semantics
          2. pragmatics
          3. discourse
  - goal: 'Make a Markdown link.'
    ft: markdown
    start: |-
      ▮Vimhelp https://vimhelp.org
    target: |-
      [Vimhelp](https://vimhelp.org)
    solution: 'i[<Esc>ea]<Esc>lr(A)<Esc>'
    hint: 'Bracket the word, replace the space with ( using r, then A) closes it.'
    variants:
      - goal: 'Make a Markdown link.'
        start: |-
          ▮Glottolog https://glottolog.org
        target: |-
          [Glottolog](https://glottolog.org)
  - goal: 'Make every Spacing bold.'
    ft: markdown
    start: |-
      ▮Spacing works. Spacing lasts.
    target: |-
      **Spacing** works. **Spacing** lasts.
    solution: ':s/Spacing/**&**/g<CR>'
    hint: '& is the match, so **&** wraps it.'
    variants:
      - goal: 'Make every Stress bold.'
        start: |-
          ▮Stress is lexical. Stress shifts.
        target: |-
          **Stress** is lexical. **Stress** shifts.
        solution: ':s/Stress/**&**/g<CR>'
  - goal: 'Push every heading one level down.'
    ft: markdown
    start: |-
      ▮# Memory
      ## Encoding
      ## Retrieval
    target: |-
      ## Memory
      ### Encoding
      ### Retrieval
    solution: ':%s/^#/##/<CR>'
    hint: 'Add a # at the start of every heading line.'
    variants:
      - goal: 'Push every heading one level down.'
        start: |-
          ▮# Syntax
          ## Phrases
          ## Clauses
        target: |-
          ## Syntax
          ### Phrases
          ### Clauses
  - goal: 'Unwrap the paragraph into one line.'
    ft: markdown
    start: |-
      ▮Retrieval is
      not just a test of
      memory; it changes it.
    target: |-
      Retrieval is not just a test of memory; it changes it.
    solution: 'vipJ'
    hint: 'vip selects the paragraph, J joins it. That works for paragraphs of any length.'
    variants:
      - goal: 'Unwrap the paragraph into one line.'
        start: |-
          ▮The meaning of
          a word is its
          use.
        target: |-
          The meaning of a word is its use.
