  - goal: 'Fix the wrong sentence: it should say "A sentence ends at a full stop."'
    start: |-
      s is for sentence. A sentence ends at a ▮comma. cis changes just one.
    target: |-
      s is for sentence. A sentence ends at a full stop. cis changes just one.
    solution: 'cisA sentence ends at a full stop.<Esc>'
    hint: 'cis changes the inner sentence and leaves the spaces around it.'
    variants:
      - goal: 'Fix the wrong sentence: it should say "Spacing beats cramming."'
        start: |-
          Mnemonics tie the new to the known. Cramming beats ▮spacing. Testing beats rereading.
        target: |-
          Mnemonics tie the new to the known. Spacing beats cramming. Testing beats rereading.
        solution: 'cisSpacing beats cramming.<Esc>'
      - goal: 'Fix the wrong sentence: it should say "He used nonsense syllables."'
        start: |-
          Ebbinghaus tested himself. He used real ▮words. The curve dropped fast.
        target: |-
          Ebbinghaus tested himself. He used nonsense syllables. The curve dropped fast.
        solution: 'cisHe used nonsense syllables.<Esc>'
      - goal: 'Fix the wrong sentence: it should say "The i means inner."'
        start: |-
          cis keeps the spaces. The i means ▮around. das takes one along.
        target: |-
          cis keeps the spaces. The i means inner. das takes one along.
        solution: 'cisThe i means inner.<Esc>'
      - goal: 'Fix the wrong sentence: it should say "Sleep helps memories settle."'
        start: |-
