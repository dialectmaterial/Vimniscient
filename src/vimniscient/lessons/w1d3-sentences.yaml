week: 1
day: 3
title: Sentences and paragraphs
intro: |
  Bigger text objects: `is`/`as` for a sentence, `ip`/`ap` for a paragraph
  (a block of lines between empty lines). `ap` includes the empty line after
  it, so `dap` leaves no gap. Any operator works on them, including `>` to
  indent and `y` to yank.
keys: [dap, yap, cis, das, ">ip"]
tasks:
  - goal: 'Delete the middle paragraph.'
    start: |-
      Phonetics studies speech sounds.

      Syntax ▮studies sentences.
      It can wait until later.

      Semantics studies meaning.
    target: |-
      Phonetics studies speech sounds.

      Semantics studies meaning.
    solution: 'dap'
    hint: 'dap deletes the paragraph and the empty line after it.'
    variants:
      - goal: 'Delete the middle paragraph.'
        start: |-
          Morphology studies words.

          Pragmatics ▮studies use.
          It can wait.

          Syntax studies sentences.
        target: |-
          Morphology studies words.

          Syntax studies sentences.
  - goal: 'Duplicate the first paragraph.'
    start: |-
      ▮Colorless green ideas sleep furiously.

      Done.
    target: |-
      Colorless green ideas sleep furiously.

      Colorless green ideas sleep furiously.

      Done.
    solution: 'yapP'
    hint: 'yap yanks the paragraph with its empty line; P puts it above the cursor.'
    variants:
      - goal: 'Duplicate the first paragraph.'
        start: |-
          ▮The horse raced past the barn fell.

          Done.
        target: |-
          The horse raced past the barn fell.

          The horse raced past the barn fell.

          Done.
  - goal: 'Fix the wrong sentence: it should say "Verbs describe actions."'
    start: |-
      Nouns name things. Verbs describe ▮colours. Adjectives describe things.
    target: |-
      Nouns name things. Verbs describe actions. Adjectives describe things.
    solution: 'cisVerbs describe actions.<Esc>'
    hint: 'cis changes the inner sentence and leaves the spaces around it.'
    variants:
      - goal: 'Fix the wrong sentence: it should say "Stops block the air."'
        start: |-
          Vowels are voiced. Stops ▮are fricatives. Nasals use the nose.
        target: |-
          Vowels are voiced. Stops block the air. Nasals use the nose.
        solution: 'cisStops block the air.<Esc>'
  - goal: 'Delete the middle sentence.'
    start: |-
      Sapir taught Whorf. Whorf ▮worked in fire insurance. Whorf studied Hopi.
    target: |-
      Sapir taught Whorf. Whorf studied Hopi.
    solution: 'das'
    hint: 'das deletes a sentence plus the space after it.'
    variants:
      - goal: 'Delete the middle sentence.'
        start: |-
          Labov studied New York. Labov ▮sold ice cream. Labov counted variants.
        target: |-
          Labov studied New York. Labov counted variants.
  - goal: 'Indent the three levels.'
    start: |-
      Levels:

      ▮phonology
      morphology
      syntax
    target: |-
      Levels:

          phonology
          morphology
          syntax
    solution: '>ip'
    hint: '>ip indents the inner paragraph. (Indent here is 4 spaces.)'
    variants:
      - goal: 'Indent the three cases.'
        start: |-
          Cases:

          ▮nominative
          accusative
          genitive
        target: |-
          Cases:

              nominative
              accusative
              genitive
