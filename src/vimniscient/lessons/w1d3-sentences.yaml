week: 1
day: 3
title: Sentences and paragraphs
intro: |
  Bigger nouns: `s` is a *sentence* and `p` a *paragraph* (a block of lines
  between empty lines). `is`/`ip` are the thing itself; `as`/`ap` take the
  space or empty line after it too, so `dap` leaves no gap. Any verb works on
  them, including `>` (the arrow points the way the text moves) and `y`.
keys: [dap, yap, cis, das, ">ip"]
tasks:
  - goal: 'Delete the middle paragraph.'
    start: |-
      dap deletes a paragraph.

      This paragraph ▮is padding.
      It can go.

      It leaves no double gap behind.
    target: |-
      dap deletes a paragraph.

      It leaves no double gap behind.
    solution: 'dap'
    hint: 'd deletes, a takes the empty line after it, p is the paragraph.'
    variants:
      - goal: 'Delete the middle paragraph.'
        start: |-
          Ebbinghaus learned nonsense syllables and tested himself.

          This paragraph ▮is a distraction.
          It can go.

          Forgetting was fastest right after learning.
        target: |-
          Ebbinghaus learned nonsense syllables and tested himself.

          Forgetting was fastest right after learning.
  - goal: 'Duplicate the first paragraph.'
    start: |-
      ▮Retrieving a memory makes it stronger.

      Done.
    target: |-
      Retrieving a memory makes it stronger.

      Retrieving a memory makes it stronger.

      Done.
    solution: 'yapP'
    hint: 'yap yanks a paragraph with its empty line; P puts it above the cursor.'
    variants:
      - goal: 'Duplicate the first paragraph.'
        start: |-
          ▮yap yanks a paragraph; P puts it above.

          Done.
        target: |-
          yap yanks a paragraph; P puts it above.

          yap yanks a paragraph; P puts it above.

          Done.
  - goal: 'Fix the wrong sentence: it should say "A sentence ends at a full stop."'
    start: |-
      s is for sentence. A sentence ends at a ▮comma. cis changes just one.
    target: |-
      s is for sentence. A sentence ends at a full stop. cis changes just one.
    solution: 'cisA sentence ends at a full stop.<Esc>'
    hint: 'cis changes the inner sentence and leaves the spaces around it.'
    variants:
      - goal: 'Fix the wrong sentence: it should say "Spacing beats cramming."'
        start: |-
          Mnemonics tie the new to the known. Cramming beats ▮spacing. Testing beats rereading.
        target: |-
          Mnemonics tie the new to the known. Spacing beats cramming. Testing beats rereading.
        solution: 'cisSpacing beats cramming.<Esc>'
  - goal: 'Delete the middle sentence.'
    start: |-
      das deletes a sentence. This one ▮is wrong. Its space goes too.
    target: |-
      das deletes a sentence. Its space goes too.
    solution: 'das'
    hint: 'das deletes a sentence plus the space after it.'
    variants:
      - goal: 'Delete the middle sentence.'
        start: |-
          Miller wrote of seven, plus or minus two. Miller ▮sold ice cream. Cowan later argued for about four.
        target: |-
          Miller wrote of seven, plus or minus two. Cowan later argued for about four.
  - goal: 'Indent the three stages.'
    start: |-
      Stages of skill (Fitts & Posner):

      ▮cognitive
      associative
      autonomous
    target: |-
      Stages of skill (Fitts & Posner):

          cognitive
          associative
          autonomous
    solution: '>ip'
    hint: '> points right, ip is the inner paragraph. (Indent here is 4 spaces.)'
    variants:
      - goal: 'Indent the three lines.'
        start: |-
          What ip covers:

          ▮this line
          this line
          and this one
        target: |-
          What ip covers:

              this line
              this line
              and this one
