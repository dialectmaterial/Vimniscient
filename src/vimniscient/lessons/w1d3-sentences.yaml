week: 1
day: 3
title: Sentences and paragraphs
intro: |
  Bigger nouns: `s` is a *sentence* and `p` a *paragraph* (a block of lines
  between empty lines). `is`/`ip` are the thing itself; `as`/`ap` take the
  space or empty line after it too, so `dap` leaves no gap. Any verb works on
  them, including `>` (the arrow points the way the text moves) and `y`.
keys: [dap, yap, cis, das, ">ip"]
tasks:
  - goal: 'Delete the middle paragraph.'
    start: |-
      dap deletes a paragraph.

      This paragraph ▮is padding.
      It can go.

      It leaves no double gap behind.
    target: |-
      dap deletes a paragraph.

      It leaves no double gap behind.
    solution: 'dap'
    hint: 'd deletes, a takes the empty line after it, p is the paragraph.'
    variants:
      - goal: 'Delete the middle paragraph.'
        start: |-
          Ebbinghaus learned nonsense syllables and tested himself.

          This paragraph ▮is a distraction.
          It can go.

          Forgetting was fastest right after learning.
        target: |-
          Ebbinghaus learned nonsense syllables and tested himself.

          Forgetting was fastest right after learning.
      - start: |-
          a is around: the paragraph and the blank line after it.

          This line ▮is filler.
          So is this one.

          One gap stays.
        target: |-
          a is around: the paragraph and the blank line after it.

          One gap stays.
      - start: |-
          Spacing: one review today.

          Cram ▮it all
          the night before.

          Another review next week.
        target: |-
          Spacing: one review today.

          Another review next week.
      - start: |-
          Fitts and Posner named three stages of skill.

          There ▮are only two.

          The last one is autonomous.
        target: |-
          Fitts and Posner named three stages of skill.

          The last one is autonomous.
