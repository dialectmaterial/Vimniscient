week: 2
day: 7
review: true
title: Week 2 review
intro: |
  Dot, search, cgn, case, numbers and visual mode, mixed. Look for the
  shortest route before you start typing. Each retrieval you do now, a few
  days after learning, strengthens the memory more than another read would.
keys: [".", "*", cgn, gUiw, "<C-a>", Vu, dt]
tasks:
  - goal: 'Uppercase every standalone "srs".'
    ft: python
    start: |-
      ▮srs = schedule(srs)
    target: |-
      SRS = schedule(SRS)
    solution: '*gUiwn.'
    hint: '* finds the other whole-word srs; gUiw, then n and . for the first one.'
    variants:
      - goal: 'Uppercase every standalone "pos".'
        start: |-
          ▮pos = tag(pos)
        target: |-
          POS = tag(POS)
      - goal: 'Uppercase every standalone "url".'
        start: |-
          ▮url = parse(url)
        target: |-
          URL = parse(URL)
      - goal: 'Uppercase every standalone "pdf".'
        start: |-
          ▮pdf = open(pdf)
        target: |-
          PDF = open(PDF)
      - goal: 'Uppercase every standalone "tla".'
        start: |-
          ▮tla = expand(tla)
        target: |-
          TLA = expand(TLA)
  - goal: 'Add one to every review number.'
    start: |-
      ▮review1 review2 review3
    target: |-
      review2 review3 review4
    solution: '<C-a>w.w.'
    hint: 'Ctrl-a, then w and . to repeat it on the next ones.'
    variants:
      - goal: 'Add one to every case number.'
        start: |-
          ▮case1 case2 case3
        target: |-
          case2 case3 case4
      - goal: 'Add one to every day number.'
        start: |-
          ▮day1 day2 day3
        target: |-
          day2 day3 day4
      - goal: 'Add one to every step number.'
        start: |-
          ▮step1 step2 step3
        target: |-
          step2 step3 step4
      - goal: 'Add one to every chunk number.'
        start: |-
          ▮chunk1 chunk2 chunk3
        target: |-
          chunk2 chunk3 chunk4
  - goal: 'Fix every "teh".'
    start: |-
      ▮teh dot repeats teh change for teh rest
    target: |-
      the dot repeats the change for the rest
    solution: '*cgnthe<Esc>..'
    hint: '* then cgn, then . . for the others.'
    variants:
      - goal: 'Fix every "hte".'
        start: |-
          ▮hte stem and hte root and hte end
        target: |-
          the stem and the root and the end
      - goal: 'Fix every "teh".'
        start: |-
          ▮teh star, teh match, teh change
        target: |-
          the star, the match, the change
      - goal: 'Fix every "hte".'
        start: |-
          ▮hte gap, hte test, hte review
        target: |-
          the gap, the test, the review
      - goal: 'Fix every "eth".'
        start: |-
          ▮eth cue and eth recall and eth answer
        target: |-
          the cue and the recall and the answer
  - goal: 'Lowercase the whole line.'
    start: |-
      ▮V THEN U LOWERS THE LINE
    target: |-
      v then u lowers the line
    solution: 'Vu'
    hint: 'V selects the line, u lowercases the selection.'
    variants:
      - goal: 'Lowercase the whole line.'
        start: |-
          ▮ALL CAPS HIDES CASE
        target: |-
          all caps hides case
      - start: |-
          ▮LOWER THE WHOLE LINE
        target: |-
          lower the whole line
      - start: |-
          ▮SLEEP HELPS MEMORIES SETTLE
        target: |-
          sleep helps memories settle
      - start: |-
          ▮TESTING BEATS REREADING
        target: |-
          testing beats rereading
  - goal: 'Delete up to "Habits".'
    start: |-
      ▮well, the thing is: Habits form through repetition
    target: |-
      Habits form through repetition
    solution: 'dtH'
    hint: 't is case-sensitive, and the first capital H is in Habits, so dtH.'
    variants:
      - goal: 'Delete up to "Hausa".'
        start: |-
          ▮um, so, basically: Hausa has tone
        target: |-
          Hausa has tone
        hint: 't is case-sensitive, and the first capital H is in Hausa, so dtH.'
      - goal: 'Delete up to "Hermann".'
        start: |-
          ▮so, like, you know: Hermann Ebbinghaus tested himself
        target: |-
          Hermann Ebbinghaus tested himself
      - goal: 'Delete up to "Memory".'
        start: |-
          ▮okay, so, in short: Memory fades fast at first
        target: |-
          Memory fades fast at first
        solution: 'dtM'
      - goal: 'Delete up to "Testing".'
        start: |-
          ▮right, well, see: Testing beats rereading
        target: |-
