week: 2
day: 7
review: true
title: Week 2 review
skill: mixed
intro: |
  Dot, search, cgn, case, numbers and visual mode, mixed. Look for the
  shortest route before you start typing. Each retrieval you do now, a few
  days after learning, strengthens the memory more than another read would.
keys: [".", "*", cgn, gUiw, "<C-a>", Vu, dt]
tasks:
  - goal: 'Uppercase every standalone "up".'
    ft: python
    start: |-
      ▮up = raise(up)
    target: |-
      UP = raise(UP)
    solution: '*gUiwn.'
    hint: '* finds the other whole-word up; gUiw, then n and . for the first one.'
    variants:
      - goal: 'Uppercase every standalone "star".'
        hint: '* finds the other whole-word star; gUiw, then n and . for the first one.'
        start: |-
          ▮star = next(star)
        target: |-
          STAR = next(STAR)
  - goal: 'Add one to every number.'
    start: |-
      ▮add1 add2 add3
    target: |-
      add2 add3 add4
    solution: '<C-a>w.w.'
    hint: 'Ctrl-a, then w and . to repeat it on the next ones.'
    variants:
      - goal: 'Add one to every number.'
        start: |-
          ▮dot1 dot2 dot3
        target: |-
          dot2 dot3 dot4
  - goal: 'Fix every "teh".'
    start: |-
      ▮teh dot repeats teh change for teh rest
    target: |-
      the dot repeats the change for the rest
    solution: '*cgnthe<Esc>..'
    hint: '* then cgn, then . . for the others.'
    variants:
      - goal: 'Fix every "teh".'
        start: |-
          ▮teh star, teh match, teh change
        target: |-
          the star, the match, the change
  - goal: 'Lowercase the whole line.'
    start: |-
      ▮V THEN U LOWERS THE LINE
    target: |-
      v then u lowers the line
    solution: 'Vu'
    hint: 'V selects the line, u lowercases the selection.'
    variants:
      - start: |-
          ▮LOWER THE WHOLE LINE
        target: |-
          lower the whole line
  - goal: 'Delete up to "Hitting".'
    start: |-
      ▮well, the thing is: Hitting t stops one short
    target: |-
      Hitting t stops one short
    solution: 'dtH'
    hint: 't is case-sensitive, and the first capital H is in Hitting, so dtH.'
    variants:
      - goal: 'Delete up to "Hold".'
        start: |-
          ▮um, so, basically: Hold on: t stops before the H
        target: |-
          Hold on: t stops before the H
        hint: 't is case-sensitive, and the first capital H is in Hold, so dtH.'
  - goal: 'Comment out all three lines with "# ".'
    ft: python
    start: |-
      ▮insert = 1
      change = 2
      repeat = 3
    target: |-
      # insert = 1
      # change = 2
      # repeat = 3
    solution: 'I# <Esc>j.j.'
    hint: 'I# <Esc>, then j . j .'
    variants:
      - start: |-
          ▮big_i = 1
          start = 2
          dot = 3
        target: |-
          # big_i = 1
          # start = 2
          # dot = 3
