week: 5
day: 5
lazyvim: true
title: Comments (LazyVim)
intro: |
  `gc` (*go comment*) is the comment operator. It knows each language's comment syntax:
  `gcc` toggles the current line, `gcj` this line and the next, `gcip` the
  paragraph, and `gc` in visual mode the selection. Run it again to
  uncomment.
keys: [gcc, gcj, gcip, gc]
tasks:
  - goal: 'Comment out the line.'
    ft: python
    start: |-
      ▮gc = "go comment"
    target: |-
      # gc = "go comment"
    solution: 'gcc'
    hint: 'gcc toggles a comment on the line.'
    variants:
      - start: |-
          ▮comment = "gc"
        target: |-
          # comment = "gc"
  - goal: 'Uncomment the line.'
    ft: python
    start: |-
      # ▮comment = True
    target: |-
      comment = True
    solution: 'gcc'
    hint: 'gcc again removes it.'
    variants:
      - start: |-
          # ▮gcc = True
        target: |-
          gcc = True
  - goal: 'Comment out this line and the next.'
    ft: python
    start: |-
      ▮gc = 1
      plus_j = 2
      stays = 3
    target: |-
      # gc = 1
      # plus_j = 2
      stays = 3
    solution: 'gcj'
    hint: 'gc takes a motion, so gcj covers two lines.'
    variants:
      - start: |-
          ▮comment = 1
          two = 2
          stays = 3
        target: |-
          # comment = 1
          # two = 2
          stays = 3
  - goal: 'Comment out the first block.'
    ft: python
    start: |-
      ▮inner = 1
      paragraph = 2

      stays = 3
    target: |-
      # inner = 1
      # paragraph = 2

      stays = 3
    solution: 'gcip'
    hint: 'gcip comments the inner paragraph.'
    variants:
      - start: |-
          ▮gc = 1
          ip = 2

          stays = 3
        target: |-
          # gc = 1
          # ip = 2

          stays = 3
  - goal: 'Comment out the JavaScript line (a different comment style).'
    ft: javascript
    start: |-
      ▮let gc = "any language";
    target: |-
      // let gc = "any language";
    solution: 'gcc'
    hint: 'gc uses whatever comment syntax the language has.'
    variants:
      - start: |-
          ▮let gcc = true;
        target: |-
          // let gcc = true;
