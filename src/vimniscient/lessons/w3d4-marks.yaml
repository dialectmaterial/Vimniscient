week: 3
day: 4
title: Marks and jumps
intro: |
  `m` marks a spot: `ma` sets mark a. The plain quote `'a` goes to its line,
  the backtick `` `a `` to its exact letter, and
  both work as motions: `d'a` deletes the lines from here to the mark,
  `` c`a `` changes from the mark to the cursor. ` `` ` (two backticks)
  jumps back to where you were before the last jump (`G`, `/`, `%` …).
keys: [ma, "'a", '`a', "d'a", "y'a", '``']
tasks:
  - goal: 'Delete all the lines between BEGIN and END.'
    start: |-
      ▮BEGIN
      rereading
      highlighting
      summarizing
      copying notes
      listening again
      END
    target: |-
      BEGIN
      END
    solution: 'jma/END<CR>kd''a'
    hint: 'Mark the first line to go (ma), find the last one, then d''a. (d/END<Enter> from the first line is a nice shortcut too.)'
    variants:
      - goal: 'Delete all the lines between BEGIN and END.'
        start: |-
          ▮BEGIN
          nom: I
          acc: me
          gen: my
          dat: to me
          abl: from me
          END
        target: |-
          BEGIN
          END
  - goal: 'Copy the two mark lines under "Cheat sheet".'
    start: |-
      ▮== Marks ==
      m marks a spot
      ' jumps to its line
      == Cheat sheet ==
    target: |-
      == Marks ==
      m marks a spot
      ' jumps to its line
      == Cheat sheet ==
      m marks a spot
      ' jumps to its line
    solution: 'jmajy''aGp'
    hint: 'ma on the first line, j to the second, y''a yanks back to the mark, G p pastes at the end.'
    variants:
      - goal: 'Copy rendezvous and déjà vu under "Used in English".'
        start: |-
          ▮== French ==
          rendezvous
          déjà vu
          == Used in English ==
        target: |-
          == French ==
          rendezvous
          déjà vu
          == Used in English ==
          rendezvous
          déjà vu
        hint: 'ma on rendezvous, j to déjà vu, y''a yanks back to the mark, G p pastes at the end.'
  - goal: 'Change "rough, line-wise " to "humble ", using a mark.'
    start: |-
      The ▮rough, line-wise backtick lands on the exact letter
    target: |-
      The humble backtick lands on the exact letter
    solution: 'mafbc`ahumble <Esc>'
    hint: 'ma, go to the b of backtick, then c`a changes from the mark up to the cursor.'
    variants:
      - goal: 'Change "most frequent " to "commonest ", using a mark.'
        start: |-
          The ▮most frequent English word is the
        target: |-
          The commonest English word is the
        solution: 'mafEc`acommonest <Esc>'
        hint: 'ma, go to the E of English, then c`a changes from the mark up to the cursor.'
  - goal: 'Fix the typo on the last line, then jump back and fix the first.'
    start: |-
      ▮teh start
      `` jumps between
      the last two spots
      teh end
    target: |-
      the start
      `` jumps between
      the last two spots
      the end
    solution: 'Gcwthe<Esc>``.'
    hint: 'G is a jump, so `` takes you back. Then . repeats the change.'
    variants:
      - goal: 'Fix the typo on the last line, then jump back and fix the first.'
        start: |-
          ▮teh noun
          middle
          middle
          teh verb
        target: |-
          the noun
          middle
          middle
          the verb
