week: 2
day: 5
title: Getting into insert mode well
intro: |
  Choosing the right way into insert mode saves moving first: `o`/`O` *open*
  a line below/above, `ea` goes to the *end* of a word and *appends*, `R`
  keeps *replacing* (you type over text), `r` replaces one character without
  entering insert mode, and a count repeats what you type (`5i=<Esc>`). While
  typing, `Ctrl-w` wipes the last word and `Ctrl-u` undoes the whole line, so
  you rarely need Backspace.
keys: [o, O, ea, R, r, 5i, "<C-w>", "<C-u>"]
