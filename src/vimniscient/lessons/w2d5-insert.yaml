week: 2
day: 5
title: Getting into insert mode well
intro: |
  Choosing the right way into insert mode saves moving first: `o`/`O` *open*
  a line below/above, `ea` goes to the *end* of a word and *appends*, `R`
  keeps *replacing* (you type over text), `r` replaces one character without
  entering insert mode, and a count repeats what you type (`5i=<Esc>`). While
  typing, `Ctrl-w` wipes the last word and `Ctrl-u` undoes the whole line, so
  you rarely need Backspace.
keys: [o, O, ea, R, r, 5i, "<C-w>", "<C-u>"]
tasks:
  - goal: 'Add the line "below" between them.'
    start: |-
      ▮o opens a line
      O opens one above
    target: |-
      o opens a line
      below
      O opens one above
    solution: 'obelow<Esc>'
    hint: 'o opens a new line below and starts insert mode.'
    variants:
      - goal: 'Add the missing stage between them.'
        start: |-
          ▮encoding
          retrieval
        target: |-
          encoding
          storage
          retrieval
        solution: 'ostorage<Esc>'
  - goal: 'Add the line "O opened this one above" above.'
    start: |-
      ▮this line
    target: |-
      O opened this one above
      this line
    solution: 'OO opened this one above<Esc>'
    hint: 'Capital O opens a line above.'
    variants:
      - goal: 'Add an Introduction line above.'
        start: |-
          ▮Method
        target: |-
          Introduction
          Method
        solution: 'OIntroduction<Esc>'
  - goal: 'Fix "append" to "appends".'
    start: |-
      e goes to the end, and a ▮append after it.
    target: |-
      e goes to the end, and a appends after it.
    solution: 'eas<Esc>'
    hint: 'e goes to the end of the word, a appends after it.'
    variants:
      - goal: 'Make "allophone" plural.'
        start: |-
          Three ▮allophone appear.
        target: |-
          Three allophones appear.
  - goal: 'Underline the title with five = signs.'
    start: |-
      Recall
      ▮
    target: |-
      Recall
      =====
    solution: '5i=<Esc>'
    hint: 'A count before i repeats the inserted text.'
    variants:
      - goal: 'Underline the title with five = signs.'
        start: |-
          Tones
          ▮
        target: |-
          Tones
          =====
  - goal: 'Type the date 2026-10-26 over the zeros.'
    start: |-
      Next review: ▮0000-00-00
    target: |-
      Next review: 2026-10-26
    solution: 'R2026-10-26<Esc>'
    hint: 'R keeps replacing: it types over the existing characters.'
    variants:
      - goal: 'Overwrite the date with 2026-10-24.'
        start: |-
          Recorded: ▮2024-03-15
        target: |-
          Recorded: 2026-10-24
        solution: 'R2026-10-24<Esc>'
  - goal: 'Fix "keplaces" to "replaces".'
    start: |-
      r ▮keplaces one letter
    target: |-
      r replaces one letter
    solution: 'rr'
    hint: 'r replaces one character and stays in normal mode. Here that''s r, then r.'
    variants:
      - goal: 'Fix the operator: minus should be plus.'
        start: |-
          x = a ▮- b
        target: |-
          x = a + b
        solution: 'r+'
