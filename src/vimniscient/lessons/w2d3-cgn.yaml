week: 2
day: 3
title: The cgn trick
intro: |
  `gn` selects the next search match. So `cgn` changes the next match, and
  `.` then changes the one after that, and the one after that. Search once
  (with `/` or `*`), `cgn` the first, then press `.` per match. Press `n`
  to skip one you want to keep. `dgn` deletes matches the same way.
keys: ['cgn', 'dgn', '*cgn', 'n.']
tasks:
  - goal: 'Rename every tmp to buf.'
    ft: python
    start: |-
      ▮tmp = read()
      print(tmp)
      save(tmp)
    target: |-
      buf = read()
      print(buf)
      save(buf)
    solution: '*cgnbuf<Esc>..'
    hint: '* sets the search; cgnbuf<Esc> changes one match; . does the rest (it wraps around).'
  - goal: 'Change the first and the last "the" to "a", keep the middle one.'
    start: |-
      ▮the stem, the root and the base
    target: |-
      a stem, the root and a base
    solution: '*Ncgna<Esc>nn.'
    hint: '* then N to go back to the first; cgna<Esc>; n n skips one; . changes the last.'
  - goal: 'Replace "very good" with "great" on both lines.'
    start: |-
      ▮Her accent is very good.
      Her grammar is very good.
    target: |-
      Her accent is great.
      Her grammar is great.
    solution: '/very good<CR>cgngreat<Esc>.'
    hint: 'Search for the phrase, cgn changes the whole match, . the next one.'
  - goal: 'Change all four foo to bar.'
    start: |-
      rm ▮foo; rm foo; rm foo; rm foo
    target: |-
      rm bar; rm bar; rm bar; rm bar
    solution: '*cgnbar<Esc>...'
    hint: 'Same trick: * then cgn, then . for each remaining match.'
  - goal: 'Delete every "um, ".'
    start: |-
      So ▮um, a filler is um, a pause word um, like this.
    target: |-
      So a filler is a pause word like this.
    solution: '/um, <CR>dgn..'
    hint: 'dgn deletes the next match. Search for "um, " with the space.'
