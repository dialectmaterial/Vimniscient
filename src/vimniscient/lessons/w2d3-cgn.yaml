week: 2
day: 3
title: The cgn trick
intro: |
  `gn` reads as *go to the next match* and grab it: it selects the next
  search match. So `cgn` changes the next match, and `.` then changes the one
  after that, and the one after that. Search once (with `/` or `*`), `cgn`
  the first, then press `.` per match. Press `n` to skip one you want to
  keep. `dgn` deletes matches the same way.
keys: ['cgn', 'dgn', '*cgn', 'n.']
tasks:
  - goal: 'Rename every hit to next_match.'
    ft: python
    start: |-
      ▮hit = search()
      grab(hit)
      change(hit)
    target: |-
      next_match = search()
      grab(next_match)
      change(next_match)
    solution: '*cgnnext_match<Esc>..'
    hint: '* sets the search; cgn changes one match; . does the rest (it wraps around).'
    variants:
      - goal: 'Rename every cram to spaced.'
        start: |-
          ▮cram = plan()
          study(cram)
          review(cram)
        target: |-
          spaced = plan()
          study(spaced)
          review(spaced)
        solution: '*cgnspaced<Esc>..'
  - goal: 'Change the first and the last "the" to "a", keep the middle one.'
    start: |-
      ▮the change, the skip and the repeat
    target: |-
      a change, the skip and a repeat
    solution: '*Ncgna<Esc>nn.'
    hint: '* then N to go back to the first; cgna<Esc> changes; n n skips one; . repeats on the last.'
    variants:
      - goal: 'Change the first and the last "the" to "a", keep the middle one.'
        start: |-
          ▮the vowel, the glide and the stop
        target: |-
          a vowel, the glide and a stop
  - goal: 'Replace "very weak" with "strong" on both lines.'
    start: |-
      ▮Spaced recall is very weak.
      Tested recall is very weak.
    target: |-
      Spaced recall is strong.
      Tested recall is strong.
    solution: '/very weak<CR>cgnstrong<Esc>.'
    hint: 'Search for the phrase, cgn changes the whole match, . the next one.'
    variants:
      - goal: 'Replace "the last" with "the next" on both lines.'
        start: |-
          ▮gn goes to the last match.
          cgn changes the last match.
        target: |-
          gn goes to the next match.
          cgn changes the next match.
        solution: '/the last<CR>cgnthe next<Esc>.'
  - goal: 'Change all four n to dot.'
    start: |-
      echo ▮n; echo n; echo n; echo n
    target: |-
      echo dot; echo dot; echo dot; echo dot
    solution: '*cgndot<Esc>...'
    hint: 'Same trick: * then cgn, then . for each remaining match.'
    variants:
      - goal: 'Change all four tmp to out.'
        start: |-
          cp ▮tmp; cp tmp; cp tmp; cp tmp
        target: |-
          cp out; cp out; cp out; cp out
        solution: '*cgnout<Esc>...'
  - goal: 'Delete every "um, ".'
    start: |-
      dgn ▮um, deletes um, the next match um, each time.
    target: |-
      dgn deletes the next match each time.
    solution: '/um, <CR>dgn..'
    hint: 'dgn deletes the next match. Search for "um, " with the space.'
    variants:
      - goal: 'Delete every "like, ".'
        start: |-
          It's ▮like, a word that is like, just like, filler.
        target: |-
          It's a word that is just filler.
        solution: '/like, <CR>dgn..'
        hint: 'dgn deletes the next match. Search for "like, " with the space.'
