week: 5
day: 4
lazyvim: true
title: Sub-words, numbers, calls (LazyVim)
intro: |
  More of LazyVim's mini.ai objects: `e` is one part of a camelCase or
  snake_case word, `d` a number, `u` a function call (`au` takes the name
  and its arguments), and `g` the whole buffer. And there's a small
  built-in: `]<Space>` adds a blank line below without leaving normal mode.
keys: [cie, cid, cau, cag, ']<Space>']
tasks:
  - goal: 'Change Case to Big in the camelCase name.'
    start: |-
      camel▮CaseWord
    target: |-
      camelBigWord
    solution: 'cieBig<Esc>'
    hint: 'ie is the sub-word under the cursor.'
    variants:
      - goal: 'Change Count to Sum in the camelCase name.'
        start: |-
          vowel▮CountTotal
        target: |-
          vowelSumTotal
        solution: 'cieSum<Esc>'
  - goal: 'Change case to big in the snake_case name.'
    start: |-
      snake_▮case_name
    target: |-
      snake_big_name
    solution: 'ciebig<Esc>'
    hint: 'The same ie works between underscores.'
    variants:
      - goal: 'Change height to contour in the snake_case name.'
        start: |-
          tone_▮height_value
        target: |-
          tone_contour_value
        solution: 'ciecontour<Esc>'
  - goal: 'Change the port to 443.'
    start: |-
      port = 80▮80
    target: |-
      port = 443
    solution: 'cid443<Esc>'
    hint: 'id is the number under the cursor.'
    variants:
      - goal: 'Change the sample rate to 16000.'
        start: |-
          rate = 44▮100
        target: |-
          rate = 16000
        solution: 'cid16000<Esc>'
  - goal: 'Replace the whole call with 42.'
    ft: python
    start: |-
      x = ▮compute(a, b) + 1
    target: |-
      x = 42 + 1
    solution: 'cau42<Esc>'
    hint: 'au is a function call with its name and arguments.'
    variants:
      - goal: 'Replace the whole call with 1.'
        start: |-
          y = ▮score(w, t) * 2
        target: |-
          y = 1 * 2
        solution: 'cau1<Esc>'
  - goal: 'Replace the entire file with the word empty.'
    start: |-
      ▮draft
      notes
      here
    target: |-
      empty
    solution: 'cagempty<Esc>'
    hint: 'ag is the whole buffer.'
    variants:
      - goal: 'Replace the entire file with the word fresh.'
        start: |-
          ▮old
          text
          here
        target: |-
          fresh
        solution: 'cagfresh<Esc>'
  - goal: 'Add a blank line below without entering insert mode.'
    start: |-
      ▮Abstract
      Introduction
    target: |-
      Abstract

      Introduction
    solution: ']<Space>'
    hint: ']<Space> adds an empty line below, [<Space> one above.'
    variants:
      - goal: 'Add a blank line below without entering insert mode.'
        start: |-
          ▮Method
          Results
        target: |-
          Method

          Results
