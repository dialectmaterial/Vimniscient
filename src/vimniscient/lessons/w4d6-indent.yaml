week: 4
day: 6
title: Indenting
intro: |
  `>` and `<` are operators like `d`: `>>` and `<<` for one line, `>i{`
  for everything inside braces, `>G` to the end of the file. In visual mode
  a count indents several levels at once (`Vj2>`). The indent width here is
  4 spaces.
keys: ['>>', '<<', '>i{', '>G', 'V2>']
tasks:
  - goal: 'Indent everything inside the braces.'
    start: |-
      if x {
      ▮a()
      b()
      }
    target: |-
      if x {
          a()
          b()
      }
    solution: '>i{'
    hint: '>i{ indents the inside of the braces.'
  - goal: 'Remove one level of indentation.'
    start: |2-
              ▮x
    target: |2-
          x
    solution: '<<'
    hint: '<< outdents the line.'
  - goal: 'Indent both lines by two levels.'
    start: |-
      ▮a
      b
    target: |2-
              a
              b
    solution: 'Vj2>'
    hint: 'Select the lines with V j, then 2> indents twice.'
  - goal: 'Indent from here to the end of the file.'
    start: |-
      top
      ▮x
      y
    target: |-
      top
          x
          y
    solution: '>G'
    hint: '>G indents every line from here down.'
