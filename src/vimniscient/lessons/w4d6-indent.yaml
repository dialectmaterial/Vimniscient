week: 4
day: 6
title: Indenting
skill: edits
intro: |
  `>` and `<` are operators like `d`, and the arrow points the way the text
  moves: `>>` and `<<` for one line, `>i{`
  for everything inside braces, `>G` to the end of the file. In visual mode
  a count indents several levels at once (`Vj2>`). The indent width here is
  4 spaces.
keys: ['>>', '<<', '>i{', '>G', 'V2>']
tasks:
  - goal: 'Indent everything inside the braces.'
    start: |-
      if indent {
      ▮push_right()
      push_right()
      }
    target: |-
      if indent {
          push_right()
          push_right()
      }
    solution: '>i{'
    hint: '>i{ indents the inside of the braces.'
    variants:
      - goal: 'Indent everything inside the braces.'
        start: |-
          for block {
          ▮inner()
          push()
          }
        target: |-
          for block {
              inner()
              push()
          }
  - goal: 'Remove one level of indentation.'
    start: |2-
              ▮< pulls it back
    target: |2-
          < pulls it back
    solution: '<<'
    hint: '<< outdents the line.'
    variants:
      - start: |-
          ␣       ▮< outdents
        target: |-
          ␣   < outdents
  - goal: 'Indent both lines by two levels.'
    start: |-
      ▮2> shifts
      twice
    target: |2-
              2> shifts
              twice
    solution: 'Vj2>'
    hint: 'Select the lines with V j, then 2> indents twice.'
    variants:
      - start: |-
          ▮twice
          the shift
        target: |-
          ␣       twice
                  the shift
  - goal: 'Indent from here to the end of the file.'
    start: |-
      G goes
      ▮to the
      end
    target: |-
      G goes
          to the
          end
    solution: '>G'
    hint: '>G indents every line from here down.'
    variants:
      - start: |-
          G is
          ▮the last
          line
        target: |-
          G is
              the last
              line
