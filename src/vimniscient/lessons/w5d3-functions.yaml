week: 5
day: 3
lazyvim: true
title: Functions and classes (LazyVim)
intro: |
  With treesitter, mini.ai knows your code's structure: `f` is a *function*
  (`if` its body, `af` the whole function) and `c` a *class* (`ic`, `ac`).
  `daf` deletes a function wherever the cursor is inside it, and `cif`
  replaces its body.
keys: [daf, cif, yaf, dac]
tasks:
  - goal: 'Delete the function cram, and the empty line daf leaves behind.'
    ft: python
    start: |-
      x = 1

      def cram():
          ▮return 2

      y = 2
    target: |-
      x = 1


      y = 2
    solution: 'dafdd'
    hint: 'daf deletes the function wherever the cursor is in it. Its line stays, empty, so dd it.'
    variants:
      - goal: 'Delete the function g, and the empty line daf leaves behind.'
        start: |-
          a = 1

          def g():
              ▮return 3

          b = 2
        target: |-
          a = 1


          b = 2
      - goal: 'Delete the function reread, and the empty line daf leaves behind.'
        start: |-
          a = 1

          def reread():
              ▮return 0

          b = 2
        target: |-
          a = 1


          b = 2
      - goal: 'Delete the function highlight, and the empty line daf leaves behind.'
        start: |-
          x = 1

          def highlight():
              ▮return 0

          y = 2
        target: |-
          x = 1


          y = 2
  - goal: 'Replace the body with pass.'
    ft: python
    start: |-
      def highlight():
          ▮return 1
    target: |-
      def highlight():
          pass
    solution: 'cifpass<Esc>'
    hint: 'cif changes the inner function, its body.'
    variants:
      - goal: 'Replace the body with pass.'
        start: |-
          def g():
              ▮return 2
        target: |-
          def g():
              pass
      - start: |-
          def cram():
              ▮return 0
        target: |-
          def cram():
              pass
      - start: |-
          def summarize():
              ▮return 3
        target: |-
          def summarize():
              pass
  - goal: 'Delete the class, and the empty line it leaves.'
    ft: python
    start: |-
      x = 1

      class Cramming:
          ▮def night_before(self):
              pass

      y = 2
    target: |-
      x = 1


      y = 2
    solution: 'dacdd'
    hint: 'dac deletes the class around the cursor; dd removes the line it leaves.'
    variants:
      - goal: 'Delete the class, and the empty line it leaves.'
        start: |-
          a = 1

          class Tag:
              ▮def run(self):
                  pass

          b = 2
        target: |-
          a = 1


          b = 2
      - start: |-
          x = 1

          class Highlighter:
              ▮def mark(self):
                  pass

          y = 2
        target: |-
          x = 1


          y = 2
      - start: |-
          a = 1

          class Reread:
              ▮def again(self):
                  pass

          b = 2
        target: |-
          a = 1


          b = 2
  - goal: 'Duplicate the function below itself.'
    ft: python
    start: |-
      def ▮review():
          return 1
    target: |-
      def review():
          return 1
      def review():
          return 1
    solution: 'yafjo<Esc>p'
    hint: 'yaf yanks the function (and leaves you on its first line). Its text has no newline at the end, so go to the last line, open a new one (o<Esc>) and p onto it.'
    variants:
      - goal: 'Duplicate the function below itself.'
        start: |-
          def ▮g():
              return 2
        target: |-
          def g():
              return 2
          def g():
              return 2
      - start: |-
          def ▮test():
              return 1
        target: |-
          def test():
              return 1
          def test():
              return 1
      - start: |-
          def ▮space():
              return 7
        target: |-
          def space():
              return 7
          def space():
              return 7
