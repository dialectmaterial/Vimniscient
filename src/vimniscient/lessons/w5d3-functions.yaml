week: 5
day: 3
lazyvim: true
title: Functions and classes (LazyVim)
skill: text-objects
intro: |
  With treesitter, mini.ai knows your code's structure: `f` is a *function*
  (`if` its body, `af` the whole function) and `c` a *class* (`ic`, `ac`).
  `daf` deletes a function wherever the cursor is inside it, and `cif`
  replaces its body.
keys: [daf, cif, yaf, dac]
tasks:
  - goal: 'Delete the function delete_me, and the empty line daf leaves behind.'
    ft: python
    start: |-
      x = 1

      def delete_me():
          ▮return 2

      y = 2
    target: |-
      x = 1


      y = 2
    solution: 'dafdd'
    hint: 'daf deletes the function wherever the cursor is in it. Its line stays, empty, so dd it.'
    variants:
      - goal: 'Delete the function a_function, and the empty line daf leaves behind.'
        start: |-
          a = 1

          def a_function():
              ▮return 0

          b = 2
        target: |-
          a = 1


          b = 2
      - goal: 'Delete the function f_goes, and the empty line daf leaves behind.'
        start: |-
          a = 1

          def f_goes():
              ▮return 0

          b = 2
        target: |-
          a = 1


          b = 2
  - goal: 'Replace the body with pass.'
    ft: python
    start: |-
      def function():
          ▮return 1
    target: |-
      def function():
          pass
    solution: 'cifpass<Esc>'
    hint: 'cif changes the inner function, its body.'
    variants:
      - start: |-
          def f_is_function():
              ▮return 0
        target: |-
          def f_is_function():
              pass
      - start: |-
          def inner_f():
              ▮return 0
        target: |-
          def inner_f():
              pass
  - goal: 'Delete the class, and the empty line it leaves.'
    ft: python
    start: |-
      x = 1

      class Class:
          ▮def method(self):
              pass

      y = 2
    target: |-
      x = 1


      y = 2
    solution: 'dacdd'
    hint: 'dac deletes the class around the cursor; dd removes the line it leaves.'
    variants:
      - start: |-
          x = 1

          class C:
              ▮def is_class(self):
                  pass

          y = 2
        target: |-
          x = 1


          y = 2
      - start: |-
          x = 1

          class Cut:
              ▮def c_is_class(self):
                  pass

          y = 2
        target: |-
          x = 1


          y = 2
  - goal: 'Duplicate the function below itself.'
    ft: python
    start: |-
      def ▮function():
          return 1
    target: |-
      def function():
          return 1
      def function():
          return 1
    solution: 'yafjo<Esc>p'
    hint: 'yaf yanks the function (and leaves you on its first line). Its text has no newline at the end, so go to the last line, open a new one (o<Esc>) and p onto it.'
    variants:
      - start: |-
          def ▮f_for_function():
              return 1
        target: |-
          def f_for_function():
              return 1
          def f_for_function():
              return 1
      - start: |-
          def ▮yank_f():
              return 1
        target: |-
          def yank_f():
              return 1
          def yank_f():
              return 1
