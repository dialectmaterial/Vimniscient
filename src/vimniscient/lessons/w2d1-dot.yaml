week: 2
day: 1
title: The dot command
intro: |
  `.` repeats your last change: the whole thing, including the text you
  typed in insert mode. Read it as a full stop that says *again*. Make one
  change carefully, then move and press `.` wherever it should happen again.
  This is the most useful key in Vim.
keys: ['.', 'A;<Esc>j.', '>>j.', 'dw..']
tasks:
  - goal: 'Change both "cram" to "space".'
    start: |-
      memory = ▮cram + cram
    target: |-
      memory = space + space
    solution: 'ciwspace<Esc>ww.'
    hint: 'Change the first one with ciw, jump to the second with w w, then press .'
    variants:
      - goal: 'Change both "reread" to "test".'
        start: |-
          recall = ▮reread * reread
        target: |-
          recall = test * test
        solution: 'ciwtest<Esc>ww.'
      - goal: 'Change both "reread" to "test".'
        start: |-
          memory = ▮reread + reread
        target: |-
          memory = test + test
        solution: 'ciwtest<Esc>ww.'
      - goal: 'Change both "once" to "again".'
        start: |-
          dot = ▮once + once
        target: |-
          dot = again + again
        solution: 'ciwagain<Esc>ww.'
      - goal: 'Change both "hour" to "day".'
        start: |-
          gap = ▮hour * hour
        target: |-
          gap = day * day
        solution: 'ciwday<Esc>ww.'
  - goal: 'Add a semicolon to every line.'
    start: |-
      ▮let full_stop = "."
      let again = "."
      let repeat = "."
    target: |-
      let full_stop = ".";
      let again = ".";
      let repeat = ".";
    solution: 'A;<Esc>j.j.'
    hint: 'A;<Esc> on the first line, then j . j .'
    variants:
      - goal: 'Add a semicolon to every line.'
        start: |-
          ▮let day1 = review
          let day3 = review
          let day7 = review
        target: |-
          let day1 = review;
          let day3 = review;
          let day7 = review;
      - start: |-
          ▮let say = "once"
          let again = "twice"
          let repeat = "thrice"
        target: |-
          let say = "once";
          let again = "twice";
          let repeat = "thrice";
      - start: |-
          ▮let encode = 1
          let store = 2
          let retrieve = 3
        target: |-
          let encode = 1;
          let store = 2;
          let retrieve = 3;
      - start: |-
          ▮let chunk_a = 4
          let chunk_b = 4
          let chunk_c = 4
        target: |-
          let chunk_a = 4;
          let chunk_b = 4;
          let chunk_c = 4;
  - goal: 'Indent both lines.'
    start: |-
      ▮the dot says
      it again
    target: |2-
          the dot says
          it again
    solution: '>>j.'
    hint: '>> indents one line; . repeats it on the next.'
    variants:
      - goal: 'Indent both lines.'
        start: |-
          ▮encode
          retrieve
        target: |2-
              encode
              retrieve
      - start: |-
          ▮repeat
          the change
        target: |-
          ␣   repeat
              the change
      - start: |-
          ▮cognitive
          associative
        target: |-
          ␣   cognitive
              associative
      - start: |-
          ▮space it
          test it
        target: |-
          ␣   space it
              test it
  - goal: 'Delete all three "again".'
    start: |-
      The dot ▮again again again repeats the last change.
    target: |-
      The dot repeats the last change.
    solution: 'dw..'
    hint: 'dw once, then . twice. (3dw is just as short.)'
    variants:
      - goal: 'Delete all three "cram".'
        start: |-
          Massed ▮cram cram cram practice fades fast.
        target: |-
          Massed practice fades fast.
      - goal: 'Delete all three extra "soon".'
        start: |-
          Spaced reviews ▮soon soon soon beat one long cram.
        target: |-
          Spaced reviews beat one long cram.
      - goal: 'Delete the three extra "page".'
        start: |-
          Rereading the page ▮page page page feels fluent.
        target: |-
          Rereading the page feels fluent.
      - goal: 'Delete all three "dot".'
        start: |-
          The . key ▮dot dot dot repeats your last change.
        target: |-
          The . key repeats your last change.
  - goal: 'Turn the lines into a list with "- ".'
    start: |-
      ▮make one change
      move
      press the dot
    target: |-
      - make one change
      - move
      - press the dot
    solution: 'I- <Esc>j.j.'
    hint: 'I- <Esc> once, then j . j .'
    variants:
      - goal: 'Turn the lines into a list with "- ".'
        start: |-
          ▮test yourself
          space it out
          sleep on it
        target: |-
          - test yourself
          - space it out
          - sleep on it
      - start: |-
          ▮encode
          store
          retrieve
        target: |-
          - encode
          - store
          - retrieve
      - start: |-
          ▮I inserts at the start
          j moves down
          the dot repeats
        target: |-
          - I inserts at the start
          - j moves down
          - the dot repeats
      - start: |-
          ▮cognitive
          associative
          autonomous
        target: |-
          - cognitive
          - associative
          - autonomous
