week: 6
day: 3
title: 'Real edits: data'
intro: |
  CSV, logs and lists: swap columns, pull out fields, filter and sort.
keys: [':%s/\v( )', ':g/pat/d', ':sort n']
tasks:
  - goal: 'Swap the two columns.'
    start: |-
      ▮language,family
      Hindi,Indo-European
      Turkish,Turkic
    target: |-
      family,language
      Indo-European,Hindi
      Turkic,Turkish
    solution: ':%s/\v(.*),(.*)/\2,\1<CR>'
    hint: 'Two groups around the comma, swapped in the replacement.'
  - goal: 'Keep only the email addresses.'
    start: |-
      ▮id 1, email: sapir@yale.edu
      id 2, email: boas@columbia.edu
    target: |-
      sapir@yale.edu
      boas@columbia.edu
    solution: ':%s/.*email: //<CR>'
    hint: 'Delete everything up to and including "email: ".'
  - goal: 'Sort the courses by their number.'
    start: |-
      ▮syntax 3
      phonetics 1
      phonology 2
    target: |-
      phonetics 1
      phonology 2
      syntax 3
    solution: ':sort n<CR>'
    hint: ':sort n sorts by the first number on each line, wherever it is.'
  - goal: 'Drop the DEBUG lines, then the timestamps.'
    start: |-
      ▮10:01 INFO tagging started
      10:02 DEBUG token 17
      10:03 INFO tagging done
    target: |-
      INFO tagging started
      INFO tagging done
    solution: ':g/DEBUG/d<CR>:%s/^\S\+ //<CR>'
    hint: ':g/DEBUG/d first, then \S\+ (everything up to the first space) at the start of each line.'
