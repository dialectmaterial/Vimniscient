week: 1
day: 5
title: Whole lines and line ends
intro: |
  Capitals go big: `D` deletes to the end of the line, `C` changes to the end.
  Doubling a verb means the whole line: `dd` deletes it, `cc` changes it. `J`
  *joins* the next line on. `A` *appends* at the end and `I` *inserts* at the
  first non-blank character. `ddp` swaps two lines: cut, then put back one
  further down.
keys: [D, C, cc, dd, J, ddp, A, I]
tasks:
  - goal: 'Delete the rest of the line.'
    start: |-
      D is a big d: it deletes to the end.▮ Everything after the cursor goes.
    target: |-
      D is a big d: it deletes to the end.
    solution: 'D'
    hint: 'D deletes from the cursor to the end of the line.'
    variants:
      - start: |-
          D deletes from the cursor to the end.▮ This part goes.
        target: |-
          D deletes from the cursor to the end.
      - start: |-
          Capital D goes big.▮ All of this disappears at once.
        target: |-
          Capital D goes big.
  - goal: 'Change the rest of the line to "the end of the line".'
    start: |-
      C changes to: ▮somewhere in the middle
    target: |-
      C changes to: the end of the line
    solution: 'Cthe end of the line<Esc>'
    hint: 'C changes from the cursor to the end of the line.'
    variants:
      - goal: 'Change the rest of the line to "the rest of the line".'
        start: |-
          C is a big c: it changes ▮just a word
        target: |-
          C is a big c: it changes the rest of the line
        solution: 'Cthe rest of the line<Esc>'
  - goal: 'Replace the middle line with "cc changes a line".'
    start: |-
      c changes
      ▮typo
      c twice, a whole line
    target: |-
      c changes
      cc changes a line
      c twice, a whole line
    solution: 'cccc changes a line<Esc>'
    hint: 'cc, the doubled verb, changes the whole line, wherever the cursor is.'
    variants:
      - goal: 'Replace the middle line with "cc changes a line".'
        start: |-
          dd deletes a line
          ▮xx changes a line
          yy yanks a line
        target: |-
          dd deletes a line
          cc changes a line
          yy yanks a line
        solution: 'cccc changes a line<Esc>'
  - goal: 'Join the two lines.'
    start: |-
      ▮J joins this line
      and the next one.
    target: |-
      J joins this line and the next one.
    solution: 'J'
    hint: 'J joins the next line onto this one, with one space.'
    variants:
      - start: |-
          ▮gJ joins with no space;
          J adds one.
        target: |-
          gJ joins with no space; J adds one.
  - goal: 'Put the steps in order: delete first.'
    start: |-
      ▮then p puts
      dd deletes
      and the lines swap
    target: |-
      dd deletes
      then p puts
      and the lines swap
    solution: 'ddp'
    hint: 'dd cuts the line, p puts it below the next one.'
    variants:
      - goal: 'Put the steps of ddp in order: cut first.'
        start: |-
          ▮put
          cut
          and that is ddp
        target: |-
          cut
          put
          and that is ddp
  - goal: 'Add a semicolon at the end.'
    start: |-
      ▮console.log("A appends at the end")
    target: |-
      console.log("A appends at the end");
    solution: 'A;<Esc>'
    hint: 'A appends at the end of the line, wherever the cursor is.'
    variants:
      - goal: 'Add a semicolon at the end.'
        start: |-
          ▮return "A is for append"
        target: |-
          return "A is for append";
      - start: |-
          ▮let append = "A"
        target: |-
          let append = "A";
      - start: |-
          ▮print("A goes to the end")
        target: |-
          print("A goes to the end");
  - goal: 'Comment the line out with "# ".'
    ft: python
    start: |-
      insert = ▮"I puts you at the start"
    target: |-
      # insert = "I puts you at the start"
    solution: 'I# <Esc>'
    hint: 'I inserts at the start of the line.'
    variants:
      - start: |-
          start = ▮"I goes to the first letter"
        target: |-
          # start = "I goes to the first letter"
