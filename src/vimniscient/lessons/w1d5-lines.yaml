week: 1
day: 5
title: Whole lines and line ends
intro: |
  Capitals go big: `D` deletes to the end of the line, `C` changes to the end.
  Doubling a verb means the whole line: `dd` deletes it, `cc` changes it. `J`
  *joins* the next line on. `A` *appends* at the end and `I` *inserts* at the
  first non-blank character. `ddp` swaps two lines: cut, then put back one
  further down.
keys: [D, C, cc, dd, J, ddp, A, I]
tasks:
  - goal: 'Delete the rest of the line.'
    start: |-
      D is a big d: it deletes to the end.▮ Everything after the cursor goes.
    target: |-
      D is a big d: it deletes to the end.
    solution: 'D'
    hint: 'D deletes from the cursor to the end of the line.'
    variants:
      - goal: 'Delete the rest of the line.'
        start: |-
          Sleep helps new memories settle.▮ An all-nighter does not.
        target: |-
          Sleep helps new memories settle.
  - goal: 'Change the rest of the line to "the end of the line".'
    start: |-
      C changes to: ▮somewhere in the middle
    target: |-
      C changes to: the end of the line
    solution: 'Cthe end of the line<Esc>'
    hint: 'C changes from the cursor to the end of the line.'
    variants:
      - goal: 'Change the rest of the line to "seven, plus or minus two".'
        start: |-
          magical number (Miller, 1956): ▮a dozen or so
        target: |-
          magical number (Miller, 1956): seven, plus or minus two
        solution: 'Cseven, plus or minus two<Esc>'
  - goal: 'Replace the middle line with "storage".'
    start: |-
      encoding
      ▮forgetting
      retrieval
    target: |-
      encoding
      storage
      retrieval
    solution: 'ccstorage<Esc>'
    hint: 'cc, the doubled verb, changes the whole line, wherever the cursor is.'
    variants:
      - goal: 'Replace the middle line with "associative".'
        start: |-
          cognitive
          ▮hypnotic
          autonomous
        target: |-
          cognitive
          associative
          autonomous
        solution: 'ccassociative<Esc>'
  - goal: 'Join the two lines.'
    start: |-
      ▮J joins this line
      and the next one.
    target: |-
      J joins this line and the next one.
    solution: 'J'
    hint: 'J joins the next line onto this one, with one space.'
    variants:
      - goal: 'Join the two lines.'
        start: |-
          ▮The spacing effect is among the
          best-replicated findings on memory.
        target: |-
          The spacing effect is among the best-replicated findings on memory.
  - goal: 'Put the stages of skill in order: cognitive first.'
    start: |-
      ▮associative
      cognitive
      autonomous
    target: |-
      cognitive
      associative
      autonomous
    solution: 'ddp'
    hint: 'dd cuts the line, p puts it below the next one.'
    variants:
      - goal: 'Put the stages of memory in order: encoding first.'
        start: |-
          ▮storage
          encoding
          retrieval
        target: |-
          encoding
          storage
          retrieval
  - goal: 'Add a semicolon at the end.'
    start: |-
      ▮console.log("A appends at the end")
    target: |-
      console.log("A appends at the end");
    solution: 'A;<Esc>'
    hint: 'A appends at the end of the line, wherever the cursor is.'
    variants:
      - goal: 'Add a semicolon at the end.'
        start: |-
          ▮return "A is for append"
        target: |-
          return "A is for append";
  - goal: 'Comment the line out with "# ".'
    ft: python
    start: |-
      insert = ▮"I puts you at the start"
    target: |-
      # insert = "I puts you at the start"
    solution: 'I# <Esc>'
    hint: 'I inserts at the start of the line.'
    variants:
      - goal: 'Comment the line out with "# ".'
        start: |-
          cram = ▮True
        target: |-
          # cram = True
