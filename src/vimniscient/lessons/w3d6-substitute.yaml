week: 3
day: 6
title: ':s and :g'
skill: ex
intro: |
  `:s` *substitutes*: `:s/old/new/` on the current line, `:%s/old/new/g` on
  all lines (`%` is all of them, like 100 percent) and every match (`g`).
  An empty pattern (`:%s//new/g`) reuses your last search, so `*` then
  `:%s//x/g` renames a word. `\(…\)` groups (or `\v(…)` with very magic)
  come back as `\1`, `\2`. `:g/pat/cmd` runs a command on every matching
  line (`:g/pat/d`, `:g/pat/norm A;`), and `:v/pat/` on every line that
  doesn't match. `:g` is *global*: ed's `g/re/p` (global, regular
  expression, print) is where grep got its name.
keys: [':s', ':%s///g', '*:%s//', '\v( )\1', ':g/pat/d', ':v/pat/d', ':g/pat/norm']
tasks:
  - goal: 'Replace the first "old" with "new" on this line.'
    start: |-
      ▮:s substitutes old for old
    target: |-
      :s substitutes new for old
    solution: ':s/old/new<CR>'
    hint: ':s/old/new<Enter> changes the first match on the line. The final slash is optional.'
    variants:
      - goal: 'Replace "old" with "new" on this line.'
        start: |-
          ▮the old key: s is substitute
        target: |-
          the new key: s is substitute
  - goal: 'Use American spelling everywhere.'
    start: |-
      ▮the colour of a vowel
      is its timbre
    target: |-
      the color of a vowel
      is its timbre
    solution: ':%s/u//g<CR>'
    hint: ':%s/colour/color/g works, but look: the only u''s are in colour. :%s/u//g'
    variants:
      - start: |-
          ▮the behaviour
          of a neighbour
        target: |-
          the behavior
          of a neighbor
  - goal: 'Rename the word word (only the whole word) to term.'
    start: |-
      ▮word wordless word
      the word star key
    target: |-
      term wordless term
      the term star key
    solution: '*:%s//term/g<CR>'
    hint: '* searches for the whole word; an empty pattern in :s reuses that search.'
    variants:
      - goal: 'Rename the word star (only the whole word) to asterisk.'
        start: |-
          ▮star starry star
          the star key
        target: |-
          asterisk starry asterisk
          the asterisk key
        solution: '*:%s//asterisk/g<CR>'
  - goal: 'Turn "Last, First" into "First Last".'
    start: |-
      ▮Yank, y
      Put, p
    target: |-
      y Yank
      p Put
    solution: ':%s/\v(\w+), (\w+)/\2 \1<CR>'
    hint: 'With \v (very magic) ( ) are groups and + needs no backslash. \2 \1 swaps them.'
    variants:
      - goal: 'Turn "Last, First" into "First Last".'
        start: |-
          ▮Find, f
          Till, t
        target: |-
          f Find
          t Till
  - goal: 'Change x to y on the first two lines only.'
    start: |-
      ▮x = 1
      x = 2
      x = 3
    target: |-
      y = 1
      y = 2
      x = 3
    solution: 'Vj:s/x/y<CR>'
    hint: 'Select the lines first: typing : in visual mode limits the command to them.'
    variants:
      - goal: 'Change old to new on the first two lines only.'
        start: |-
          ▮old = 1
          old = 2
          old = 3
        target: |-
          new = 1
          new = 2
          old = 3
        solution: 'Vj:s/old/new<CR>'
  - goal: 'Delete every comment line.'
    start: |-
      ▮:g is global
      # note to self
      grep is named after g/re/p
      # check this
    target: |-
      :g is global
      grep is named after g/re/p
    solution: ':g/#/d<CR>'
    hint: ':g/#/d deletes every line that contains #.'
    variants:
      - start: |-
          ▮g is global
          # delete me
          d deletes
          # me too
        target: |-
          g is global
          d deletes
  - goal: 'Keep only the error lines.'
    start: |-
      ▮error: no gloss
      ok: 30 tokens
      error: bad tag
      warn: x
    target: |-
      error: no gloss
      error: bad tag
    solution: ':v/error/d<CR>'
    hint: ':v is the opposite of :g: it acts on the lines that don''t match.'
    variants:
      - start: |-
          ▮error: no target
          info: ok
          error: bad key
          note: fine
        target: |-
          error: no target
          error: bad key
  - goal: 'Add a semicolon to every put line, but not to the comment.'
    start: |-
      ▮put(a)
      # skip
      put(b)
    target: |-
      put(a);
      # skip
      put(b);
    solution: ':g/put/norm A;<CR>'
    hint: ':g/call/norm A; runs A; on each matching line.'
    variants:
      - goal: 'Add a semicolon to every yank line, but not to the comment.'
        start: |-
          ▮yank(x)
          # skip
          yank(y)
        target: |-
          yank(x);
          # skip
          yank(y);
        solution: ':g/yank/norm A;<CR>'
