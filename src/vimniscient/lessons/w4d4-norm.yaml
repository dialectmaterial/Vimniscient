week: 4
day: 4
title: ':normal on many lines'
skill: ex
intro: |
  `:norm` is short for *normal*: it runs normal-mode keys on each line of a range, as if you typed
  them there: `:%norm A;` appends to every line, `:'<,'>norm I// ` comments
  the selection. It's a macro without recording, and often the fastest way
  to make the same edit on many lines.
keys: [':%norm A;', ':%norm dw', ":'<,'>norm I", ':%norm $x']
tasks:
  - goal: 'Append a semicolon to every line.'
    start: |-
      ▮norm = "normal mode"
      keys = "typed for you"
      lines = "every one"
    target: |-
      norm = "normal mode";
      keys = "typed for you";
      lines = "every one";
    solution: ':%norm A;<CR>'
    hint: ':%norm A; runs A; on every line.'
    variants:
      - start: |-
          ▮a = "append"
          n = "normal"
          l = "lines"
        target: |-
          a = "append";
          n = "normal";
          l = "lines";
  - goal: 'Delete the first word of every line.'
    start: |-
      ▮- dw
      - norm
      - delete
    target: |-
      dw
      norm
      delete
    solution: ':%norm dw<CR>'
    hint: ':%norm dw deletes a word at the start of each line.'
    variants:
      - start: |-
          ▮* word
          * by
          * word
        target: |-
          word
          by
          word
  - goal: 'Comment out the first two lines with "// ".'
    start: |-
      ▮one();
      two();
      three();
    target: |-
      // one();
      // two();
      three();
    solution: 'Vj:norm I// <CR>'
    hint: 'Select the lines, then :norm I// '
    variants:
      - start: |-
          ▮norm();
          insert();
          keep();
        target: |-
          // norm();
          // insert();
          keep();
  - goal: 'Remove the last character of every line.'
    start: |-
      ▮dollar,
      then,
      x,
    target: |-
      dollar
      then
      x
    solution: ':%norm $x<CR>'
    hint: '$ goes to the last character, x deletes it.'
    variants:
      - start: |-
          ▮f!
          t!
          F!
        target: |-
          f
          t
          F
