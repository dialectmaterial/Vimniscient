week: 1
day: 6
title: Counts
intro: |
  A number in front repeats the command, and it reads like a numeral before a
  noun: `3dw` *delete three words*, `3dd` three lines, `5x` cross out five
  characters, `3J` join three lines, `2f,` find the second comma. `c2w`
  changes two words. Counting is often shorter than pressing a key again and
  again.
keys: [3dw, 3dd, c2w, 5x, "3f,", 3J]
tasks:
  - goal: 'Delete the three words "one two three".'
    start: |-
      A count repeats: 3dw ▮one two three deletes three words.
    target: |-
      A count repeats: 3dw deletes three words.
    solution: '3dw'
    hint: '3dw deletes three words, with their spaces.'
    variants:
      - goal: 'Delete the three words "over and over".'
        start: |-
          Rereading ▮over and over feels fluent but fades.
        target: |-
          Rereading feels fluent but fades.
  - goal: 'Delete the three low-utility techniques (Dunlosky et al., 2013).'
    start: |-
      practice testing
      ▮highlighting
      rereading
      summarizing
      distributed practice
    target: |-
      practice testing
      distributed practice
    solution: '3dd'
    hint: '3dd deletes three lines, starting at the cursor.'
    variants:
      - goal: 'Delete the three middle lines.'
        start: |-
          3dd deletes
          ▮this line,
          this line,
          this line,
          and stops.
        target: |-
          3dd deletes
          and stops.
  - goal: 'Change "three words" to "two words".'
    start: |-
      c2w changes ▮three words.
    target: |-
      c2w changes two words.
    solution: 'c2wtwo words<Esc>'
    hint: 'c2w changes two words.'
    variants:
      - goal: 'Change "feels easy" to "can feel hard".'
        start: |-
          Learning ▮feels easy when it is working.
        target: |-
          Learning can feel hard when it is working.
        solution: 'c2wcan feel hard<Esc>'
  - goal: 'Fix the number: 7, not 700000.'
    start: |-
      The magical number is 7▮00000, plus or minus two.
    target: |-
      The magical number is 7, plus or minus two.
    solution: '5x'
    hint: 'x crosses out a character; 5x crosses out five.'
    variants:
      - goal: 'Fix the number: about 4 chunks.'
        start: |-
          Cowan put working memory at about 4▮00000 chunks.
        target: |-
          Cowan put working memory at about 4 chunks.
  - goal: 'Delete from the third comma to the end (highlighting is the odd one out).'
    start: |-
      ▮spacing, testing, interleaving, highlighting
    target: |-
      spacing, testing, interleaving
    solution: '3f,D'
    hint: '3f, finds the third comma, D deletes from there.'
    variants:
      - goal: 'Delete from the third comma to the end (x isn''t a find command).'
        start: |-
          ▮f finds, t tills, F looks back, x crosses out
        target: |-
          f finds, t tills, F looks back
  - goal: 'Join the three lines into one.'
    start: |-
      ▮3J
      joins
      three
    target: |-
      3J joins three
    solution: '3J'
    hint: 'J joins; 3J joins three lines.'
    variants:
      - goal: 'Join the three lines into one.'
        start: |-
          ▮chunk
          by
          chunk
        target: |-
          chunk by chunk
