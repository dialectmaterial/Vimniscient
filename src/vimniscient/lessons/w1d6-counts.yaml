week: 1
day: 6
title: Counts
intro: |
  A number in front repeats the command, and it reads like a numeral before a
  noun: `3dw` *delete three words*, `3dd` three lines, `5x` cross out five
  characters, `3J` join three lines, `2f,` find the second comma. `c2w`
  changes two words. Counting is often shorter than pressing a key again and
  again.
keys: [3dw, 3dd, c2w, 5x, "3f,", 3J]
tasks:
  - goal: 'Delete the three words "one two three".'
    start: |-
      A count repeats: 3dw ▮one two three deletes three words.
    target: |-
      A count repeats: 3dw deletes three words.
    solution: '3dw'
    hint: '3dw deletes three words, with their spaces.'
    variants:
      - goal: 'Delete the three words "over and over".'
        start: |-
          Rereading ▮over and over feels fluent but fades.
        target: |-
          Rereading feels fluent but fades.
      - goal: 'Delete the three words "again and again".'
        start: |-
          Rereading ▮again and again feels like knowing.
        target: |-
          Rereading feels like knowing.
      - goal: 'Delete the three words "one two three".'
        start: |-
          A count before ▮one two three dw repeats it.
        target: |-
          A count before dw repeats it.
      - goal: 'Delete the three words "at first sometimes".'
        start: |-
          Spaced practice ▮at first sometimes feels slower but lasts.
        target: |-
          Spaced practice feels slower but lasts.
  - goal: 'Delete the three low-utility techniques (Dunlosky et al., 2013).'
    start: |-
      practice testing
      ▮highlighting
      rereading
      summarizing
      distributed practice
    target: |-
      practice testing
      distributed practice
    solution: '3dd'
    hint: '3dd deletes three lines, starting at the cursor.'
    variants:
      - goal: 'Delete the three middle lines.'
        start: |-
          3dd deletes
          ▮this line,
          this line,
          this line,
          and stops.
        target: |-
          3dd deletes
          and stops.
      - goal: 'Delete the three low-utility habits.'
        start: |-
          keep:
          ▮cram
          reread
          highlight
          space it out
        target: |-
          keep:
          space it out
      - goal: 'Delete the three middle lines.'
        start: |-
          3 is the count,
          ▮one
          two
          three
          dd is the verb.
        target: |-
          3 is the count,
          dd is the verb.
      - goal: 'Delete the three placeholder lines.'
        start: |-
          Miller 1956
          ▮x
          y
          z
          Cowan 2001
        target: |-
          Miller 1956
          Cowan 2001
  - goal: 'Change "three words" to "two words".'
    start: |-
      c2w changes ▮three words.
    target: |-
      c2w changes two words.
    solution: 'c2wtwo words<Esc>'
    hint: 'c2w changes two words.'
    variants:
      - goal: 'Change "feels easy" to "can feel hard".'
        start: |-
          Learning ▮feels easy when it is working.
        target: |-
