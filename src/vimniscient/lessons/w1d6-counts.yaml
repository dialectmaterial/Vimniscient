week: 1
day: 6
title: Counts
skill: motions
intro: |
  A number in front repeats the command, and it reads like a numeral before a
  noun: `3dw` *delete three words*, `3dd` three lines, `5x` cross out five
  characters, `3J` join three lines, `2f,` find the second comma. `c2w`
  changes two words. It works on motions too: `4j` goes four lines down, `3k`
  three up, and the relative numbers down the side count the lines for you.
  Counting is often shorter than pressing a key again and again.
keys: [3dw, 3dd, c2w, 5x, "3f,", 3J, 4j, 3k]
tasks:
  - goal: 'Delete the three words "one two three".'
    generate: count-dw
    start: |-
      A count repeats: 3dw ▮one two three deletes three words.
    target: |-
      A count repeats: 3dw deletes three words.
    solution: '3dw'
    hint: '3dw deletes three words, with their spaces.'
    variants:
      - goal: 'Delete the three words "one two three".'
        start: |-
          A count before ▮one two three dw repeats it.
        target: |-
          A count before dw repeats it.
  - goal: 'Delete the three middle lines.'
    generate: count-dd
    start: |-
      3dd deletes
      ▮this line,
      this line,
      this line,
      and stops.
    target: |-
      3dd deletes
      and stops.
    solution: '3dd'
    hint: '3dd deletes three lines, starting at the cursor.'
    variants:
      - goal: 'Delete the three middle lines.'
        start: |-
          3 is the count,
          ▮one
          two
          three
          dd is the verb.
        target: |-
          3 is the count,
          dd is the verb.
  - goal: 'Change "three words" to "two words".'
    start: |-
      c2w changes ▮three words.
    target: |-
      c2w changes two words.
    solution: 'c2wtwo words<Esc>'
    hint: 'c2w changes two words.'
    variants:
      - goal: 'Change "three things" to "two words".'
        start: |-
          c2w: change ▮three things.
        target: |-
          c2w: change two words.
        solution: 'c2wtwo words<Esc>'
  - goal: 'Fix the number: 5, not 500000.'
    generate: count-x
    start: |-
      The count is 5▮00000, and x goes five times.
    target: |-
      The count is 5, and x goes five times.
    solution: '5x'
    hint: 'x crosses out a character; 5x crosses out five.'
    variants:
      - goal: 'Delete the five x letters.'
        start: |-
          x crosses out ▮xxxxxone letter at a time.
        target: |-
          x crosses out one letter at a time.
  - goal: 'Delete from the third comma to the end (x isn''t a find command).'
    start: |-
      ▮f finds, t tills, F looks back, x crosses out
    target: |-
      f finds, t tills, F looks back
    solution: '3f,D'
    hint: '3f, finds the third comma, D deletes from there.'
    variants:
      - goal: 'Delete from the third comma to the end (z is not an operator).'
        start: |-
          ▮c changes, d deletes, y yanks, z naps
        target: |-
          c changes, d deletes, y yanks
  - goal: 'Join the three lines into one.'
    start: |-
      ▮3J
      joins
      three
    target: |-
      3J joins three
    solution: '3J'
    hint: 'J joins; 3J joins three lines.'
    variants:
      - start: |-
          ▮f
          finds
          forward
        target: |-
          f finds forward
      - start: |-
          ▮J
          glues
          lines
        target: |-
          J glues lines
  - goal: 'Delete the line four lines below the cursor.'
    start: |-
      ▮4j jumps four lines down,
      then dd cuts the line.
      The number column counts for you:
      it says how far each line is.
      this is the line to cut
      and this one stays.
    target: |-
      4j jumps four lines down,
      then dd cuts the line.
      The number column counts for you:
      it says how far each line is.
      and this one stays.
    solution: '4jdd'
    hint: 'Relative numbers show how far a line is: 4j goes four down, dd cuts it.'
    variants:
      - goal: 'Delete the line five lines below the cursor.'
        start: |-
          ▮count first, then move:
          one
          two
          three
          four
          five is the line to cut
          six
        target: |-
          count first, then move:
          one
          two
          three
          four
          six
        solution: '5jdd'

  - goal: 'Fix "Teh" three lines up.'
    start: |-
      Teh count goes first,
      then the motion,
      then the verb.
      ▮k counts up.
    target: |-
      The count goes first,
      then the motion,
      then the verb.
      k counts up.
    solution: '3kciwThe<Esc>'
    hint: 'k goes up; a count in front says how far. Then ciw fixes the word.'
    variants:
      - goal: 'Fix "Rleative" three lines up.'
        start: |-
          Rleative numbers
          show the count,
          so 3k goes
          ▮three lines up.
        target: |-
          Relative numbers
          show the count,
          so 3k goes
          three lines up.
        solution: '3kciwRelative<Esc>'
