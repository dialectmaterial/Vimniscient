        solution: 'c2wcan feel hard<Esc>'
      - goal: 'Change "seven items" to "about four".'
        start: |-
          Cowan said ▮seven items, give or take.
        target: |-
          Cowan said about four, give or take.
        solution: 'c2wabout four<Esc>'
      - goal: 'Change "three things" to "two words".'
        start: |-
          c2w: change ▮three things.
        target: |-
