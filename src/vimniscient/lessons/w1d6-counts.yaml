week: 1
day: 6
title: Counts
intro: |
  Put a number in front and it repeats: `3dw` deletes three words, `3dd`
  three lines, `5x` five characters, `3J` joins three lines, `2f,` finds the
  second comma. `c2w` changes two words. Counting is often shorter than
  pressing a key again and again.
keys: [3dw, 3dd, c2w, 5x, "3f,", 3J]
tasks:
  - goal: 'Delete the three fillers "um uh er".'
    start: |-
      Fillers ▮um uh er are common in speech.
    target: |-
      Fillers are common in speech.
    solution: '3dw'
    hint: '3dw deletes three words, with their spaces.'
    variants:
      - goal: 'Delete the three hedges "kinda sorta basically".'
        start: |-
          Hedges ▮kinda sorta basically are vague.
        target: |-
          Hedges are vague.
  - goal: 'Delete the three invented languages.'
    start: |-
      Latin
      ▮Klingon
      Quenya
      Dothraki
      Greek
    target: |-
      Latin
      Greek
    solution: '3dd'
    hint: '3dd deletes three lines, starting at the cursor.'
    variants:
      - goal: 'Delete the three constructed languages.'
        start: |-
          Hopi
          ▮Esperanto
          Lojban
          Volapük
          Navajo
        target: |-
          Hopi
          Navajo
  - goal: 'Change "very large" to "small".'
    start: |-
      a ▮very large corpus
    target: |-
      a small corpus
    solution: 'c2wsmall<Esc>'
    hint: 'c2w changes two words.'
    variants:
      - goal: 'Change "very old" to "recent".'
        start: |-
          a ▮very old manuscript
        target: |-
          a recent manuscript
        solution: 'c2wrecent<Esc>'
  - goal: 'Fix the number: about 7000 languages, not 700 million.'
    start: |-
      There are about 7000▮00000 languages.
    target: |-
      There are about 7000 languages.
    solution: '5x'
    hint: '5x deletes five characters.'
    variants:
      - goal: 'Fix the number: Spanish has 5 vowels.'
        start: |-
          Spanish has 5▮00000 vowels.
        target: |-
          Spanish has 5 vowels.
  - goal: 'Delete from the third comma to the end (Klingon isn''t Indo-Aryan).'
    start: |-
      ▮Hindi, Urdu, Punjabi, Klingon
    target: |-
      Hindi, Urdu, Punjabi
    solution: '3f,D'
    hint: '3f, jumps to the third comma, D deletes from there.'
    variants:
      - goal: 'Delete from the third comma to the end (Basque isn''t Uralic).'
        start: |-
          ▮Finnish, Estonian, Hungarian, Basque
        target: |-
          Finnish, Estonian, Hungarian
  - goal: 'Join the three lines into one.'
    start: |-
      ▮voiced
      bilabial
      plosive
    target: |-
      voiced bilabial plosive
    solution: '3J'
    hint: '3J joins three lines.'
    variants:
      - goal: 'Join the three lines into one.'
        start: |-
          ▮voiceless
          alveolar
          fricative
        target: |-
          voiceless alveolar fricative
