week: 3
day: 3
title: Registers
intro: |
  Every yank and delete goes into the unnamed register, so a delete can
  replace what you meant to paste. The quote mark names a register: `"a`
  means *in register a* (`"ayy`, `"ap`). Capital `"A` appends to it. `"0`
  holds the last yank, untouched by deletes. `"_` is the floor: text falls
  through it and is gone, so `"_d` deletes without saving anything. While
  typing, `Ctrl-r a` reads register a in, and `Ctrl-r =` is a calculator.
keys: ['"ayy', '"ap', '"0p', '"_d', '"Ayy', '<C-r>0', '<C-r>=']
tasks:
  - goal: 'Copy the first line to the end and delete junk, without losing it.'
    start: |-
      ▮named registers
      junk
      survive deletes:
    target: |-
      named registers
      survive deletes:
      named registers
    solution: '"ayyjdd"ap'
    hint: 'yy then dd would paste junk. Yank into a named register: "ayy, then later "ap.'
    variants:
      - goal: 'Copy "competence" to the end and delete junk, without losing "competence".'
        start: |-
          ▮competence
          junk
          performance
        target: |-
          competence
          performance
          competence
  - goal: 'Delete the typo line, then paste the line you yanked at the end.'
    start: |-
      ▮0 holds the last yank
      typo
      even after a delete:
    target: |-
      0 holds the last yank
      even after a delete:
      0 holds the last yank
    solution: 'yyjdd"0p'
    hint: 'Register 0 always holds the last yank, even after a delete.'
    variants:
      - goal: 'Delete the typo line, then paste the line you yanked at the end.'
        start: |-
          ▮sign
          typo
          referent:
        target: |-
          sign
          referent:
          sign
  - goal: 'Delete the misspelling "black hoel" and replace "blak hole" with "black hole". Keep black hole in the unnamed register.'
    start: |-
      ▮black hole
      black hoel
      blak hole
    target: |-
      black hole
      black hole
    solution: 'yyj"_ddVp'
    hint: '"_dd drops the line through the floor, so the unnamed register still holds black hole. Vp pastes over the line.'
    variants:
      - goal: 'Delete the misspelling "sintax" and replace "syntaks" with "syntax". Keep syntax in the unnamed register.'
        start: |-
          ▮syntax
          sintax
          syntaks
        target: |-
          syntax
          syntax
        hint: '"_dd deletes into the black hole, so the unnamed register still holds syntax. Vp pastes over the line.'
  - goal: 'Add the last word of line 1 to the end of line 2.'
    start: |-
      ▮reads in: register
      Ctrl-r inserts a
    target: |-
      reads in: register
      Ctrl-r inserts a register
    solution: '$yiwjA <C-r>0<Esc>'
    hint: 'Yank the word, then in insert mode Ctrl-r 0 reads it in for you.'
    variants:
      - goal: 'Add the name from line 1 to the end of line 2.'
        start: |-
          ▮name: Boas
          greeting: hi
        target: |-
          name: Boas
          greeting: hi Boas
  - goal: 'Fill in the product while typing.'
    start: |-
      ▮Ctrl-r = is a calculator (6 * 7):
    target: |-
      Ctrl-r = is a calculator (6 * 7): 42
    solution: 'A <C-r>=6*7<CR><Esc>'
    hint: 'In insert mode, Ctrl-r = opens a calculator: type 6*7 and Enter.'
    variants:
      - goal: 'Fill in the difference while typing.'
        start: |-
          ▮Ebbinghaus to Roediger, in years (2006 - 1885):
        target: |-
          Ebbinghaus to Roediger, in years (2006 - 1885): 121
        solution: 'A <C-r>=2006-1885<CR><Esc>'
        hint: 'In insert mode, Ctrl-r = opens a calculator: type 2006-1885 and Enter.'
  - goal: 'Collect the first and last lines in one register and paste both at the end.'
    start: |-
      ▮capital A
      skip
      appends
    target: |-
      capital A
      skip
      appends
      capital A
      appends
    solution: '"ayyjj"Ayy"ap'
    hint: 'A capital register name appends: "ayy, then "Ayy on appends, then "ap.'
    variants:
      - goal: 'Collect onset and coda in one register and paste both at the end.'
