week: 3
day: 3
title: Registers
intro: |
  Every yank and delete goes into the unnamed register, so a delete can
  replace what you meant to paste. Name a register with `"a` (`"ayy`,
  `"ap`), append to it with `"A`, paste the last yank with `"0p`, and delete
  without saving anything with `"_d`. While typing, `Ctrl-r a` inserts
  register a, and `Ctrl-r =` inserts the result of a calculation.
keys: ['"ayy', '"ap', '"0p', '"_d', '"Ayy', '<C-r>0', '<C-r>=']
tasks:
  - goal: 'Copy "langue" to the end and delete junk, without losing "langue".'
    start: |-
      ▮langue
      junk
      parole
    target: |-
      langue
      parole
      langue
    solution: '"ayyjdd"ap'
    hint: 'yy then dd would paste junk. Yank into a named register: "ayy, then later "ap.'
    variants:
      - goal: 'Copy "competence" to the end and delete junk, without losing "competence".'
        start: |-
          ▮competence
          junk
          performance
        target: |-
          competence
          performance
          competence
  - goal: 'Delete the typo line, then paste the line you yanked at the end.'
    start: |-
      ▮signifier
      typo
      signified:
    target: |-
      signifier
      signified:
      signifier
    solution: 'yyjdd"0p'
    hint: 'Register 0 always holds the last yank, even after a delete.'
    variants:
      - goal: 'Delete the typo line, then paste the line you yanked at the end.'
        start: |-
          ▮sign
          typo
          referent:
        target: |-
          sign
          referent:
          sign
  - goal: 'Delete the misspelling "phonene" and replace "phonem" with "phoneme". Keep phoneme in the unnamed register.'
    start: |-
      ▮phoneme
      phonene
      phonem
    target: |-
      phoneme
      phoneme
    solution: 'yyj"_ddVp'
    hint: '"_dd deletes into the black hole, so the unnamed register still holds phoneme. Vp pastes over the line.'
    variants:
      - goal: 'Delete the misspelling "sintax" and replace "syntaks" with "syntax". Keep syntax in the unnamed register.'
        start: |-
          ▮syntax
          sintax
          syntaks
        target: |-
          syntax
          syntax
        hint: '"_dd deletes into the black hole, so the unnamed register still holds syntax. Vp pastes over the line.'
  - goal: 'Add the name from line 1 to the end of line 2.'
    start: |-
      ▮name: Sapir
      greeting: hello
    target: |-
      name: Sapir
      greeting: hello Sapir
    solution: '$yiwjA <C-r>0<Esc>'
    hint: 'Yank the word, then in insert mode Ctrl-r 0 types it for you.'
    variants:
      - goal: 'Add the name from line 1 to the end of line 2.'
        start: |-
          ▮name: Boas
          greeting: hi
        target: |-
          name: Boas
          greeting: hi Boas
  - goal: 'Fill in the sum while typing.'
    start: |-
      ▮phonemes (24 + 20):
    target: |-
      phonemes (24 + 20): 44
    solution: 'A <C-r>=24+20<CR><Esc>'
    hint: 'In insert mode, Ctrl-r = opens a calculator: type 24+20 and Enter.'
    variants:
      - goal: 'Fill in the product while typing.'
        start: |-
          ▮vowels (5 * 2):
        target: |-
          vowels (5 * 2): 10
        solution: 'A <C-r>=5*2<CR><Esc>'
        hint: 'In insert mode, Ctrl-r = opens a calculator: type 5*2 and Enter.'
  - goal: 'Collect noun and verb in one register and paste both at the end.'
    start: |-
      ▮noun
      skip
      verb
    target: |-
      noun
      skip
      verb
      noun
      verb
    solution: '"ayyjj"Ayy"ap'
    hint: 'A capital register name appends: "ayy, then "Ayy on verb, then "ap.'
    variants:
      - goal: 'Collect onset and coda in one register and paste both at the end.'
        start: |-
          ▮onset
          skip
          coda
        target: |-
          onset
          skip
          coda
          onset
          coda
        hint: 'A capital register name appends: "ayy, then "Ayy on coda, then "ap.'
