week: 3
day: 2
title: Smarter macros
intro: |
  A macro can search (`/TODO<Enter>` inside it finds the next one), use
  `Ctrl-a`, and run on a range with `:2,$norm @a` (*norm* for normal mode:
  it types the keys on each line). `@@` plays again at the same place: the
  last macro you played.
keys: ['/ in a macro', '@@', ':norm @a', 'yyp<C-a>']
tasks:
  - goal: 'Uppercase the word after every TODO.'
    start: |-
      ▮1 TODO review this
      2 nothing here
      3 TODO test that
      4 TODO space it
    target: |-
      1 TODO REVIEW this
      2 nothing here
      3 TODO TEST that
      4 TODO SPACE it
    solution: 'qa/TODO<CR>wgUiwq2@a'
    hint: 'Let the macro find its own place: /TODO<Enter> w gUiw.'
    variants:
      - goal: 'Uppercase the word after every TODO.'
        start: |-
          ▮a TODO check this
          b fine
          c TODO gloss that
          d TODO tag it
        target: |-
          a TODO CHECK this
          b fine
          c TODO GLOSS that
          d TODO TAG it
      - start: |-
          ▮1 TODO space this
          2 done
          3 TODO test that
          4 TODO sleep now
        target: |-
          1 TODO SPACE this
          2 done
          3 TODO TEST that
          4 TODO SLEEP now
      - start: |-
          ▮x TODO macro it
          y skip
          z TODO record this
          w TODO play that
        target: |-
          x TODO MACRO it
          y skip
          z TODO RECORD this
          w TODO PLAY that
  - goal: 'Turn every comma into " | ", using @a once and then @@.'
    start: |-
      ▮q,record
      @,play
      @@,again
    target: |-
      q | record
      @ | play
      @@ | again
    solution: 'qa0f,xi | <Esc>jq@a@@'
    hint: '0 f, x deletes the comma, i | <Esc> inserts the separator, j moves on. Then @a, then @@.'
    variants:
      - goal: 'Turn every comma into " | ", using @a once and then @@.'
        start: |-
          ▮onset,coda
          head,dependent
          topic,comment
        target: |-
          onset | coda
          head | dependent
          topic | comment
      - start: |-
          ▮key,hook
          f,find
          t,till
        target: |-
          key | hook
          f | find
          t | till
      - start: |-
          ▮Miller,seven
          Cowan,four
          Ebbinghaus,1885
        target: |-
          Miller | seven
          Cowan | four
          Ebbinghaus | 1885
  - goal: 'Put every line in parentheses: record on the first line, then use :norm for the rest.'
    start: |-
      ▮spacing
      testing
      sleep
      mnemonics
    target: |-
      (spacing)
      (testing)
      (sleep)
      (mnemonics)
    solution: 'qaI(<Esc>A)<Esc>q:2,$norm @a<CR>'
    hint: 'No j in this macro. :2,$norm @a runs it once on every line from 2 to the end.'
    variants:
      - goal: 'Put every line in parentheses: record on the first line, then use :norm for the rest.'
        start: |-
          ▮DP
          TP
          CP
          VP
        target: |-
          (DP)
          (TP)
          (CP)
          (VP)
      - start: |-
          ▮encode
          store
          retrieve
          forget
        target: |-
          (encode)
          (store)
          (retrieve)
          (forget)
      - start: |-
          ▮q
          @a
          @@
          norm
        target: |-
          (q)
          (@a)
          (@@)
          (norm)
  - goal: 'Make a numbered list of four items.'
    start: |-
      ▮1. Test yourself.
    target: |-
      1. Test yourself.
      2. Test yourself.
      3. Test yourself.
      4. Test yourself.
    solution: 'qayyp<C-a>q2@a'
    hint: 'yyp copies the line, Ctrl-a bumps its number. Record that, then 2@a.'
    variants:
      - goal: 'Make a numbered list of four items.'
        start: |-
          ▮1. Review after a delay.
        target: |-
          1. Review after a delay.
          2. Review after a delay.
          3. Review after a delay.
          4. Review after a delay.
      - start: |-
          ▮1. Space your reviews.
        target: |-
          1. Space your reviews.
          2. Space your reviews.
          3. Space your reviews.
          4. Space your reviews.
      - start: |-
          ▮1. Record, then replay.
        target: |-
          1. Record, then replay.
          2. Record, then replay.
          3. Record, then replay.
          4. Record, then replay.
