week: 3
day: 2
title: Smarter macros
intro: |
  A macro can search (`/TODO<Enter>` inside it finds the next one), use
  `Ctrl-a`, and run on a range with `:2,$norm @a`. `@@` replays the last
  macro you played.
keys: ['/ in a macro', '@@', ':norm @a', 'yyp<C-a>']
tasks:
  - goal: 'Uppercase the word after every TODO.'
    start: |-
      ▮x TODO fix this
      y nothing here
      z TODO check that
      w TODO test it
    target: |-
      x TODO FIX this
      y nothing here
      z TODO CHECK that
      w TODO TEST it
    solution: qa/TODO<CR>wgUiwq2@a
    hint: 'Let the macro find its own place: /TODO<Enter> w gUiw.'
  - goal: 'Turn every comma into " | ", using @a once and then @@.'
    start: |-
      ▮a,b
      c,d
      e,f
    target: |-
      a | b
      c | d
      e | f
    solution: qa0f,xi | <Esc>jq@a@@
    hint: '0 f, x deletes the comma, i | <Esc> inserts the separator, j moves on. Then @a, then @@.'
  - goal: 'Put every line in parentheses: record on the first line, then use :norm for the rest.'
    start: |-
      ▮one
      two
      three
      four
    target: |-
      (one)
      (two)
      (three)
      (four)
    solution: 'qaI(<Esc>A)<Esc>q:2,$norm @a<CR>'
    hint: 'No j in this macro. :2,$norm @a runs it once on every line from 2 to the end.'
  - goal: 'Make a numbered list of four items.'
    start: |-
      ▮1. intro
    target: |-
      1. intro
      2. intro
      3. intro
      4. intro
    solution: qayyp<C-a>q2@a
    hint: 'yyp copies the line, Ctrl-a bumps its number. Record that, then 2@a.'
