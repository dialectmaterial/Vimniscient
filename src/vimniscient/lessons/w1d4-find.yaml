week: 1
day: 4
title: Find and till on a line
intro: |
  `f{char}` *finds* the next {char} on the line and lands *on* it; `t{char}`
  goes *till* it and stops just before. Capital `F` and `T` look backwards.
  `;` repeats the last one (a semicolon says *and so on*), `,` repeats it the
  other way (a comma steps back). With a verb they become precise: `dt,`
  deletes till the comma, `ct;` changes till the semicolon.
keys: [f, t, F, T, ";", ",", dt, ct]
tasks:
  - goal: 'Delete everything up to "just".'
    start: |-
      t means till: it stops ▮way way just before the letter.
    target: |-
      t means till: it stops just before the letter.
    solution: 'dtj'
    hint: 'dtj deletes till the next j after the cursor; "way way" has none.'
    variants:
      - goal: 'Delete everything up to "links".'
        start: |-
          The keyword method ▮kind of links a new word to a sound-alike image.
        target: |-
          The keyword method links a new word to a sound-alike image.
        solution: 'dtl'
        hint: 'dtl deletes till the next l after the cursor; "kind of" has none.'
      - goal: 'Delete everything up to "just".'
        start: |-
          dt stops ▮a bit early: just before the letter.
        target: |-
          dt stops just before the letter.
        solution: 'dtj'
      - goal: 'Delete everything up to "himself".'
        start: |-
          Ebbinghaus tested ▮mainly himself, his only subject.
        target: |-
          Ebbinghaus tested himself, his only subject.
        solution: 'dth'
      - goal: 'Delete everything up to "helps".'
        start: |-
          Spacing ▮really, truly helps memory last.
        target: |-
          Spacing helps memory last.
        solution: 'dth'
