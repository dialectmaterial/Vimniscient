    start: |-
      f_lands = ▮before(char)  # t stops before it
    target: |-
      f_lands = on_it  # t stops before it
    solution: 'ct on_it<Esc>'
    hint: 't works with a space too. ct<Space> changes till the next space.'
    variants:
