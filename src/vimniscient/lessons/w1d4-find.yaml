week: 1
day: 4
title: Find and till on a line
intro: |
  `f{char}` *finds* the next {char} on the line and lands *on* it; `t{char}`
  goes *till* it and stops just before. Capital `F` and `T` look backwards.
  `;` repeats the last one (a semicolon says *and so on*), `,` repeats it the
  other way (a comma steps back). With a verb they become precise: `dt,`
  deletes till the comma, `ct;` changes till the semicolon.
keys: [f, t, F, T, ";", ",", dt, ct]
tasks:
  - goal: 'Delete everything up to "just".'
    start: |-
      t means till: it stops ▮way way just before the letter.
    target: |-
      t means till: it stops just before the letter.
    solution: 'dtj'
    hint: 'dtj deletes till the next j after the cursor; "way way" has none.'
    variants:
      - goal: 'Delete everything up to "links".'
        start: |-
          The keyword method ▮kind of links a new word to a sound-alike image.
        target: |-
          The keyword method links a new word to a sound-alike image.
        solution: 'dtl'
        hint: 'dtl deletes till the next l after the cursor; "kind of" has none.'
  - goal: 'Change the value to "till" (keep the semicolon).'
    start: |-
      let t = ▮"through"; let f = "find";
    target: |-
      let t = "till"; let f = "find";
    solution: 'ct;"till"<Esc>'
    hint: 'ct; changes till, not including, the semicolon.'
    variants:
      - goal: 'Change the value to 1 (keep the semicolon).'
        start: |-
          let review_after = ▮never; let forgotten = true;
        target: |-
          let review_after = 1; let forgotten = true;
        solution: 'ct;1<Esc>'
  - goal: 'Keep only the folder path: delete the file name.'
    start: |-
      memory/keys/vim/forgotten.tx▮t
    target: |-
      memory/keys/vim/
    solution: 'T/D'
    hint: 'Capital T goes backwards: T/ stops just after the last slash; D deletes to the end of the line.'
    variants:
      - goal: 'Keep only the folder path: delete the file name.'
        start: |-
          science/testing-effect/roediger-2006/notes.t▮xt
        target: |-
          science/testing-effect/roediger-2006/
  - goal: 'Turn the third comma into a semicolon.'
    start: |-
      ▮spacing, testing, mnemonics, sleep
    target: |-
      spacing, testing, mnemonics; sleep
    solution: '3f,r;'
    hint: 'f, then ; ; walks comma by comma ("and so on"). A count is shorter: 3f, and then r; replaces the character.'
    variants:
      - goal: 'Turn the third comma into a semicolon.'
        start: |-
          ▮Ebbinghaus, Bartlett, Tulving, Baddeley
        target: |-
          Ebbinghaus, Bartlett, Tulving; Baddeley
  - goal: 'Replace the whole before(char) call with on_it.'
    ft: python
    start: |-
      f_lands = ▮before(char)  # t stops before it
    target: |-
      f_lands = on_it  # t stops before it
    solution: 'ct on_it<Esc>'
    hint: 't works with a space too. ct<Space> changes till the next space.'
    variants:
      - goal: 'Replace the whole reread(notes()) call with retrieve.'
        start: |-
          best = ▮reread(notes())  # retrieval wins
        target: |-
          best = retrieve  # retrieval wins
        solution: 'ct retrieve<Esc>'
  - goal: 'Delete the part in brackets: from the cursor up to and including the ")".'
    start: |-
      f lands on▮ (not before) the letter.
    target: |-
      f lands on the letter.
    solution: 'df)'
    hint: 'f finds and lands on the ), so df) deletes the bracket too.'
    variants:
      - goal: 'Delete the part in brackets: from the cursor up to and including the ")".'
        start: |-
          Spaced reviews▮ (a day, then a week) beat cramming.
        target: |-
          Spaced reviews beat cramming.
