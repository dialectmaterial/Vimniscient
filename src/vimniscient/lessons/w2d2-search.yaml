week: 2
day: 2
title: Searching as a motion
intro: |
  `/text<Enter>` jumps to the next match, `?text<Enter>` to the previous one,
  `n`/`N` repeat it. `*` searches for the word under the cursor. A search is
  a motion, so `d/STOP<Enter>` deletes up to the match. In your setup a
  lowercase search ignores case and an uppercase letter makes it exact
  (smartcase).
keys: [/, "?", n, N, "*", d/]
tasks:
  - goal: 'Change "lazy" to "sleepy".'
    start: |-
      ▮The quick brown fox
      jumps over the lazy dog
    target: |-
      The quick brown fox
      jumps over the sleepy dog
    solution: /l<CR>cwsleepy<Esc>
    hint: Search for as little as you need. /l<Enter> lands on lazy already.
  - goal: 'Delete everything before STOP.'
    start: |-
      ▮remove all of this STOP keep this
    target: |-
      STOP keep this
    solution: d/S<CR>
    hint: d/S<Enter> deletes up to the next S (uppercase, so the search is exact).
  - goal: 'Rename the second "count" to n.'
    ft: python
    start: |-
      ▮count = 0
      total = count + 1
    target: |-
      count = 0
      total = n + 1
    solution: '*ciwn<Esc>'
    hint: '* jumps to the next occurrence of the word under the cursor.'
  - goal: 'Delete the third "um".'
    start: |-
      so ▮um I um think um yes
    target: |-
      so um I um think yes
    solution: '*ndaw'
    hint: '* goes to the second um, n to the third, daw deletes it.'
  - goal: 'Change the last "beta" to BETA, searching backwards.'
    start: |-
      alpha beta gamma beta delt▮a
    target: |-
      alpha beta gamma BETA delta
    solution: ?b<CR>cwBETA<Esc>
    hint: ?b<Enter> searches backwards from the cursor.
