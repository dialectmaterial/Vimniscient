week: 2
day: 2
title: Searching as a motion
intro: |
  `/text<Enter>` jumps to the next match (the slash leans forward),
  `?text<Enter>` to the previous one (a question asks back). `n` repeats it,
  `N` the other way. `*` stars the word under the cursor and looks for it
  everywhere. A search is a motion, so `d/STOP<Enter>` deletes up to the
  match. In your setup a lowercase search ignores case and an uppercase
  letter makes it exact (smartcase).
keys: [/, "?", n, N, "*", d/]
tasks:
  - goal: 'Change "backwards" to "ahead".'
    start: |-
      ▮The slash leans forward,
      so it searches backwards
    target: |-
      The slash leans forward,
      so it searches ahead
    solution: '/b<CR>cwahead<Esc>'
    hint: 'Search for as little as you need. /b<Enter> lands on backwards already.'
    variants:
      - goal: 'Change "slowly" to "fast".'
        start: |-
          ▮Forgetting starts
          slowly, then levels off
        target: |-
          Forgetting starts
          fast, then levels off
        solution: '/sl<CR>cwfast<Esc>'
        hint: 'Search for as little as you need. /sl<Enter> lands on slowly already.'
      - goal: 'Change "back" to "forward".'
        start: |-
          ▮Searching forward,
          the slash leans back
        target: |-
          Searching forward,
          the slash leans forward
        solution: '/b<CR>cwforward<Esc>'
      - goal: 'Change "faster" to "slower".'
        start: |-
          ▮Spaced practice
          fades faster than massed
        target: |-
          Spaced practice
          fades slower than massed
        solution: '/fas<CR>cwslower<Esc>'
      - goal: 'Change "guess" to "match".'
        start: |-
          ▮Search is a motion:
          d/ deletes up to a guess
        target: |-
          Search is a motion:
          d/ deletes up to a match
        solution: '/g<CR>cwmatch<Esc>'
  - goal: 'Delete the hedging before "Search".'
    start: |-
      ▮er, like, honestly, Search is a motion
    target: |-
      Search is a motion
    solution: 'd/S<CR>'
    hint: 'd/S<Enter> deletes up to the next S (uppercase, so the search is exact).'
    variants:
      - goal: 'Delete the hedging before "Testing".'
        start: |-
          ▮um, well, you know, Testing beats rereading
        target: |-
          Testing beats rereading
        solution: 'd/T<CR>'
        hint: 'd/T<Enter> deletes up to the next T (uppercase, so the search is exact).'
      - goal: 'Delete the hedging before "Slash".'
        start: |-
          ▮so, basically, Slash leans forward
        target: |-
          Slash leans forward
        solution: 'd/S<CR>'
      - goal: 'Delete the hedging before "Spacing".'
        start: |-
          ▮well, sort of, Spacing beats cramming
        target: |-
          Spacing beats cramming
        solution: 'd/S<CR>'
      - goal: 'Delete the hedging before "Retrieval".'
        start: |-
          ▮well, anyway, Retrieval builds memory
        target: |-
          Retrieval builds memory
        solution: 'd/R<CR>'
  - goal: 'Rename the second "starred" to found.'
    ft: python
    start: |-
      ▮starred = "this word"
      next_one = starred
    target: |-
      starred = "this word"
      next_one = found
    solution: '*ciwfound<Esc>'
    hint: '* stars the word under the cursor and jumps to its next match.'
    variants:
      - goal: 'Rename the second whole word "interval" to n.'
        start: |-
          ▮interval = 1
          interval_days = interval * 2
        target: |-
          interval = 1
          interval_days = n * 2
        solution: '*ciwn<Esc>'
        hint: '* only matches whole words, so it skips interval_days.'
      - goal: 'Rename the second whole word "star" to match.'
        start: |-
          ▮star = "*"
          found = star
        target: |-
          star = "*"
          found = match
        solution: '*ciwmatch<Esc>'
      - goal: 'Rename the second whole word "chunk" to n.'
        start: |-
          ▮chunk = 4
          chunk_count = chunk + 1
        target: |-
          chunk = 4
          chunk_count = n + 1
        solution: '*ciwn<Esc>'
      - goal: 'Rename the second whole word "gap" to days.'
        start: |-
          ▮gap = 7
          next_review = today + gap
        target: |-
          gap = 7
          next_review = today + days
        solution: '*ciwdays<Esc>'
  - goal: 'Delete the third "next".'
    start: |-
      n means ▮next, and N means the next next one back.
    target: |-
      n means next, and N means the next one back.
    solution: '*ndaw'
    hint: '* goes to the second next, n to the third, daw deletes it.'
    variants:
      - goal: 'Delete the third "yourself".'
        start: |-
          Test ▮yourself, then space it, then test yourself yourself again.
        target: |-
          Test yourself, then space it, then test yourself again.
        hint: '* goes to the second yourself, n to the third, daw deletes it.'
      - goal: 'Delete the third "star".'
        start: |-
          The ▮star finds the next star, then the star star after.
        target: |-
          The star finds the next star, then the star after.
      - goal: 'Delete the third "it".'
        start: |-
          Space ▮it out, test it, then test it it again.
        target: |-
          Space it out, test it, then test it again.
      - goal: 'Delete the third "back".'
        start: |-
          N goes ▮back, n goes on, so go back back once.
        target: |-
          N goes back, n goes on, so go back once.
  - goal: 'Change the last "forward" to "backward", searching backwards.'
    start: |-
      / leans forward and searches forward; ? asks forward, from the en▮d.
    target: |-
      / leans forward and searches forward; ? asks backward, from the end.
    solution: '?fo<CR>cwbackward<Esc>'
    hint: '?fo<Enter> asks backwards from the cursor.'
    variants:
      - goal: 'Change the last "restudy" to "testing", searching backwards.'
        start: |-
          Restudy wins after five minutes; restudy wins after a we▮ek.
        target: |-
          Restudy wins after five minutes; testing wins after a week.
        solution: '?res<CR>cwtesting<Esc>'
        hint: '?res<Enter> searches backwards for the start of restudy.'
      - goal: 'Change the last "forward" to "backward", searching backwards.'
        start: |-
          ? asks backward; / leans forward; ? looks forward from the en▮d.
        target: |-
          ? asks backward; / leans forward; ? looks backward from the end.
        solution: '?fo<CR>cwbackward<Esc>'
      - goal: 'Change the last "seven" to "four", searching backwards.'
        start: |-
          Miller said seven; Cowan said seven▮.
        target: |-
          Miller said seven; Cowan said four.
        solution: '?se<CR>cwfour<Esc>'
      - goal: 'Change the last "wins" to "loses", searching backwards.'
        start: |-
          Cramming wins at first; cramming wins in the lon▮g run.
        target: |-
          Cramming wins at first; cramming loses in the long run.
        solution: '?w<CR>cwloses<Esc>'
