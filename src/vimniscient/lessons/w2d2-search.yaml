week: 2
day: 2
title: Searching as a motion
intro: |
  `/text<Enter>` jumps to the next match (the slash leans forward),
  `?text<Enter>` to the previous one (a question asks back). `n` repeats it,
  `N` the other way. `*` stars the word under the cursor and looks for it
  everywhere. A search is a motion, so `d/STOP<Enter>` deletes up to the
  match. In your setup a lowercase search ignores case and an uppercase
  letter makes it exact (smartcase).
keys: [/, "?", n, N, "*", d/]
tasks:
  - goal: 'Change "backwards" to "ahead".'
    start: |-
      ▮The slash leans forward,
      so it searches backwards
    target: |-
      The slash leans forward,
      so it searches ahead
    solution: '/b<CR>cwahead<Esc>'
    hint: 'Search for as little as you need. /b<Enter> lands on backwards already.'
    variants:
      - goal: 'Change "slowly" to "fast".'
        start: |-
          ▮Forgetting starts
          slowly, then levels off
        target: |-
          Forgetting starts
          fast, then levels off
        solution: '/sl<CR>cwfast<Esc>'
        hint: 'Search for as little as you need. /sl<Enter> lands on slowly already.'
  - goal: 'Delete the hedging before "Search".'
    start: |-
      ▮er, like, honestly, Search is a motion
    target: |-
      Search is a motion
    solution: 'd/S<CR>'
    hint: 'd/S<Enter> deletes up to the next S (uppercase, so the search is exact).'
    variants:
      - goal: 'Delete the hedging before "Testing".'
        start: |-
          ▮um, well, you know, Testing beats rereading
        target: |-
          Testing beats rereading
        solution: 'd/T<CR>'
        hint: 'd/T<Enter> deletes up to the next T (uppercase, so the search is exact).'
  - goal: 'Rename the second "starred" to found.'
    ft: python
    start: |-
      ▮starred = "this word"
      next_one = starred
    target: |-
      starred = "this word"
      next_one = found
    solution: '*ciwfound<Esc>'
    hint: '* stars the word under the cursor and jumps to its next match.'
    variants:
      - goal: 'Rename the second whole word "interval" to n.'
        start: |-
          ▮interval = 1
          interval_days = interval * 2
        target: |-
          interval = 1
          interval_days = n * 2
        solution: '*ciwn<Esc>'
        hint: '* only matches whole words, so it skips interval_days.'
  - goal: 'Delete the third "next".'
    start: |-
      n means ▮next, and N means the next next one back.
    target: |-
      n means next, and N means the next one back.
    solution: '*ndaw'
    hint: '* goes to the second next, n to the third, daw deletes it.'
    variants:
      - goal: 'Delete the third "yourself".'
        start: |-
          Test ▮yourself, then space it, then test yourself yourself again.
        target: |-
          Test yourself, then space it, then test yourself again.
        hint: '* goes to the second yourself, n to the third, daw deletes it.'
  - goal: 'Change the last "forward" to "backward", searching backwards.'
    start: |-
      / leans forward and searches forward; ? asks forward, from the en▮d.
    target: |-
      / leans forward and searches forward; ? asks backward, from the end.
    solution: '?fo<CR>cwbackward<Esc>'
    hint: '?fo<Enter> asks backwards from the cursor.'
    variants:
      - goal: 'Change the last "restudy" to "testing", searching backwards.'
        start: |-
          Restudy wins after five minutes; restudy wins after a we▮ek.
        target: |-
          Restudy wins after five minutes; testing wins after a week.
        solution: '?res<CR>cwtesting<Esc>'
        hint: '?res<Enter> searches backwards for the start of restudy.'
