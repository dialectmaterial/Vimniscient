week: 2
day: 2
title: Searching as a motion
skill: search
intro: |
  `/text<Enter>` jumps to the next match (the slash leans forward),
  `?text<Enter>` to the previous one (a question asks back). `n` repeats it,
  `N` the other way. `*` stars the word under the cursor and looks for it
  everywhere. A search is a motion, so `d/STOP<Enter>` deletes up to the
  match. In your setup a lowercase search ignores case and an uppercase
  letter makes it exact (smartcase).
keys: [/, "?", n, N, "*", d/]
tasks:
  - goal: 'Change "backwards" to "ahead".'
    start: |-
      ▮The slash leans forward,
      so it searches backwards
    target: |-
      The slash leans forward,
      so it searches ahead
    solution: '/b<CR>cwahead<Esc>'
    hint: 'Search for as little as you need. /b<Enter> lands on backwards already.'
    variants:
      - goal: 'Change "back" to "forward".'
        start: |-
          ▮Searching forward,
          the slash leans back
        target: |-
          Searching forward,
          the slash leans forward
        solution: '/b<CR>cwforward<Esc>'
      - goal: 'Change "guess" to "match".'
        start: |-
          ▮Search is a motion:
          d/ deletes up to a guess
        target: |-
          Search is a motion:
          d/ deletes up to a match
        solution: '/g<CR>cwmatch<Esc>'
  - goal: 'Delete the hedging before "Search".'
    start: |-
      ▮er, like, honestly, Search is a motion
    target: |-
      Search is a motion
    solution: 'd/S<CR>'
    hint: 'd/S<Enter> deletes up to the next S (uppercase, so the search is exact).'
    variants:
      - goal: 'Delete the hedging before "Slash".'
        start: |-
          ▮so, basically, Slash leans forward
        target: |-
          Slash leans forward
        solution: 'd/S<CR>'
      - goal: 'Delete the hedging before "So".'
        start: |-
          ▮um, well, so, So d/ goes till it
        target: |-
          So d/ goes till it
        solution: 'd/S<CR>'
  - goal: 'Rename the second "starred" to found.'
    ft: python
    start: |-
      ▮starred = "this word"
      next_one = starred
    target: |-
      starred = "this word"
      next_one = found
    solution: '*ciwfound<Esc>'
    hint: '* stars the word under the cursor and jumps to its next match.'
    variants:
      - goal: 'Rename the second whole word "star" to match.'
        start: |-
          ▮star = "*"
          found = star
        target: |-
          star = "*"
          found = match
        solution: '*ciwmatch<Esc>'
      - goal: 'Rename the second "marked" to found.'
        ft: python
        start: |-
          ▮marked = "this word"
          then = marked
        target: |-
          marked = "this word"
          then = found
        solution: '*ciwfound<Esc>'
  - goal: 'Delete the third "next".'
    start: |-
      n means ▮next, and N means the next next one back.
    target: |-
      n means next, and N means the next one back.
    solution: '*ndaw'
    hint: '* goes to the second next, n to the third, daw deletes it.'
    variants:
      - goal: 'Delete the third "star".'
        start: |-
          The ▮star finds the next star, then the star star after.
        target: |-
          The star finds the next star, then the star after.
      - goal: 'Delete the third "back".'
        start: |-
          N goes ▮back, n goes on, so go back back once.
        target: |-
          N goes back, n goes on, so go back once.
  - goal: 'Change the last "forward" to "backward", searching backwards.'
    start: |-
      / leans forward and searches forward; ? asks forward, from the en▮d.
    target: |-
      / leans forward and searches forward; ? asks backward, from the end.
    solution: '?fo<CR>cwbackward<Esc>'
    hint: '?fo<Enter> asks backwards from the cursor.'
    variants:
      - goal: 'Change the last "forward" to "backward", searching backwards.'
        start: |-
          ? asks backward; / leans forward; ? looks forward from the en▮d.
        target: |-
          ? asks backward; / leans forward; ? looks backward from the end.
        solution: '?fo<CR>cwbackward<Esc>'
      - goal: 'Change the last "forward" to "backward", searching backwards.'
        start: |-
          the slash goes forward; ? asks forward, from the en▮d.
        target: |-
          the slash goes forward; ? asks backward, from the end.
        solution: '?fo<CR>cwbackward<Esc>'
