week: 1
day: 3
title: Sentences and paragraphs
skill: text-objects
intro: |
  Bigger nouns: `s` is a *sentence* and `p` a *paragraph* (a block of lines
  between empty lines). `is`/`ip` are the thing itself; `as`/`ap` take the
  space or empty line after it too, so `dap` leaves no gap. Any verb works on
  them, including `>` (the arrow points the way the text moves) and `y`.
keys: [dap, yap, cis, das, ">ip"]
tasks:
  - goal: 'Delete the middle paragraph.'
    start: |-
      dap deletes a paragraph.

      This paragraph ▮is padding.
      It can go.

      It leaves no double gap behind.
    target: |-
      dap deletes a paragraph.

      It leaves no double gap behind.
    solution: 'dap'
    hint: 'd deletes, a takes the empty line after it, p is the paragraph.'
    variants:
      - start: |-
          a is around: the paragraph and the blank line after it.

          This line ▮is filler.
          So is this one.

          One gap stays.
        target: |-
          a is around: the paragraph and the blank line after it.

          One gap stays.
      - goal: 'Delete the middle paragraph.'
        start: |-
          a paragraph runs to the blank line.

          This block goes▮.
          All of it.

          It leaves no double gap behind.
        target: |-
          a paragraph runs to the blank line.

          It leaves no double gap behind.
        solution: 'dap'
  - goal: 'Duplicate the first paragraph.'
    start: |-
      ▮yap yanks a paragraph; P puts it above.

      Done.
    target: |-
      yap yanks a paragraph; P puts it above.

      yap yanks a paragraph; P puts it above.

      Done.
    solution: 'yapP'
    hint: 'yap yanks a paragraph with its empty line; P puts it above the cursor.'
    variants:
      - start: |-
          ▮P puts above, p puts below.

          Done.
        target: |-
          P puts above, p puts below.

          P puts above, p puts below.

          Done.
      - goal: 'Duplicate the first paragraph.'
        start: |-
          ▮y yanks, a is around, p is paragraph.

          Done.
        target: |-
          y yanks, a is around, p is paragraph.

          y yanks, a is around, p is paragraph.

          Done.
        solution: 'yapP'
  - goal: 'Fix the wrong sentence: it should say "A sentence ends at a full stop."'
    start: |-
      s is for sentence. A sentence ends at a ▮comma. cis changes just one.
    target: |-
      s is for sentence. A sentence ends at a full stop. cis changes just one.
    solution: 'cisA sentence ends at a full stop.<Esc>'
    hint: 'cis changes the inner sentence and leaves the spaces around it.'
    variants:
      - goal: 'Fix the wrong sentence: it should say "The i means inner."'
        start: |-
          cis keeps the spaces. The i means ▮around. das takes one along.
        target: |-
          cis keeps the spaces. The i means inner. das takes one along.
        solution: 'cisThe i means inner.<Esc>'
      - goal: 'Fix the wrong sentence: it should say "A sentence ends at a full stop."'
        start: |-
          c changes. A sentence ends at a ▮comma. The next one stays.
        target: |-
          c changes. A sentence ends at a full stop. The next one stays.
        solution: 'cisA sentence ends at a full stop.<Esc>'
  - goal: 'Delete the middle sentence.'
    start: |-
      das deletes a sentence. This one ▮is wrong. Its space goes too.
    target: |-
      das deletes a sentence. Its space goes too.
    solution: 'das'
    hint: 'das deletes a sentence plus the space after it.'
    variants:
      - start: |-
          a is around: a sentence and its space. This sentence ▮is spare. The next one moves up.
        target: |-
          a is around: a sentence and its space. The next one moves up.
      - goal: 'Delete the middle sentence.'
        start: |-
          d deletes. This sent▮ence goes. a takes the space.
        target: |-
          d deletes. a takes the space.
        solution: 'das'
  - goal: 'Indent the three lines.'
    start: |-
      What ip covers:

      ▮this line
      this line
      and this one
    target: |-
      What ip covers:

          this line
          this line
          and this one
    solution: '>ip'
    hint: '> points right, ip is the inner paragraph. (Indent here is 4 spaces.)'
    variants:
      - goal: 'Indent the three lines.'
        start: |-
          > pushes right:

          ▮one
          two
          three
        target: |-
          > pushes right:

              one
              two
              three
      - goal: 'Indent the three lines.'
        start: |-
          i is inner, p is paragraph:

          ▮the block
          the block
          then > indents
        target: |-
          i is inner, p is paragraph:

              the block
              the block
              then > indents
        solution: '>ip'
