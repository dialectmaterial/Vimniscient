week: 6
day: 3
title: 'Real edits: data'
skill: mixed
intro: |
  CSV, logs and lists: swap columns, pull out fields, filter and sort.
keys: [':%s/\v( )', ':g/pat/d', ':sort n']
tasks:
  - goal: 'Swap the two columns.'
    start: |-
      ▮key,meaning
      q,record
      y,yank
    target: |-
      meaning,key
      record,q
      yank,y
    solution: ':%s/\v(.*),(.*)/\2,\1<CR>'
    hint: 'Two groups around the comma, swapped in the replacement.'
    variants:
      - goal: 'Swap the two columns.'
        start: |-
          ▮word,gloss
          Hund,dog
          Katze,cat
        target: |-
          gloss,word
          dog,Hund
          cat,Katze
      - start: |-
          ▮name,year
          Miller,1956
          Cowan,2001
        target: |-
          year,name
          1956,Miller
          2001,Cowan
      - start: |-
          ▮op,means
          c,change
          d,delete
        target: |-
          means,op
          change,c
          delete,d
  - goal: 'Keep only the email addresses.'
    start: |-
      ▮id 1, email: sapir@yale.edu
      id 2, email: boas@columbia.edu
    target: |-
      sapir@yale.edu
      boas@columbia.edu
    solution: ':%s/.*email: //<CR>'
    hint: 'Delete everything up to and including "email: ".'
    variants:
      - goal: 'Keep only the email addresses.'
        start: |-
          ▮id 3, email: labov@upenn.edu
          id 4, email: eckert@stanford.edu
        target: |-
          labov@upenn.edu
          eckert@stanford.edu
      - start: |-
          ▮id 5, email: spaced@example.org
          id 6, email: tested@example.org
        target: |-
          spaced@example.org
          tested@example.org
      - start: |-
          ▮id 7, email: recall@example.com
          id 8, email: review@example.com
        target: |-
          recall@example.com
          review@example.com
  - goal: 'Sort the reviews by their day.'
    start: |-
      ▮third review 30
      first review 1
      second review 7
    target: |-
      first review 1
      second review 7
      third review 30
    solution: ':sort n<CR>'
    hint: ':sort n sorts by the first number on each line, wherever it is.'
    variants:
      - goal: 'Sort the courses by their number.'
        start: |-
          ▮pragmatics 4
          syntax 3
          semantics 2
        target: |-
          semantics 2
          syntax 3
          pragmatics 4
      - goal: 'Sort the researchers by year.'
        start: |-
          ▮Cowan 2001
          Ebbinghaus 1885
          Miller 1956
        target: |-
          Ebbinghaus 1885
          Miller 1956
          Cowan 2001
      - goal: 'Sort the stages by their number.'
        start: |-
          ▮autonomous 3
          cognitive 1
          associative 2
        target: |-
          cognitive 1
          associative 2
          autonomous 3
  - goal: 'Drop the DEBUG lines, then the timestamps.'
    start: |-
      ▮10:01 INFO tagging started
      10:02 DEBUG token 17
      10:03 INFO tagging done
    target: |-
      INFO tagging started
      INFO tagging done
    solution: ':g/DEBUG/d<CR>:%s/^\S\+ //<CR>'
    hint: ':g/DEBUG/d first, then \S\+ (everything up to the first space) at the start of each line.'
    variants:
      - goal: 'Drop the DEBUG lines, then the timestamps.'
        start: |-
          ▮09:00 INFO parsing started
          09:01 DEBUG node 4
          09:02 INFO parsing done
        target: |-
          INFO parsing started
          INFO parsing done
      - start: |-
          ▮08:00 INFO review started
          08:01 DEBUG card 12
          08:02 INFO review done
        target: |-
          INFO review started
          INFO review done
      - start: |-
          ▮07:30 INFO macro recorded
          07:31 DEBUG register a
          07:32 INFO macro played
        target: |-
          INFO macro recorded
          INFO macro played
