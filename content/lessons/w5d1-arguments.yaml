week: 5
day: 1
lazyvim: true
title: Arguments (LazyVim)
skill: text-objects
intro: |
  LazyVim adds text objects through mini.ai. Here `a` names an *argument*:
  `ia` is the argument itself and `aa` an argument with its comma (the
  second `a` is a noun, the first one *around*): `cia` changes one, `daa` deletes it together with its comma, so
  the list stays tidy. Like all mini.ai objects it also finds the next
  argument when the cursor isn't on one yet.
keys: [cia, daa]
tasks:
  - goal: 'Change the middle argument to argument.'
    ft: python
    start: |-
      ia(commas, ▮old, stay)
    target: |-
      ia(commas, argument, stay)
    solution: 'ciaargument<Esc>'
    hint: 'cia changes the argument under the cursor.'
    variants:
      - goal: 'Change "wrong" to "argument".'
        start: |-
          a(between, ▮wrong, commas)
        target: |-
          a(between, argument, commas)
        solution: 'ciaargument<Esc>'
      - goal: 'Change "old" to "new".'
        start: |-
          args(first, ▮old, last)
        target: |-
          args(first, new, last)
        solution: 'cianew<Esc>'
  - goal: 'Delete the middle argument and its comma.'
    ft: python
    start: |-
      daa(keep, ▮drop, keep)
    target: |-
      daa(keep, keep)
    solution: 'daa'
    hint: 'daa takes the comma with it.'
    variants:
      - start: |-
          args(first, ▮comma_too, last)
        target: |-
          args(first, last)
      - start: |-
          ia(first, ▮gone, last)
        target: |-
          ia(first, last)
  - goal: 'Delete the last argument.'
    ft: python
    start: |-
      daa(first, then, ▮last)
    target: |-
      daa(first, then)
    solution: 'daa'
    hint: 'For the last argument, daa removes the comma before it.'
    variants:
      - start: |-
          args(one, two, ▮gone)
        target: |-
          args(one, two)
      - start: |-
          aa(one, two, ▮tail)
        target: |-
          aa(one, two)
  - goal: 'Drop the arg parameter.'
    ft: python
    start: |-
      def delete(self, ▮arg, keep):
    target: |-
      def delete(self, keep):
    solution: 'daa'
    hint: 'daa works on parameters too.'
    variants:
      - goal: 'Drop the param parameter.'
        start: |-
          def drop(self, ▮param, other):
        target: |-
          def drop(self, other):
      - goal: 'Drop the param parameter.'
        ft: python
        start: |-
          def remove(self, ▮param, stays):
        target: |-
          def remove(self, stays):
        solution: 'daa'
  - goal: 'Change the first argument to hook, starting from the beginning of the line.'
    ft: python
    start: |-
      ▮ia(next, arg)
    target: |-
      ia(hook, arg)
    solution: 'ciahook<Esc>'
    hint: 'mini.ai jumps to the next argument when the cursor isn''t on one.'
    variants:
      - goal: 'Change the first argument to "hook", from the start of the line.'
        start: |-
          ▮args(first, second)
        target: |-
          args(hook, second)
        solution: 'ciahook<Esc>'
      - goal: 'Change the old argument to "hook", from the start of the line.'
        start: |-
          ▮aa(old, stay)
        target: |-
          aa(hook, stay)
        solution: 'ciahook<Esc>'
