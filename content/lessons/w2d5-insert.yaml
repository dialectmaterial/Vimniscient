week: 2
day: 5
title: Getting into insert mode well
skill: edits
intro: |
  Choosing the right way into insert mode saves moving first: `o`/`O` *open*
  a line below/above, `ea` goes to the *end* of a word and *appends*, `R`
  keeps *replacing* (you type over text), `r` replaces one character without
  entering insert mode, and a count repeats what you type (`5i=<Esc>`). While
  typing, `Ctrl-w` wipes the last word and `Ctrl-u` undoes the whole line, so
  you rarely need Backspace.
keys: [o, O, ea, R, r, 5i, "<C-w>", "<C-u>"]
tasks:
  - goal: 'Add the line "below" between them.'
    start: |-
      ▮o opens a line
      O opens one above
    target: |-
      o opens a line
      below
      O opens one above
    solution: 'obelow<Esc>'
    hint: 'o opens a new line below and starts insert mode.'
    variants:
      - goal: 'Add the line "o goes below" between them.'
        start: |-
          ▮o is open
          O goes above
        target: |-
          o is open
          o goes below
          O goes above
        solution: 'oo goes below<Esc>'
      - goal: 'Add the line "below" between them.'
        start: |-
          ▮o makes room
          O makes room above
        target: |-
          o makes room
          below
          O makes room above
        solution: 'obelow<Esc>'
  - goal: 'Add the line "O opened this one above" above.'
    start: |-
      ▮this line
    target: |-
      O opened this one above
      this line
    solution: 'OO opened this one above<Esc>'
    hint: 'Capital O opens a line above.'
    variants:
      - goal: 'Add the line "O opens above" above.'
        start: |-
          ▮below
        target: |-
          O opens above
          below
        solution: 'OO opens above<Esc>'
      - goal: 'Add the line "O opens above" above.'
        start: |-
          ▮this stays
        target: |-
          O opens above
          this stays
        solution: 'OO opens above<Esc>'
  - goal: 'Fix "append" to "appends".'
    start: |-
      e goes to the end, and a ▮append after it.
    target: |-
      e goes to the end, and a appends after it.
    solution: 'eas<Esc>'
    hint: 'e goes to the end of the word, a appends after it.'
    variants:
      - goal: 'Fix "append" to "appends".'
        start: |-
          e moves, then a ▮append after the word.
        target: |-
          e moves, then a appends after the word.
      - goal: 'Fix "append" to "appends".'
        start: |-
          e lands on the last letter, and a ▮append after it.
        target: |-
          e lands on the last letter, and a appends after it.
        solution: 'eas<Esc>'
  - goal: 'Underline the title with five = signs.'
    start: |-
      5i= types five
      ▮
    target: |-
      5i= types five
      =====
    solution: '5i=<Esc>'
    hint: 'A count before i repeats the inserted text.'
    variants:
      - goal: 'Underline the title with five = signs.'
        start: |-
          A count repeats i
          ▮
        target: |-
          A count repeats i
          =====
      - goal: 'Underline the title with five = signs.'
        start: |-
          Five = signs from 5i=
          ▮
        target: |-
          Five = signs from 5i=
          =====
        solution: '5i=<Esc>'
  - goal: 'Type the date 2026-10-26 over the zeros.'
    start: |-
      R overwrites: ▮0000-00-00
    target: |-
      R overwrites: 2026-10-26
    solution: 'R2026-10-26<Esc>'
    hint: 'R keeps replacing: it types over the existing characters.'
    variants:
      - goal: 'Type the date 2026-11-02 over the placeholder.'
        start: |-
          R is Replace mode: ▮YYYY-MM-DD
        target: |-
          R is Replace mode: 2026-11-02
        solution: 'R2026-11-02<Esc>'
      - goal: 'Type the date 2026-10-26 over the zeros.'
        start: |-
          Replace mode types over: ▮0000-00-00
        target: |-
          Replace mode types over: 2026-10-26
        solution: 'R2026-10-26<Esc>'
  - goal: 'Fix "keplaces" to "replaces".'
    start: |-
      r ▮keplaces one letter
    target: |-
      r replaces one letter
    solution: 'rr'
    hint: 'r replaces one character and stays in normal mode. Here that''s r, then r.'
    variants:
      - goal: 'Fix "mot" to "dot".'
        start: |-
          The ▮mot command repeats
        target: |-
          The dot command repeats
        solution: 'rd'
      - goal: 'Fix "keplaces" to "replaces".'
        start: |-
          r ▮keplaces a single letter
        target: |-
          r replaces a single letter
        solution: 'rr'
