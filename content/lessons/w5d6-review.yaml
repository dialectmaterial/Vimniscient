week: 5
day: 6
review: true
lazyvim: true
title: Week 5 review
skill: mixed
intro: |
  LazyVim's text objects and comments, mixed. Try saying each object's name
  aloud as you type it: argument, quote, bracket, function, element. Words
  said aloud are remembered better than words read silently (the production
  effect).
keys: [daa, ciq, cib, cif, cie, gcc]
tasks:
  - goal: 'Remove the debug argument.'
    ft: python
    start: |-
      run(cmd, ▮debug=True, timeout=5)
    target: |-
      run(cmd, timeout=5)
    solution: 'daa'
    hint: 'daa'
    variants:
      - goal: 'Remove the verbose argument.'
        start: |-
          load(path, ▮verbose=True, limit=9)
        target: |-
          load(path, limit=9)
      - goal: 'Remove the hint argument.'
        start: |-
          review(card, ▮hint=True, gap=7)
        target: |-
          review(card, gap=7)
      - goal: 'Remove the reverse argument.'
        start: |-
          sort(lines, ▮reverse=True, key=len)
        target: |-
          sort(lines, key=len)
  - goal: 'Change the path to /tmp.'
    ft: python
    start: |-
      open(▮'/home/user/file')
    target: |-
      open('/tmp')
    solution: 'ciq/tmp<Esc>'
    hint: 'ciq'
    variants:
      - goal: 'Change the path to /srv.'
        start: |-
          open(▮'/data/corpus.txt')
        target: |-
          open('/srv')
        solution: 'ciq/srv<Esc>'
      - start: |-
          open(▮'/home/user/notes.md')
        target: |-
          open('/tmp')
        solution: 'ciq/tmp<Esc>'
      - goal: 'Change the path to /srv.'
        start: |-
          open(▮'/var/log/review.log')
        target: |-
          open('/srv')
        solution: 'ciq/srv<Esc>'
  - goal: 'Change the variable name userId to accountId.'
    ft: python
    start: |-
      ▮userId = 1
    target: |-
      accountId = 1
    solution: 'cieaccount<Esc>'
    hint: 'The first sub-word is user; cie changes just that.'
    variants:
      - goal: 'Change the variable name wordCount to tokenCount.'
        start: |-
          ▮wordCount = 0
        target: |-
          tokenCount = 0
        solution: 'cietoken<Esc>'
        hint: 'The first sub-word is word; cie changes just that.'
  - goal: 'Comment out the print.'
    ft: python
    start: |-
      x = 1
      ▮print(x)
    target: |-
      x = 1
      # print(x)
    solution: 'gcc'
    hint: 'gcc'
    variants:
      - goal: 'Comment out the print.'
        start: |-
          y = 2
          ▮print(y)
        target: |-
          y = 2
          # print(y)
      - start: |-
          z = 3
          ▮print(z)
        target: |-
          z = 3
          # print(z)
