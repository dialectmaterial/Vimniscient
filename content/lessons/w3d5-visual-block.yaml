week: 3
day: 5
title: Visual block
skill: visual
intro: |
  `Ctrl-v` cuts a vertical block out of the text: a rectangle. Then `I` inserts before it on every line,
  `A` appends after it (`$A` appends at each line's end, even when the lines
  differ in length), `c` changes it, `d` deletes it, and `g Ctrl-a`
  numbers the selected lines 1, 2, 3 …
keys: ['<C-v>', '<C-v>I', '<C-v>$A', '<C-v>c', '<C-v>d', 'g<C-a>']
tasks:
  - goal: 'Comment out the three lines with "# ".'
    generate: block-prefix
    ft: python
    start: |-
      ▮block = "Ctrl-v"
      shape = "rectangle"
      cut = "vertical"
    target: |-
      # block = "Ctrl-v"
      # shape = "rectangle"
      # cut = "vertical"
    solution: '<C-v>jjI# <Esc>'
    hint: 'Ctrl-v j j selects the first column, I# <Esc> types on every line.'
    variants:
      - start: |-
          ▮q = "record"
          at = "play"
          dot = "again"
        target: |-
          # q = "record"
          # at = "play"
          # dot = "again"
  - goal: 'Add a semicolon to lines of different lengths.'
    generate: block-append
    start: |-
      ▮d = 1
      dd = 2
      d3w = 3
    target: |-
      d = 1;
      dd = 2;
      d3w = 3;
    solution: '<C-v>jj$A;<Esc>'
    hint: '$ in block mode stretches to every line''s end, so A appends after each one.'
    variants:
      - start: |-
          ▮end = 1
          end2 = 3
          end_three = 7
        target: |-
          end = 1;
          end2 = 3;
          end_three = 7;
  - goal: 'Delete the "1 | " column.'
    start: |-
      ▮1 | block
      2 | column
      3 | rectangle
    target: |-
      block
      column
      rectangle
    solution: '<C-v>jj3ld'
    hint: 'Ctrl-v j j, widen the block with 3l, then d.'
    variants:
      - start: |-
          ▮1 | Ctrl-v
          2 | cuts a
          3 | block
        target: |-
          Ctrl-v
          cuts a
          block
      - start: |-
          ▮1 | block
          2 | mode
          3 | cuts
        target: |-
          block
          mode
          cuts
  - goal: 'Number the lines 1, 2, 3.'
    start: |-
      ▮0. Ctrl-v
      0. then g
      0. then Ctrl-a
    target: |-
      1. Ctrl-v
      2. then g
      3. then Ctrl-a
    solution: '<C-v>jjg<C-a>'
    hint: 'g Ctrl-a adds 1 to the first line, 2 to the second, 3 to the third.'
    variants:
      - start: |-
          ▮0. record
          0. stop
          0. replay
        target: |-
          1. record
          2. stop
          3. replay
      - start: |-
          ▮0. first
          0. second
          0. third
        target: |-
          1. first
          2. second
          3. third
  - goal: 'Change every "block" to "cut" at once.'
    start: |-
      ▮block: line 1
      block: line 2
      block: line 3
    target: |-
      cut: line 1
      cut: line 2
      cut: line 3
    solution: '<C-v>jjeccut<Esc>'
    hint: 'Select the block with Ctrl-v j j e, then c types the new text on every line.'
    variants:
      - goal: 'Change every "old" to "block" at once.'
        start: |-
          ▮old: line 1
          old: line 2
          old: line 3
        target: |-
          block: line 1
          block: line 2
          block: line 3
        solution: '<C-v>jjecblock<Esc>'
      - goal: 'Change every "draft" to "block" at once.'
        start: |-
          ▮draft: row 1
          draft: row 2
          draft: row 3
        target: |-
          block: row 1
          block: row 2
          block: row 3
        solution: '<C-v>jjecblock<Esc>'
