week: 5
day: 4
lazyvim: true
title: Sub-words, numbers, calls (LazyVim)
skill: text-objects
intro: |
  More of LazyVim's mini.ai objects: `e` is an *element*, one part of a
  camelCase or snake_case word; `d` is *digits*, a number; `u` is a *use* of
  a function, a call (`au` takes the name and its arguments); and `g` is
  *global*, the whole buffer. And there's a small built-in: `]<Space>` adds a
  blank line below without leaving normal mode (`]` goes down, and a space is
  what it adds).
keys: [cie, cid, cau, cag, ']<Space>']
tasks:
  - goal: 'Change Old to Segment in the camelCase name.'
    start: |-
      element▮OldPlan
    target: |-
      elementSegmentPlan
    solution: 'cieSegment<Esc>'
    hint: 'ie is the sub-word under the cursor.'
    variants:
      - goal: 'Change the sub-word "Old" to "Element".'
        start: |-
          word▮OldPart
        target: |-
          wordElementPart
        solution: 'cieElement<Esc>'
      - goal: 'Change the sub-camel "Bad" to "Hump".'
        start: |-
          camel▮BadCase
        target: |-
          camelHumpCase
        solution: 'cieHump<Esc>'
  - goal: 'Change old to segment in the snake_case name.'
    start: |-
      element_▮old_name
    target: |-
      element_segment_name
    solution: 'ciesegment<Esc>'
    hint: 'The same ie works between underscores.'
    variants:
      - goal: 'Change the sub-word "old" to "element".'
        start: |-
          snake_▮old_case
        target: |-
          snake_element_case
        solution: 'cieelement<Esc>'
      - goal: 'Change the sub-word "bad" to "score".'
        start: |-
          under_▮bad_line
        target: |-
          under_score_line
        solution: 'ciescore<Esc>'
  - goal: 'Change the digits to 16000.'
    start: |-
      digits = 44▮100
    target: |-
      digits = 16000
    solution: 'cid16000<Esc>'
    hint: 'id is the number under the cursor.'
    variants:
      - goal: 'Change the number to 4.'
        start: |-
          d_is_digits = 1▮2
        target: |-
          d_is_digits = 4
        solution: 'cid4<Esc>'
      - goal: 'Change the number to 4.'
        start: |-
          id_digits = 1▮2
        target: |-
          id_digits = 4
        solution: 'cid4<Esc>'
  - goal: 'Replace the whole call with usage.'
    ft: python
    start: |-
      call = ▮use(a, b) + 1
    target: |-
      call = usage + 1
    solution: 'cauusage<Esc>'
    hint: 'au is a function call with its name and arguments.'
    variants:
      - goal: 'Replace the whole use(f, x) call with 0.'
        start: |-
          z = ▮use(f, x) - 1
        target: |-
          z = 0 - 1
        solution: 'cau0<Esc>'
      - goal: 'Replace the whole call(f, x) call with 0.'
        start: |-
          u = ▮call(f, x) - 1
        target: |-
          u = 0 - 1
        solution: 'cau0<Esc>'
  - goal: 'Replace the entire file with the word global.'
    start: |-
      ▮g is
      the whole
      buffer
    target: |-
      global
    solution: 'cagglobal<Esc>'
    hint: 'ag is the whole buffer.'
    variants:
      - goal: 'Replace the whole buffer with "the whole file".'
        start: |-
          ▮everything
          goes
          globally
        target: |-
          the whole file
        solution: 'cagthe whole file<Esc>'
      - goal: 'Replace the whole buffer with "the whole file".'
        start: |-
          ▮a
          g
          all
        target: |-
          the whole file
        solution: 'cagthe whole file<Esc>'
  - goal: 'Add a blank line below without entering insert mode.'
    start: |-
      ▮] goes down
      and a space is what it adds
    target: |-
      ] goes down

      and a space is what it adds
    solution: ']<Space>'
    hint: ']<Space> adds an empty line below, [<Space> one above.'
    variants:
      - goal: 'Add a blank line below without entering insert mode.'
        start: |-
          ▮] adds below
          [ adds above
        target: |-
          ] adds below

          [ adds above
      - goal: 'Add a blank line below without entering insert mode.'
        start: |-
          ▮] is below
          [ is above
        target: |-
          ] is below

          [ is above
        solution: ']<Space>'
