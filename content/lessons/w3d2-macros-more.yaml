week: 3
day: 2
title: Smarter macros
skill: macros
intro: |
  A macro can search (`/TODO<Enter>` inside it finds the next one), use
  `Ctrl-a`, and run on a range with `:2,$norm @a` (*norm* for normal mode:
  it types the keys on each line). `@@` plays again at the same place: the
  last macro you played.
keys: ['/ in a macro', '@@', ':norm @a', 'yyp<C-a>']
tasks:
  - goal: 'Uppercase the word after every TODO.'
    start: |-
      ▮1 TODO record this
      2 nothing here
      3 TODO stop that
      4 TODO replay it
    target: |-
      1 TODO RECORD this
      2 nothing here
      3 TODO STOP that
      4 TODO REPLAY it
    solution: 'qa/TODO<CR>wgUiwq2@a'
    hint: 'Let the macro find its own place: /TODO<Enter> w gUiw.'
    variants:
      - start: |-
          ▮x TODO macro it
          y skip
          z TODO record this
          w TODO play that
        target: |-
          x TODO MACRO it
          y skip
          z TODO RECORD this
          w TODO PLAY that
      - start: |-
          ▮x TODO run it
          y skip
          z TODO find this
          w TODO fix that
        target: |-
          x TODO RUN it
          y skip
          z TODO FIND this
          w TODO FIX that
  - goal: 'Turn every comma into " | ", using @a once and then @@.'
    start: |-
      ▮q,record
      @,play
      @@,again
    target: |-
      q | record
      @ | play
      @@ | again
    solution: 'qa0f,xi | <Esc>jq@a@@'
    hint: '0 f, x deletes the comma, i | <Esc> inserts the separator, j moves on. Then @a, then @@.'
    variants:
      - start: |-
          ▮key,hook
          f,find
          t,till
        target: |-
          key | hook
          f | find
          t | till
      - start: |-
          ▮verb,hook
          d,delete
          c,change
        target: |-
          verb | hook
          d | delete
          c | change
  - goal: 'Put every line in parentheses: record on the first line, then use :norm for the rest.'
    start: |-
      ▮record
      stop
      play
      replay
    target: |-
      (record)
      (stop)
      (play)
      (replay)
    solution: 'qaI(<Esc>A)<Esc>q:2,$norm @a<CR>'
    hint: 'No j in this macro. :2,$norm @a runs it once on every line from 2 to the end.'
    variants:
      - start: |-
          ▮q
          @a
          @@
          norm
        target: |-
          (q)
          (@a)
          (@@)
          (norm)
      - start: |-
          ▮q
          @a
          again
          dot
        target: |-
          (q)
          (@a)
          (again)
          (dot)
  - goal: 'Make a numbered list of four items.'
    start: |-
      ▮1. Copy the line, add one.
    target: |-
      1. Copy the line, add one.
      2. Copy the line, add one.
      3. Copy the line, add one.
      4. Copy the line, add one.
    solution: 'qayyp<C-a>q2@a'
    hint: 'yyp copies the line, Ctrl-a bumps its number. Record that, then 2@a.'
    variants:
      - start: |-
          ▮1. Record, then replay.
        target: |-
          1. Record, then replay.
          2. Record, then replay.
          3. Record, then replay.
          4. Record, then replay.
      - start: |-
          ▮1. Yank, put, add one.
        target: |-
          1. Yank, put, add one.
          2. Yank, put, add one.
          3. Yank, put, add one.
          4. Yank, put, add one.
