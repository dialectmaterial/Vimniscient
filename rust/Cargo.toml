[package]
name = "vimniscient"
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Absolute vim: a daily trainer."
license = "AGPL-3.0-or-later"
repository = "https://github.com/dialectmaterial/Vimniscient"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fancy-regex = "0.16"
indexmap = "2"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
ureq = "3"

[dev-dependencies]
serde_json = "1"
